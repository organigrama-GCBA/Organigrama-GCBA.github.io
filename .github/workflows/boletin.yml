name: Boletín → Organigrama

on:
  schedule:
    # 12:00 UTC ≈ 09:00 ART, días hábiles
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha YYYY-MM-DD (vacío = hoy, hora ARG)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias del script
        run: npm install --prefix scripts/boletin

      - name: Procesar boletín
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FECHA: ${{ inputs.fecha }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}   # opcional; default en el script
          BODY_PATH: ${{ runner.temp }}/pr-body.md
        run: node scripts/boletin/run.mjs

      - name: Subir rama con los cambios
        if: steps.run.outputs.changed == 'true'
        env:
          FECHA: ${{ steps.run.outputs.fecha }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          branch="boletin/${FECHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/organigrama.json data/boletin
          git commit -m "Cambios del Boletín Oficial ${FECHA}"
          git push -f origin "$branch"
          url="https://github.com/${REPO}/compare/main...${branch}?expand=1"
          echo "## Boletín ${FECHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Rama subida: \`${branch}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "👉 [Abrir Pull Request para revisar](${url})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Resumen de cambios: \`data/boletin/${FECHA}.md\` (en el diff de la rama)." >> "$GITHUB_STEP_SUMMARY"
