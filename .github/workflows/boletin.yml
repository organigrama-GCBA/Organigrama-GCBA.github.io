name: Boletín → Organigrama

on:
  schedule:
    # 18:00 UTC ≈ 15:00 ART, días hábiles (más tarde para que el Boletín del
    # día ya esté publicado; antes corría 09:00 ART y a veces aún no existía → 404).
    - cron: "0 18 * * 1-5"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha YYYY-MM-DD (vacío = hoy, hora ARG)"
        required: false
        type: string
      desde:
        description: "Backfill: fecha inicial YYYY-MM-DD (opcional)"
        required: false
        type: string
      hasta:
        description: "Backfill: fecha final YYYY-MM-DD (opcional)"
        required: false
        type: string
      dump:
        description: "Diagnóstico: subir el texto extraído como artifact"
        required: false
        default: false
        type: boolean
      buscar:
        description: "Diagnóstico: regex a buscar en los volcados (requiere dump)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias del script
        run: npm install --prefix scripts/boletin

      - name: Procesar boletín
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FECHA: ${{ inputs.fecha }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}   # Sonnet por defecto (más barato que Opus)
          BODY_PATH: ${{ runner.temp }}/pr-body.md
          DUMP_TEXT: ${{ inputs.dump && '1' || '' }}
        run: node scripts/boletin/run.mjs

      # Diagnóstico: el texto de cada etapa del pipeline, para ver qué recibió
      # realmente el modelo cuando no detecta cambios. Los dumps quedan sin
      # trackear (.gitignore), así que no entran en el commit del PR.
      - name: Subir texto extraído (diagnóstico)
        if: always() && inputs.dump
        uses: actions/upload-artifact@v4
        with:
          name: boletin-dump-${{ steps.run.outputs.fecha || github.run_id }}
          path: |
            boletin-*.txt
            boletin-*.json
          if-no-files-found: warn
          retention-days: 7

      # En qué etapa del pipeline se pierde un texto concreto. Imprime las
      # coincidencias en el log, que es accesible aunque el artifact no lo sea.
      - name: Buscar en el texto extraído (diagnóstico)
        if: always() && inputs.dump && inputs.buscar != ''
        env:
          BUSCAR: ${{ inputs.buscar }}
        run: |
          echo "Buscando /$BUSCAR/ en los volcados:"
          for f in boletin-*.txt boletin-*.json; do
            [ -e "$f" ] || continue
            n=$(grep -ciE -- "$BUSCAR" "$f" || true)
            echo "=== $f — $(wc -c < "$f") bytes — $n línea(s) con coincidencia"
            [ "$n" -gt 0 ] && grep -inE -m 4 -B 2 -A 6 -- "$BUSCAR" "$f" | head -60
          done
          echo "(fin de la búsqueda)"

      - name: Crear Pull Request (o dejar link)
        if: steps.run.outputs.changed == 'true'
        env:
          FECHA: ${{ steps.run.outputs.fecha }}
          APLICADOS: ${{ steps.run.outputs.aplicados }}
          OMITIDOS: ${{ steps.run.outputs.omitidos }}
          REPO: ${{ github.repository }}
          BODY_PATH: ${{ runner.temp }}/pr-body.md
          # Usa un PAT si existe (evita el bloqueo de "Actions no puede crear PRs");
          # si no, usa el token por defecto (requiere habilitar el toggle del repo).
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -e
          branch="boletin/${FECHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/organigrama.json data/funciones.json data/boletin
          git commit -m "Cambios del Boletín Oficial ${FECHA}"
          git push -f origin "$branch"

          compare="https://github.com/${REPO}/compare/main...${branch}?expand=1"
          if [ "${APLICADOS:-0}" = "0" ]; then
            # Nada se pudo aplicar solo: el PR trae únicamente el informe, para
            # que alguien resuelva a mano lo que el script detectó.
            title="Boletín ${FECHA}: ${OMITIDOS} cambio(s) a revisar a mano"
          else
            title="Boletín ${FECHA}: cambios de organigrama"
          fi

          # Intentar crear el PR automáticamente; si falla (permiso), dejar link.
          if pr_url=$(gh pr create --base main --head "$branch" --title "$title" --body-file "$BODY_PATH" --assignee lubelrivero-design 2>/tmp/pr_err); then
            echo "## Boletín ${FECHA}" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ PR creado automáticamente: ${pr_url}" >> "$GITHUB_STEP_SUMMARY"
          else
            # El error va al log Y al summary, y el job falla. Si solo va al
            # summary y el paso termina OK, el workflow queda en verde con los
            # cambios atascados en la rama y sin PR: así pasaron desapercibidos
            # 16 días de cambios entre agosto y octubre de 2026.
            echo "::error::No se pudo crear el PR de ${branch}: $(tr '\n' ' ' < /tmp/pr_err)"
            cat /tmp/pr_err
            echo "## Boletín ${FECHA}" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ No se pudo crear el PR automáticamente:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/pr_err >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "👉 [Abrir el PR manualmente](${compare}) — o habilitá el PR automático (ver README)." >> "$GITHUB_STEP_SUMMARY"
            echo "La rama ${branch} quedó pusheada: los cambios no se pierden, pero hay que abrir el PR a mano."
            exit 1
          fi

      - name: Actualizar índice de cambios pendientes (para el panel de la app)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          gh pr list --state open --json title,url,headRefName,body \
            --jq '[ .[] | select(.headRefName|startswith("boletin/")) | {fecha:(.headRefName|sub("boletin/";"")), titulo:.title, url:.url, resumen:.body} ]' \
            > data/cambios-pendientes.json
          if ! git diff --quiet -- data/cambios-pendientes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/cambios-pendientes.json
            git commit -m "Actualizar índice de cambios pendientes del Boletín"
            git push origin main
          fi
