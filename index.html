<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#003D6E;--azul2:#005EA6;--azul3:#0070C0;
  --gris-bg:#F2F5F9;--gris-borde:#E2E8F0;--gris-texto:#718096;
  --texto:#1A202C;--texto2:#4A5568;
  /* editor */
  --ed-bg:#0f1117;--ed-surface:#1a1d27;--ed-surface2:#232636;
  --ed-border:#333650;--ed-border2:#444870;
  --ed-accent:#4f7ef8;--ed-text:#e8eaf2;--ed-text2:#9da3c4;--ed-text3:#6b7199;
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--gris-bg);color:var(--texto);height:100vh;overflow:hidden}

/* ── EDITOR PANE ── */
#ed-pane{position:fixed;inset:0;display:none;flex-direction:column;background:var(--ed-bg);z-index:50;}
#ed-pane.visible{display:flex;}
#ed-toolbar{height:44px;background:var(--ed-surface);border-bottom:1px solid var(--ed-border);
  display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;}
#ed-toolbar select{background:var(--ed-surface2);border:1px solid var(--ed-border2);color:var(--ed-text);
  font-family:inherit;font-size:11.5px;padding:4px 8px;border-radius:6px;outline:none;}
#ed-body{flex:1;display:flex;overflow:hidden;}
.ed-sidebar{width:230px;flex-shrink:0;background:var(--ed-surface);border-right:1px solid var(--ed-border);
  display:flex;flex-direction:column;overflow:hidden;}
.ed-sidebar-hd{padding:9px 12px;border-bottom:1px solid var(--ed-border);
  font-size:10px;font-weight:600;color:var(--ed-text3);text-transform:uppercase;letter-spacing:.06em;}
.ed-list{flex:1;overflow-y:auto;padding:4px;}
.ed-ni{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;
  cursor:pointer;border:1px solid transparent;transition:background .1s;}
.ed-ni:hover{background:var(--ed-surface2);}
.ed-ni.sel{background:rgba(79,126,248,.15);border-color:var(--ed-accent);}
.ed-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}
.ed-nm{font-size:11px;color:var(--ed-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.ed-tp{font-size:9px;color:var(--ed-text3);flex-shrink:0;}
#ed-canvas{flex:1;position:relative;overflow:hidden;}
#ed-canvas::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,var(--ed-border) 1px,transparent 1px);
  background-size:26px 26px;opacity:.3;pointer-events:none;}
#ed-canvas svg{width:100%;height:100%;}
.ed-zoom{position:absolute;bottom:14px;right:14px;display:flex;gap:3px;}
.ed-zb{width:28px;height:28px;border-radius:7px;background:var(--ed-surface);
  border:1px solid var(--ed-border);color:var(--ed-text2);font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ed-zb:hover{border-color:var(--ed-accent);color:var(--ed-accent);}
.ed-inspector{width:262px;flex-shrink:0;background:var(--ed-surface);
  border-left:1px solid var(--ed-border);display:flex;flex-direction:column;overflow:hidden;}
.ed-ins-hd{padding:9px 12px;border-bottom:1px solid var(--ed-border);
  font-size:10px;font-weight:600;color:var(--ed-text3);text-transform:uppercase;letter-spacing:.06em;
  display:flex;justify-content:space-between;align-items:center;}
.ed-ins-body{flex:1;overflow-y:auto;padding:12px;}
.ed-ins-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:6px;color:var(--ed-text3);}
.ed-ins-empty .ico{font-size:28px;opacity:.4;}
.ed-ins-empty p{font-size:11px;text-align:center;line-height:1.5;}
.ed-field{margin-bottom:11px;}
.ed-field label{font-size:10px;font-weight:600;color:var(--ed-text3);text-transform:uppercase;
  letter-spacing:.05em;display:block;margin-bottom:4px;}
.ed-field input,.ed-field select{width:100%;background:var(--ed-surface2);border:1px solid var(--ed-border);
  color:var(--ed-text);font-family:inherit;font-size:12px;padding:6px 9px;border-radius:6px;outline:none;}
.ed-field input:focus,.ed-field select:focus{border-color:var(--ed-accent);}
.ed-field select option{background:var(--ed-surface2);}
.ed-preview{border-radius:8px;padding:10px 12px;margin-bottom:12px;}
.ed-preview .ep-label{font-size:9px;font-weight:600;opacity:.65;text-transform:uppercase;letter-spacing:.05em;}
.ed-preview .ep-nombre{font-size:12px;font-weight:700;line-height:1.3;color:#fff;}
.ed-preview .ep-titular{font-size:10.5px;color:rgba(255,255,255,.75);}
.ed-actions{padding:9px 12px;border-top:1px solid var(--ed-border);display:flex;flex-direction:column;gap:5px;}
.ed-btn{padding:5px 12px;border-radius:7px;font-size:11.5px;font-weight:500;cursor:pointer;
  border:1px solid var(--ed-border);background:var(--ed-surface2);color:var(--ed-text);
  font-family:inherit;width:100%;text-align:left;}
.ed-btn:hover{border-color:var(--ed-accent);color:var(--ed-accent);}
.ed-btn.primary{background:var(--ed-accent);border-color:var(--ed-accent);color:#fff;}
.ed-btn.primary:hover{opacity:.85;}
.ed-btn.danger{border-color:#ef444455;color:#ef4444;}
.c-node rect{transition:filter .12s;}
.c-node:hover rect{filter:brightness(1.18);}
.c-node.sel rect{stroke:#fff;stroke-width:2;}
.c-link{fill:none;stroke:var(--ed-border2);stroke-width:1.1;}
.c-link.dashed-link{stroke-dasharray:5,3;stroke:var(--ed-text3);}
.ed-saved{font-size:11px;color:#22c55e;opacity:0;transition:opacity .3s;margin-right:4px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--ed-border2);border-radius:4px;}

/* ── REACT APP ── */
.app-wrap{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.app-header{background:linear-gradient(135deg,#003D6E,#005EA6);padding:0 20px;height:56px;
  display:flex;align-items:center;gap:16px;flex-shrink:0;}
.app-tabs{display:flex;gap:2px;margin-left:12px;}
.app-tab{padding:5px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;
  font-family:inherit;border:1px solid transparent;transition:all .15s;
  color:rgba(255,255,255,.65);background:transparent;}
.app-tab.active{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.3);}
.app-tab:hover:not(.active){color:#fff;background:rgba(255,255,255,.08);}
.app-body{flex:1;display:flex;overflow:hidden;}
.sidebar{width:300px;flex-shrink:0;background:#fff;border-right:1px solid var(--gris-borde);
  display:flex;flex-direction:column;overflow:hidden;}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
</style>
</head>
<body>

<!-- EDITOR VISUAL D3 (oculto hasta que se active) -->
<div id="ed-pane">
  <div id="ed-toolbar">
    <span style="font-size:10px;font-weight:600;color:var(--ed-text3);text-transform:uppercase;letter-spacing:.06em;">Área:</span>
    <select id="ed-area-sel" style="min-width:240px;flex:1;max-width:380px;"></select>
    <span style="font-size:10px;color:var(--ed-text3);margin-left:8px;">· doble clic en línea = punto de quiebre · click derecho en punto = eliminar</span>
    <div style="margin-left:auto;display:flex;gap:6px;align-items:center;">
      <span class="ed-saved" id="ed-saved-msg">✓ Guardado</span>
      <button class="ed-zb" id="ed-btn-save" title="Guardar posiciones" style="width:auto;padding:0 12px;font-size:11.5px;">💾 Guardar</button>
      <button class="ed-zb" id="ed-btn-export" title="Exportar esta área como SVG A3" style="width:auto;padding:0 12px;font-size:11.5px;background:#166534;border-color:#166534;color:#fff;">🖨 Exportar A3</button>
      <button class="ed-zb" id="ed-btn-reset" title="Resetear layout automático" style="font-size:11px;">↺</button>
      <button class="ed-zb" id="ed-btn-back" style="width:auto;padding:0 12px;font-size:11.5px;border-color:var(--ed-accent);color:var(--ed-accent);">← Organigrama</button>
    </div>
  </div>
  <div id="ed-body">
    <div class="ed-sidebar">
      <div class="ed-sidebar-hd">Nodos del área</div>
      <div class="ed-list" id="ed-list"></div>
    </div>
    <div id="ed-canvas">
      <svg id="ed-svg"></svg>
      <div class="ed-zoom">
        <button class="ed-zb" id="ed-zi">+</button>
        <button class="ed-zb" id="ed-zr">⌂</button>
        <button class="ed-zb" id="ed-zo">−</button>
      </div>
    </div>
    <div class="ed-inspector">
      <div class="ed-ins-hd">Inspector <span id="ed-ins-id" style="font-family:monospace;font-size:9px;color:var(--ed-text3);"></span></div>
      <div class="ed-ins-body" id="ed-ins-body">
        <div class="ed-ins-empty">
          <div class="ico">⬡</div>
          <p>Clic = seleccionar<br>Shift+clic = seleccionar<br>nodo + dependientes</p>
        </div>
      </div>
      <div class="ed-actions" id="ed-actions" style="display:none;">
        <button class="ed-btn primary" id="ed-btn-node-save">✓ Guardar cambios</button>
        <button class="ed-btn" id="ed-btn-move">↕ Mover a otro padre</button>
        <button class="ed-btn danger" id="ed-btn-delete">✕ Eliminar nodo</button>
      </div>
    </div>
  </div>
</div>

const STORAGE_KEY="gcba_org_v2";
function loadData(){try{const s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):INITIAL;}catch{return INITIAL;}}
function saveData(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch{}}

// ── Utilidades de árbol ──────────────────────────────────
function flatList(t,a=[]){a.push(t);(t.children||[]).forEach(c=>flatList(c,a));return a;}
function findNode(t,id){if(!t)return null;if(t.id===id)return t;for(const c of(t.children||[])){const f=findNode(c,id);if(f)return f;}return null;}
function updateNode(t,id,fn){if(t.id===id)return fn(t);return{...t,children:(t.children||[]).map(c=>updateNode(c,id,fn))};}
function removeNode(t,id){return{...t,children:(t.children||[]).filter(c=>c.id!==id).map(c=>removeNode(c,id))};}
function addChild(t,pid,child){return updateNode(t,pid,n=>({...n,children:[...(n.children||[]),child]}));}
function moveNode(t,nodeId,newPid){const n=findNode(t,nodeId);if(!n)return t;return addChild(removeNode(t,nodeId),newPid,n);}

function getColor(n){if(n?.tipo?.startsWith("CUSTOM:"))return"#5B21B6";return(COLORS[n?.tipo]||COLORS.ORG).bg;}
function getLabel(n){if(n?.tipo?.startsWith("CUSTOM:"))return n.tipoLabel||n.tipo.replace("CUSTOM:","");return(COLORS[n?.tipo]||COLORS.ORG).label;}

// ── SVG A3 ───────────────────────────────────────────────
const fv=v=>Number(v).toFixed(1);

function wrapTxt(t,max){
  if(!t)return[];
  const ws=t.split(" ");const ls=[];let c="";
  for(const w of ws){const test=c?" "+w:w;if(c.length+test.length>max&&c){ls.push(c);c=w;}else c=(c+test).trim();}
  if(c)ls.push(c);return ls;
}

function svgBox(x,y,node,W,H,dashed,fsN,fsT){
  const fill=getColor(node);
  const nl=wrapTxt(node.nombre,Math.max(6,Math.floor(W/(fsN*0.55))));
  const tl=wrapTxt(node.titular||"",Math.max(6,Math.floor(W/(fsT*0.54))));
  const lhN=fsN*1.3,lhT=fsT*1.25,gap=tl.length?fsN*0.35:0;
  const blockH=nl.length*lhN+gap+tl.length*lhT;
  let yt=y+(H-blockH)/2+lhN*0.85;
  const da=dashed?`stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="5,3"`:"";
  let s=`<rect x="${fv(x)}" y="${fv(y)}" width="${fv(W)}" height="${fv(H)}" rx="${fv(Math.max(4,H*0.12))}" fill="${fill}" ${da}/>`;
  nl.forEach(l=>{s+=`<text x="${fv(x+W/2)}" y="${fv(yt)}" text-anchor="middle" font-size="${fv(fsN)}" font-weight="600" fill="#fff" font-family="Inter,Arial,sans-serif">${l}</text>`;yt+=lhN;});
  yt+=gap;
  tl.forEach(l=>{s+=`<text x="${fv(x+W/2)}" y="${fv(yt)}" text-anchor="middle" font-size="${fv(fsT)}" fill="rgba(255,255,255,0.82)" font-family="Inter,Arial,sans-serif">${l}</text>`;yt+=lhT;});
  return s;
}

// Genera SVG A3 — el árbol siempre llena el A3 completo.
// Si hay posiciones del editor guardadas: las usa y escala al A3.
// Si no: calcula layout D3 y ajusta tamaño de nodo para llenar el A3.
function genSVGA3(root,pn=1,tot=1){
  const PW=1587,PH=1123,MAR=40,HH=68,FH=34;
  const AW=PW-MAR*2,AH=PH-HH-FH-MAR;

  const today=new Date();
  const fecha=`${String(today.getDate()).padStart(2,"0")}/${String(today.getMonth()+1).padStart(2,"0")}/${today.getFullYear()}`;

  const isJG=root.tipo==="JG";
  const savedPos=JSON.parse(localStorage.getItem("gcba_org_positions_v1")||"{}")[root.id]||null;
  const waypoints=JSON.parse(localStorage.getItem("gcba_org_waypoints_v1")||"{}")[root.id]||{};

  let nodes=[],links=[],NW,NH;

  if(savedPos&&Object.keys(savedPos).length>0){
    // ── Posiciones del editor ──────────────────────────────
    // Recopilar nodos visibles (JG: 1 nivel)
    const visible=[];
    (function collect(node,depth){
      visible.push(node);
      if(isJG&&depth>=1)return;
      (node.children||[]).forEach(c=>collect(c,depth+1));
    })(root,0);
    const visIds=new Set(visible.map(n=>n.id));

    nodes=visible.map(n=>({x:savedPos[n.id]?.x??0,y:savedPos[n.id]?.y??0,data:n}));

    // Links
    (function walk(node,depth){
      (node.children||[]).forEach(ch=>{
        if(!visIds.has(ch.id))return;
        const s=nodes.find(n=>n.data.id===node.id),t=nodes.find(n=>n.data.id===ch.id);
        if(s&&t)links.push({s,t});
        if(!(isJG&&depth>=1))walk(ch,depth+1);
      });
    })(root,0);

    // Normalizar a (0,0)
    const mnX=d3.min(nodes,n=>n.x),mnY=d3.min(nodes,n=>n.y);
    nodes.forEach(n=>{n.x-=mnX;n.y-=mnY;});

    // Escalar para que el contenido llene el A3
    // El editor usa NW=158,NH=50. Escalamos para que bbox llene AW×AH
    const ED_NW=158,ED_NH=50;
    const tW=d3.max(nodes,n=>n.x)+ED_NW,tH=d3.max(nodes,n=>n.y)+ED_NH;
    const sc=Math.min(AW/tW,AH/tH)*0.94;
    nodes.forEach(n=>{n.x*=sc;n.y*=sc;});
    NW=ED_NW*sc;NH=ED_NH*sc;
    // Garantizar NH mínimo para que el texto entre
    // Si NH es muy chico, escalar todo uniformemente manteniendo proporciones
    const MIN_NH=Math.max(36, NW/2.2);
    if(NH<MIN_NH){
      const scUp=MIN_NH/NH;
      // Solo escalar NH — ajustar posiciones Y proporcionalmente
      nodes.forEach(n=>{n.y*=scUp;});
      NH=MIN_NH;
      // Re-escalar todo para que quepa en A3
      const tH2=d3.max(nodes,n=>n.y)+NH;
      if(tH2>AH){const sc2=AH/tH2*0.94;nodes.forEach(n=>{n.x*=sc2;n.y*=sc2;});NW*=sc2;NH*=sc2;}
    }

  }else{
    // ── Layout D3 automático ───────────────────────────────
    const HGAP=10,VGAP=24;

    // Detectar si este nodo es de "primer nivel" (JG, o cualquier nodo cuyos
    // hijos directos son MIN/VJG/SEC — ej: Jefatura de Gabinete NO es isJG
    // pero tampoco queremos desplegar toda su estructura).
    // La regla: si el nodo tiene hijos de tipo MIN/VJG/SEC, usar layout de 2 filas.
    const directHier=(root.children||[]).filter(c=>!c.dashed);
    const isShallowLayout=isJG||directHier.some(c=>c.tipo==="MIN"||c.tipo==="VJG"||c.tipo==="SEC");

    if(isShallowLayout){
      // Layout manual de 2 filas: fila 1 = MIN+VJG, fila 2 = SEC
      // (para JG: sus ministerios y secretarías; para otros: sus hijos directos)
      const row1=isJG
        ? directHier.filter(c=>c.tipo==="MIN"||c.tipo==="VJG")
        : directHier.filter(c=>c.tipo!=="SEC");
      const row2=directHier.filter(c=>c.tipo==="SEC");
      const spanX=Math.max(row1.length,row2.length,1);
      const spanY=row2.length>0?3:2;
      NW=Math.max(60,Math.floor((AW-(spanX-1)*HGAP)/spanX));
      NW=Math.min(NW,240);
      NH=Math.max(40,Math.round(NW/2.0));
      NH=Math.min(NH,Math.floor((AH-(spanY-1)*VGAP)/spanY));
      NH=Math.max(NH,40);
      const HPAD=Math.max(HGAP,Math.round((AW-NW*spanX)/(spanX+1)));
      const VPAD=Math.max(VGAP,Math.round((AH-NH*spanY)/(spanY+1)));
      const makeRow=(items,rowY)=>{
        const total=items.length*(NW+HPAD)-HPAD;
        let x=(AW-total)/2+NW/2;
        return items.map(c=>{const n={x,y:rowY,data:c,depth:1};x+=NW+HPAD;return n;});
      };
      const rn={x:AW/2,y:0,data:root,depth:0};
      const mn=makeRow(row1,NH+VPAD);
      const sn=makeRow(row2,NH+VPAD+NH+VPAD);
      nodes=[rn,...mn,...sn];
      links=[...mn.map(t=>({s:rn,t})),...sn.map(t=>({s:rn,t}))];

    } else {
      // D3 tree para áreas con jerarquía profunda (SS, DG, etc.)
      function toHier(node){
        const kids=(node.children||[]).filter(c=>!c.dashed);
        return{...node,_k:kids.map(c=>toHier(c)),children:undefined};
      }
      const hier=d3.hierarchy(toHier(root),d=>d._k.length?d._k:null);

      // Contar hojas reales (no spanX de coordenadas D3)
      const leafCount=hier.leaves().length||1;
      const depthCount=(hier.height||1)+1;

      // NW basado en cantidad de hojas, NH basado en profundidad
      NW=Math.max(60,Math.floor((AW-(leafCount-1)*HGAP)/leafCount));
      NW=Math.min(NW,240);
      NH=Math.max(40,Math.round(NW/2.0));
      NH=Math.min(NH,Math.floor((AH-(depthCount-1)*VGAP)/depthCount));
      NH=Math.max(NH,40);

      const HPAD=Math.max(HGAP,Math.round((AW-NW*leafCount)/(leafCount+1)));
      const VPAD=Math.max(VGAP,Math.round((AH-NH*depthCount)/(depthCount+1)));

      d3.tree().nodeSize([NW+HPAD,NH+VPAD])(hier);
      nodes=hier.descendants().map(n=>({x:n.x,y:n.y,data:n.data,depth:n.depth}));
      links=hier.links().map(l=>({
        s:nodes.find(n=>n.data.id===l.source.data.id),
        t:nodes.find(n=>n.data.id===l.target.data.id)
      })).filter(l=>l.s&&l.t);

      // Normalizar a (0,0)
      const mnX=d3.min(nodes,n=>n.x)-NW/2,mnY=d3.min(nodes,n=>n.y);
      nodes.forEach(n=>{n.x-=mnX;n.y-=mnY;});

      // Escalar para llenar el A3 ajustando NW y NH proporcionalmente
      const tW=d3.max(nodes,n=>n.x+NW/2),tH=d3.max(nodes,n=>n.y+NH);
      const scX=AW/tW,scY=AH/tH;
      const sc=Math.min(scX,scY)*0.94;
      nodes.forEach(n=>{n.x*=sc;n.y*=sc;});
      NW*=sc;NH*=sc;
    }
  }

  // Organismos fuera de nivel (dashed) del nodo raíz — solo sus cajas, sin estructura interna
  // Para JG: los dashed directos. Para otros: los dashed directos del root.
  const dashedOrgs=(root.children||[]).filter(c=>c.dashed);
  const hasOrgs=dashedOrgs.length>0;

  // Reservar espacio inferior para los dashed si los hay
  const ORG_GAP=20;     // separación entre jerarquía y sección de orgs
  const ORG_MIN_H=60;   // altura mínima de cada caja org
  const ORG_COLS=Math.min(dashedOrgs.length,8)||1;
  const ORG_ROWS=Math.ceil(dashedOrgs.length/ORG_COLS);
  const ORG_SECTION_H=hasOrgs?ORG_ROWS*ORG_MIN_H+(ORG_ROWS-1)*8+ORG_GAP+14:0;

  // Reducir AH disponible para la jerarquía si hay orgs
  const hierH=AH-ORG_SECTION_H;

  // Re-escalar la jerarquía al espacio reducido
  if(hasOrgs){
    const usedH_now=d3.max(nodes,n=>n.y)+NH;
    if(usedH_now>0){
      const sc2=Math.min(1,(hierH/usedH_now));
      if(sc2<1){nodes.forEach(n=>{n.x*=sc2;n.y*=sc2;});NW*=sc2;NH*=sc2;}
    }
  }

  // Centrar jerarquía en su espacio
  const usedW=d3.max(nodes,n=>n.x)+NW,usedH=d3.max(nodes,n=>n.y)+NH;
  const ox=MAR+(AW-usedW)/2,oy=HH+(hierH-usedH)/2;

  // Tamaños de fuente proporcionales al nodo
  const fsN=Math.max(5.5,Math.min(11,NW/13));
  const fsT=Math.max(5,Math.min(9,NW/17));
  const sw=Math.max(0.6,NW/220);

  // Líneas
  function lPath(s,t,wps){
    const sx=s.x,sy=s.y+NH,tx=t.x,ty=t.y;
    if(wps?.length){
      const scWP=NW/158;
      const pts=[{x:sx,y:sy},...wps.map(p=>({x:p.x*scWP,y:p.y*scWP})),{x:tx,y:ty}];
      let d=`M${fv(pts[0].x)},${fv(pts[0].y)}`;
      for(let i=1;i<pts.length;i++){d+=`L${fv(pts[i].x)},${fv(pts[i-1].y)}L${fv(pts[i].x)},${fv(pts[i].y)}`;}
      return`<path d="${d}" fill="none" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`;
    }
    const my=sy+(ty-sy)/2;
    return`<line x1="${fv(sx)}" y1="${fv(sy)}" x2="${fv(sx)}" y2="${fv(my)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>` +
           `<line x1="${fv(sx)}" y1="${fv(my)}" x2="${fv(tx)}" y2="${fv(my)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>` +
           `<line x1="${fv(tx)}" y1="${fv(my)}" x2="${fv(tx)}" y2="${fv(ty)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`;
  }

  let linesSVG="",nodesSVG="";
  links.forEach(lk=>{
    if(!lk.s||!lk.t)return;
    const wps=waypoints[`${lk.s.data?.id}-${lk.t.data?.id}`]||[];
    linesSVG+=lPath(lk.s,lk.t,wps);
  });
  nodes.forEach(n=>{nodesSVG+=svgBox(n.x-NW/2,n.y,n.data,NW,NH,!!n.data?.dashed,fsN,fsT);});

  // Sección organismos fuera de nivel
  let orgsSVG="";
  if(hasOrgs){
    const sepY=HH+hierH+ORG_GAP;
    // Línea separadora y título
    orgsSVG+=`<line x1="${MAR}" y1="${fv(sepY)}" x2="${fv(PW-MAR)}" y2="${fv(sepY)}" stroke="#CBD5E0" stroke-width="0.8" stroke-dasharray="5,4"/>`;
    orgsSVG+=`<text x="${fv(PW/2)}" y="${fv(sepY+11)}" text-anchor="middle" font-size="7.5" fill="#A0AEC0" font-family="Inter,Arial,sans-serif" letter-spacing="1.5">ORGANISMOS DESCENTRALIZADOS Y FUERA DE NIVEL</text>`;

    const ORG_W=Math.min(180,Math.floor((AW-(ORG_COLS-1)*8)/ORG_COLS));
    const ORG_H=Math.max(ORG_MIN_H,Math.min(70,Math.round(ORG_W/2.8)));
    const orgStartX=MAR+(AW-(ORG_COLS*ORG_W+(ORG_COLS-1)*8))/2;
    const fsO=Math.max(5.5,Math.min(10,ORG_W/14));
    const fsOT=Math.max(5,Math.min(8.5,ORG_W/18));

    dashedOrgs.forEach((org,i)=>{
      const col=i%ORG_COLS,row=Math.floor(i/ORG_COLS);
      const ox2=orgStartX+col*(ORG_W+8);
      const oy2=sepY+16+row*(ORG_H+8);
      orgsSVG+=svgBox(ox2,oy2,org,ORG_W,ORG_H,true,fsO,fsOT);
    });
  }

  const leg=[["#9B1C1C","Jefatura"],["#92400E","Ministerio"],["#78350F","Secretaría"],
             ["#1E3A5F","Subsecretaría"],["#14532D","Dir. General"],["#374151","Org. desc."]];
  const lw=118,lx=(PW-leg.length*lw)/2,ly=PH-FH+11;
  const legSVG=leg.map((it,i)=>
    `<rect x="${fv(lx+i*lw)}" y="${fv(ly)}" width="9" height="9" rx="2" fill="${it[0]}"/>` +
    `<text x="${fv(lx+i*lw+13)}" y="${fv(ly+8)}" font-size="8" fill="#718096" font-family="Inter,Arial,sans-serif">${it[1]}</text>`
  ).join("");
  const pgSVG=tot>1?`<text x="${fv(PW-MAR)}" y="${fv(ly+8)}" text-anchor="end" font-size="8" fill="#A0AEC0">${pn}/${tot}</text>`:"";
  const hc=getColor(root);

  return`<svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${PH}" viewBox="0 0 ${PW} ${PH}">
<defs><linearGradient id="hg${pn}" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="${hc}"/><stop offset="100%" stop-color="${hc}CC"/>
</linearGradient></defs>
<rect width="${PW}" height="${PH}" fill="#F8FAFC"/>
<rect x="0" y="0" width="${PW}" height="${HH}" fill="url(#hg${pn})"/>
<line x1="0" y1="${HH}" x2="${PW}" y2="${HH}" stroke="#E2E8F0" stroke-width="1"/>
<text x="${fv(PW/2)}" y="${fv(HH*0.45)}" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="Inter,Arial,sans-serif">${root.nombre}</text>
<text x="${fv(PW/2)}" y="${fv(HH*0.78)}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)" font-family="Inter,Arial,sans-serif">Ciudad Autónoma de Buenos Aires · ${fecha}</text>
<g transform="translate(${fv(ox)},${fv(oy)})">${linesSVG}${nodesSVG}</g>
${orgsSVG}
<rect x="0" y="${PH-FH}" width="${PW}" height="${FH}" fill="#F8FAFC"/>
<line x1="0" y1="${PH-FH}" x2="${PW}" y2="${PH-FH}" stroke="#E2E8F0" stroke-width="0.8"/>
${legSVG}${pgSVG}
</svg>`;
}

function dlSVG(svgStr,fname){
  const blob=new Blob([svgStr],{type:"image/svg+xml"});
  const url=URL.createObjectURL(blob);
  Object.assign(document.createElement("a"),{href:url,download:fname}).click();
  URL.revokeObjectURL(url);
}

// ── Exponer al scope global para el editor D3 ──
window.__genSVGA3=genSVGA3;
window.__dlSVG=dlSVG;
window.__flatList=flatList;
window.__findNode=findNode;

// ── Componentes React ─────────────────────────────────────
function Btn({children,onClick,variant="secondary",small=false,style={}}){
  const base={fontFamily:"inherit",fontWeight:500,cursor:"pointer",border:"1px solid",
    borderRadius:8,transition:"all .15s",fontSize:small?11:12,
    padding:small?"4px 10px":"6px 14px",display:"inline-flex",alignItems:"center",gap:6,...style};
  const variants={
    primary:{background:"#005EA6",borderColor:"#005EA6",color:"#fff"},
    secondary:{background:"#fff",borderColor:"#CBD5E0",color:"#4A5568"},
    ghost:{background:"rgba(255,255,255,0.08)",borderColor:"rgba(255,255,255,0.25)",color:"#fff"},
    danger:{background:"#fff",borderColor:"#FC8181",color:"#C53030"}
  };
  return<button style={{...base,...variants[variant]}} onClick={onClick}>{children}</button>;
}

function TypeBadge({tipo,tipoLabel}){
  const isCustom=tipo?.startsWith("CUSTOM:");
  const label=isCustom?(tipoLabel||tipo.replace("CUSTOM:","")):(COLORS[tipo]?.label||tipo);
  const color=isCustom?"#5B21B6":(COLORS[tipo]?.bg||"#374151");
  return<span style={{background:color,color:"#fff",fontSize:9,fontWeight:600,padding:"2px 6px",borderRadius:4,textTransform:"uppercase",letterSpacing:".04em"}}>{label}</span>;
}

function Modal({title,children,onClose,wide=false}){
  return<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(3px)"}} onClick={onClose}>
    <div style={{background:"#fff",borderRadius:14,width:wide?600:400,maxHeight:"85vh",overflow:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}} onClick={e=>e.stopPropagation()}>
      <div style={{background:"#F7FAFC",padding:"14px 18px",borderBottom:"1px solid #E2E8F0",display:"flex",justifyContent:"space-between",alignItems:"center",borderRadius:"14px 14px 0 0"}}>
        <span style={{fontWeight:600,fontSize:14}}>{title}</span>
        <button onClick={onClose} style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:"#718096"}}>✕</button>
      </div>
      <div style={{padding:18}}>{children}</div>
    </div>
  </div>;
}

function Field({label,value,onChange,type="text",children}){
  return<div style={{marginBottom:14}}>
    <label style={{fontSize:11,fontWeight:600,color:"#718096",textTransform:"uppercase",letterSpacing:".05em",display:"block",marginBottom:5}}>{label}</label>
    {children||<input type={type} value={value} onChange={e=>onChange(e.target.value)}
      style={{width:"100%",border:"1px solid #CBD5E0",borderRadius:7,padding:"7px 10px",fontSize:13,fontFamily:"inherit",outline:"none"}}/>}
  </div>;
}

function TipoSelector({tipo,tipoLabel,onChange}){
  const isC=tipo?.startsWith("CUSTOM:");
  return<>
    <Field label="Tipo">
      <select value={isC?"__custom__":tipo} onChange={e=>onChange(e.target.value==="__custom__"?"CUSTOM:":e.target.value,tipoLabel)}
        style={{width:"100%",border:"1px solid #CBD5E0",borderRadius:7,padding:"7px 10px",fontSize:13,fontFamily:"inherit",outline:"none"}}>
        {Object.entries(COLORS).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
        <option value="__custom__">✏️ Personalizado…</option>
      </select>
    </Field>
    {isC&&<Field label="Nombre del tipo"><input value={tipoLabel||""} onChange={e=>onChange(tipo,e.target.value)}
      style={{width:"100%",border:"1px solid #CBD5E0",borderRadius:7,padding:"7px 10px",fontSize:13,fontFamily:"inherit",outline:"none"}}/></Field>}
  </>;
}

function PadreSelector({allNodes,currentId,value,onChange}){
  return<Field label="Depende de">
    <select value={value} onChange={e=>onChange(e.target.value)}
      style={{width:"100%",border:"1px solid #CBD5E0",borderRadius:7,padding:"7px 10px",fontSize:13,fontFamily:"inherit",outline:"none"}}>
      {allNodes.filter(n=>n.id!==currentId).map(n=><option key={n.id} value={n.id}>[{getLabel(n)}] {n.nombre}</option>)}
    </select>
  </Field>;
}

function PanelItem({node,onSelect,selectedId,depth=0}){
  const isSelected=node.id===selectedId;
  const color=getColor(node);
  return<>
    <div onClick={()=>onSelect(node)} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 12px",
      paddingLeft:12+depth*14,cursor:"pointer",background:isSelected?"#EBF4FF":"transparent",
      borderLeft:isSelected?"3px solid #005EA6":"3px solid transparent",transition:"all .1s"}}>
      <div style={{width:8,height:8,borderRadius:2,background:color,flexShrink:0,
        border:node.dashed?"2px dashed rgba(0,0,0,.25)":"none"}}/>
      <span style={{fontSize:12,color:isSelected?"#005EA6":"#2D3748",fontWeight:isSelected?600:400,flex:1,
        whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{node.nombre}</span>
      <TypeBadge tipo={node.tipo} tipoLabel={node.tipoLabel}/>
    </div>
    {(node.children||[]).map(c=><PanelItem key={c.id} node={c} onSelect={onSelect} selectedId={selectedId} depth={depth+1}/>)}
  </>;
}

function App(){
  const[data,setData]=useState(()=>loadData());
  const[selected,setSelected]=useState(null);
  const[search,setSearch]=useState("");
  const[modal,setModal]=useState(null); // null | "edit" | "add" | "move"
  const[editForm,setEditForm]=useState({});
  const[addForm,setAddForm]=useState({nombre:"",titular:"",tipo:"DG",tipoLabel:"",dashed:false,parentId:""});
  const[activeTab,setActiveTab]=useState("organigrama");

  const allNodes=useMemo(()=>flatList(data),[data]);

  // Sincronizar datos con el editor D3
  useEffect(()=>{
    window.__orgData=data;
    window.dispatchEvent(new CustomEvent("orgDataChanged",{detail:data}));
  },[data]);

  // Escuchar cambios del editor D3
  useEffect(()=>{
    const h=e=>{setData(e.detail);saveData(e.detail);};
    window.addEventListener("editorDataChanged",h);
    return()=>window.removeEventListener("editorDataChanged",h);
  },[]);

  // Exponer función para volver desde el editor
  useEffect(()=>{window.__goToOrganigrama=()=>setActiveTab("organigrama");},[]);

  // Mostrar/ocultar editor
  useEffect(()=>{
    const pane=document.getElementById("ed-pane");
    const rootEl=document.getElementById("root");
    if(activeTab==="editor"){
      pane.classList.add("visible");
      rootEl.style.display="none";
      // Pequeño delay para que el canvas tenga dimensiones reales
      setTimeout(()=>{
        window.dispatchEvent(new CustomEvent("editorActivated",{detail:data}));
      },50);
    }else{
      pane.classList.remove("visible");
      rootEl.style.display="";
    }
  },[activeTab,data]);

  const filtered=useMemo(()=>{
    if(!search.trim())return null;
    const q=search.toLowerCase();
    return allNodes.filter(n=>(n.nombre||"").toLowerCase().includes(q)||(n.titular||"").toLowerCase().includes(q));
  },[allNodes,search]);

  const fechaApp=useMemo(()=>{
    const d=new Date();
    return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
  },[]);

  function openEdit(node){
    setEditForm({nombre:node.nombre,titular:node.titular||"",tipo:node.tipo,tipoLabel:node.tipoLabel||"",dashed:!!node.dashed,parentId:findNode(data,node.id)?.id});
    setModal("edit");
  }
  function saveEdit(){
    const{nombre,titular,tipo,tipoLabel,dashed}=editForm;
    setData(d=>{const nd=updateNode(d,selected.id,n=>({...n,nombre,titular,tipo,tipoLabel:tipoLabel||undefined,dashed}));saveData(nd);return nd;});
    setSelected(s=>({...s,nombre,titular,tipo,tipoLabel,dashed}));
    setModal(null);
  }
  function saveAdd(){
    const{nombre,titular,tipo,tipoLabel,dashed,parentId}=addForm;
    if(!nombre.trim()||!parentId)return;
    const child={id:"n_"+Date.now(),nombre,titular,tipo,tipoLabel:tipoLabel||undefined,dashed,children:[]};
    setData(d=>{const nd=addChild(d,parentId,child);saveData(nd);return nd;});
    setModal(null);
  }
  function del(){
    if(!selected||selected.id==="JG")return;
    if(!confirm(`¿Eliminar "${selected.nombre}" y todas sus dependencias?`))return;
    setData(d=>{const nd=removeNode(d,selected.id);saveData(nd);return nd;});
    setSelected(null);setModal(null);
  }
  function openMove(){
    setEditForm(f=>({...f,newParentId:""}));
    setModal("move");
  }
  function saveMove(){
    const np=editForm.newParentId;
    if(!np||!selected)return;
    setData(d=>{const nd=moveNode(d,selected.id,np);saveData(nd);return nd;});
    setModal(null);
  }
  function reset(){
    if(!confirm("¿Restablecer todos los datos al original?"))return;
    localStorage.removeItem("gcba_org_v2");
    localStorage.removeItem("gcba_org_positions_v1");
    localStorage.removeItem("gcba_org_waypoints_v1");
    setData(INITIAL);setSelected(null);
  }

  // Exportar todo A3
  function dlAll(){
    const direct=data.children||[];
    const areas=[data,
      ...direct.filter(n=>n.tipo==="MIN"||n.tipo==="VJG"),
      ...direct.filter(n=>n.tipo==="SEC"),
      ...flatList(data).filter(n=>n.dashed&&(n.children||[]).length>0)
    ];
    const PH=1123;
    const pages=areas.map((a,i)=>genSVGA3(a,i+1,areas.length));
    const combined=`<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1587" height="${PH*pages.length}" viewBox="0 0 1587 ${PH*pages.length}">${pages.map((p,i)=>`<g transform="translate(0,${i*PH})">${p.replace(/<\/?svg[^>]*>/g,"")}</g>`).join("")}</svg>`;
    dlSVG(combined,"organigrama-gcba-completo-A3.svg");
  }

  const color=selected?getColor(selected):"#003D6E";

  return(
    <div className="app-wrap">
      {/* Header */}
      <div className="app-header">
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,borderRadius:8,background:"#F5C400",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" fill="#003D6E"/>
              <polyline points="9 22 9 12 15 12 15 22" fill="#F5C400" stroke="#003D6E" strokeWidth="0.5"/>
            </svg>
          </div>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:"#fff",lineHeight:1.2}}>Organigrama GCBA</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,.6)"}}>Ciudad Autónoma de Buenos Aires</div>
          </div>
        </div>
        <div className="app-tabs">
          {[["organigrama","📋 Organigrama"],["editor","✏️ Editor visual"]].map(([id,label])=>(
            <button key={id} className={`app-tab${activeTab===id?" active":""}`}
              onClick={()=>setActiveTab(id)}>{label}</button>
          ))}
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
          <Btn variant="ghost" onClick={dlAll} small>⬇ Descargar todo A3</Btn>
          <Btn variant="ghost" onClick={reset} small>↺ Restablecer</Btn>
        </div>
      </div>

      {/* Body */}
      <div className="app-body">
        {/* Sidebar */}
        <div className="sidebar">
          <div style={{padding:"10px 12px",borderBottom:"1px solid #E2E8F0",background:"#F7FAFC"}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar organismo o titular…"
              style={{width:"100%",border:"1px solid #CBD5E0",borderRadius:8,padding:"7px 10px",fontSize:12,fontFamily:"inherit",outline:"none"}}/>
          </div>
          <div style={{flex:1,overflow:"auto"}}>
            {filtered
              ?filtered.map(n=><PanelItem key={n.id} node={n} onSelect={setSelected} selectedId={selected?.id} depth={0}/>)
              :<PanelItem node={data} onSelect={setSelected} selectedId={selected?.id}/>
            }
          </div>
          <div style={{padding:"10px 12px",borderTop:"1px solid #E2E8F0",background:"#F7FAFC"}}>
            <Btn variant="primary" onClick={()=>{setAddForm({nombre:"",titular:"",tipo:"DG",tipoLabel:"",dashed:false,parentId:selected?.id||"JG"});setModal("add");}} style={{width:"100%",justifyContent:"center"}}>
              + Nueva unidad
            </Btn>
          </div>
        </div>

        {/* Main */}
        <div className="main-area">
          {selected?(
            <div style={{flex:1,overflow:"auto",padding:24}}>
              {/* Header del nodo */}
              <div style={{borderRadius:12,padding:"20px 24px",marginBottom:20,background:color,color:"#fff"}}>
                <div style={{fontSize:10,fontWeight:600,opacity:.7,textTransform:"uppercase",letterSpacing:".06em",marginBottom:6}}>
                  {getLabel(selected)}{selected.dashed?" · Dependencia funcional":""}
                </div>
                <div style={{fontSize:22,fontWeight:700,lineHeight:1.2,marginBottom:4}}>{selected.nombre}</div>
                {selected.titular&&<div style={{fontSize:14,opacity:.85}}>{selected.titular}</div>}
                <div style={{marginTop:14,display:"flex",gap:8,flexWrap:"wrap"}}>
                  <Btn variant="secondary" small onClick={()=>openEdit(selected)}>✏️ Editar</Btn>
                  {selected.id!=="JG"&&<>
                    <Btn variant="secondary" small onClick={openMove}>↕ Mover</Btn>
                    <Btn variant="danger" small onClick={del}>✕ Eliminar</Btn>
                  </>}
                  <Btn variant="secondary" small onClick={()=>{dlSVG(genSVGA3(selected,1,1),`organigrama-${selected.id}-A3.svg`);}}>🖨 Descargar A3</Btn>
                </div>
              </div>
              {/* Dependencias */}
              {(selected.children||[]).length>0&&(
                <div>
                  <div style={{fontSize:11,fontWeight:600,color:"#718096",textTransform:"uppercase",letterSpacing:".06em",marginBottom:10}}>
                    Dependencias ({(selected.children||[]).length})
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10}}>
                    {(selected.children||[]).map(ch=>(
                      <div key={ch.id} onClick={()=>setSelected(ch)}
                        style={{borderRadius:8,padding:"12px 14px",background:"#fff",border:"1px solid #E2E8F0",
                          cursor:"pointer",borderLeft:`4px solid ${getColor(ch)}`,transition:"box-shadow .15s"}}
                        onMouseEnter={e=>e.currentTarget.style.boxShadow="0 2px 12px rgba(0,0,0,.08)"}
                        onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
                        <div style={{fontSize:11,fontWeight:500,color:getColor(ch),marginBottom:3}}>{getLabel(ch)}</div>
                        <div style={{fontSize:13,fontWeight:600,color:"#1A202C",marginBottom:3}}>{ch.nombre}</div>
                        {ch.titular&&<div style={{fontSize:11,color:"#718096"}}>{ch.titular}</div>}
                        {(ch.children||[]).length>0&&<div style={{fontSize:10,color:"#A0AEC0",marginTop:4}}>{ch.children.length} dependencias</div>}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          ):(
            <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:8,color:"#A0AEC0"}}>
              <div style={{fontSize:40,opacity:.3}}>⬡</div>
              <div style={{fontSize:13}}>Seleccioná un organismo del panel</div>
            </div>
          )}
          <div style={{background:"#fff",borderTop:"1px solid #E2E8F0",padding:"6px 20px",display:"flex",justifyContent:"space-between"}}>
            <span style={{fontSize:10,color:"#A0AEC0"}}>GCBA · {fechaApp}</span>
            <span style={{fontSize:10,color:"#A0AEC0"}}>{allNodes.length} organismos</span>
          </div>
        </div>
      </div>

      {/* Modales */}
      {modal==="edit"&&selected&&(
        <Modal title={`Editar: ${selected.nombre}`} onClose={()=>setModal(null)}>
          <Field label="Nombre" value={editForm.nombre} onChange={v=>setEditForm(f=>({...f,nombre:v}))}/>
          <Field label="Titular" value={editForm.titular} onChange={v=>setEditForm(f=>({...f,titular:v}))}/>
          <TipoSelector tipo={editForm.tipo} tipoLabel={editForm.tipoLabel}
            onChange={(t,tl)=>setEditForm(f=>({...f,tipo:t,tipoLabel:tl}))}/>
          <Field label="">
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13}}>
              <input type="checkbox" checked={editForm.dashed} onChange={e=>setEditForm(f=>({...f,dashed:e.target.checked}))}
                style={{width:14,height:14,accentColor:"#005EA6"}}/>
              Dependencia funcional (línea punteada)
            </label>
          </Field>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:4}}>
            <Btn onClick={()=>setModal(null)}>Cancelar</Btn>
            <Btn variant="primary" onClick={saveEdit}>Guardar</Btn>
          </div>
        </Modal>
      )}
      {modal==="add"&&(
        <Modal title="Nueva unidad" onClose={()=>setModal(null)}>
          <Field label="Nombre" value={addForm.nombre} onChange={v=>setAddForm(f=>({...f,nombre:v}))}/>
          <Field label="Titular" value={addForm.titular} onChange={v=>setAddForm(f=>({...f,titular:v}))}/>
          <TipoSelector tipo={addForm.tipo} tipoLabel={addForm.tipoLabel}
            onChange={(t,tl)=>setAddForm(f=>({...f,tipo:t,tipoLabel:tl}))}/>
          <PadreSelector allNodes={allNodes} currentId={null} value={addForm.parentId} onChange={v=>setAddForm(f=>({...f,parentId:v}))}/>
          <Field label="">
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13}}>
              <input type="checkbox" checked={addForm.dashed} onChange={e=>setAddForm(f=>({...f,dashed:e.target.checked}))}
                style={{width:14,height:14,accentColor:"#005EA6"}}/>
              Dependencia funcional
            </label>
          </Field>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:4}}>
            <Btn onClick={()=>setModal(null)}>Cancelar</Btn>
            <Btn variant="primary" onClick={saveAdd}>Agregar</Btn>
          </div>
        </Modal>
      )}
      {modal==="move"&&selected&&(
        <Modal title={`Mover: ${selected.nombre}`} onClose={()=>setModal(null)}>
          <PadreSelector allNodes={allNodes} currentId={selected.id} value={editForm.newParentId||""} onChange={v=>setEditForm(f=>({...f,newParentId:v}))}/>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:4}}>
            <Btn onClick={()=>setModal(null)}>Cancelar</Btn>
            <Btn variant="primary" onClick={saveMove}>Mover</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<!-- ═══════════════════════════════════════════════════════════
     EDITOR D3 — scope plain JS, sin dependencias de Babel
     Lee/escribe en localStorage con la misma clave que React
     ═══════════════════════════════════════════════════════════ -->
<script>
(function(){
  "use strict";

  // ── Constantes ──────────────────────────────────────────
  const POS_KEY="gcba_org_positions_v1";
  const WP_KEY="gcba_org_waypoints_v1";
  const NW=158,NH=50,HPAD=18,VPAD=58;

  // ── Estado ──────────────────────────────────────────────
  let edData=null;
  let edViewId=null;          // id del área seleccionada
  let edSelectedIds=new Set();
  let edPositions={};         // {nodeId: {x,y}} para el área actual
  let edWaypoints={};         // {"sid-tid": [{x,y},...]}
  let edZoom=null;
  let edTransform=d3.zoomIdentity;
  let edFitted=false;

  // ── LocalStorage helpers ─────────────────────────────────
  function readLS(key){try{return JSON.parse(localStorage.getItem(key)||"{}");}catch{return{};}}
  function writeLS(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}
  function savePosForArea(){writeLS(POS_KEY,{...readLS(POS_KEY),[edViewId]:edPositions});}
  function saveWPForArea(){writeLS(WP_KEY,{...readLS(WP_KEY),[edViewId]:edWaypoints});}
  function loadPosForArea(id){return readLS(POS_KEY)[id]||null;}
  function loadWPForArea(id){return readLS(WP_KEY)[id]||{};}
  function clearArea(id){
    const p=readLS(POS_KEY);delete p[id];writeLS(POS_KEY,p);
    const w=readLS(WP_KEY);delete w[id];writeLS(WP_KEY,w);
  }

  // ── Árbol helpers ────────────────────────────────────────
  function getColor(n){if(n?.tipo?.startsWith("CUSTOM:"))return"#5B21B6";
    const m={JG:"#9B1C1C",VJG:"#9B1C1C",MIN:"#92400E",SEC:"#78350F",SS:"#1E3A5F",
              DG:"#14532D",GG:"#065F46",GO:"#064E3B",ORG:"#374151"};
    return m[n?.tipo]||"#374151";}
  function getLabel(n){
    if(n?.tipo?.startsWith("CUSTOM:"))return n.tipoLabel||n.tipo.replace("CUSTOM:","");
    const m={JG:"Jefatura",VJG:"Vicejefatura",MIN:"Ministerio",SEC:"Secretaría",
              SS:"Subsecretaría",DG:"Dir. General",GG:"Gerencia General",GO:"Gerencia Operativa",ORG:"Organismo"};
    return m[n?.tipo]||n?.tipo||"";}
  function flat(n,a=[]){a.push(n);(n.children||[]).forEach(c=>flat(c,a));return a;}
  function findN(tree,id){if(!tree)return null;if(tree.id===id)return tree;for(const c of(tree.children||[])){const f=findN(c,id);if(f)return f;}return null;}
  function removeN(tree,id){return{...tree,children:(tree.children||[]).filter(c=>c.id!==id).map(c=>removeN(c,id))};}
  function updateN(tree,id,fn){if(tree.id===id)return fn(tree);return{...tree,children:(tree.children||[]).map(c=>updateN(c,id,fn))};}
  function addChildN(tree,pid,child){return updateN(tree,pid,n=>({...n,children:[...(n.children||[]),child]}));}
  function moveN(tree,nid,pid){const n=findN(tree,nid);if(!n)return tree;return addChildN(removeN(tree,nid),pid,n);}

  function isJGView(){return edData&&edViewId===edData.id;}

  // Nodos visibles para el área actual (JG: solo 1 nivel)
  function visibleNodes(){
    const viewRoot=findN(edData,edViewId)||edData;
    if(!viewRoot)return[];
    function collect(node,depth,acc){
      acc.push(node);
      if(isJGView()&&depth>=1)return acc;
      (node.children||[]).forEach(c=>collect(c,depth+1,acc));
      return acc;
    }
    return collect(viewRoot,0,[]);
  }

  function visibleLinks(nodes){
    const ids=new Set(nodes.map(n=>n.id));
    const viewRoot=findN(edData,edViewId)||edData;
    const links=[];
    function walk(node,depth){
      (node.children||[]).forEach(ch=>{
        if(!ids.has(ch.id))return;
        links.push({sid:node.id,tid:ch.id,dashed:!!ch.dashed});
        if(!(isJGView()&&depth>=1))walk(ch,depth+1);
      });
    }
    walk(viewRoot,0);
    return links;
  }

  // ── Selector de área ─────────────────────────────────────
  function populateAreaSel(){
    const sel=document.getElementById("ed-area-sel");
    if(!sel||!edData)return;
    const prev=sel.value;
    sel.innerHTML="";
    const direct=edData.children||[];
    const addOpt=(node,prefix)=>{
      const o=document.createElement("option");
      o.value=node.id;
      o.textContent=prefix+"["+getLabel(node)+"] "+node.nombre;
      sel.appendChild(o);
    };
    addOpt(edData,"");
    direct.filter(n=>n.tipo==="MIN"||n.tipo==="VJG").forEach(n=>addOpt(n,"　"));
    direct.filter(n=>n.tipo==="SEC").forEach(n=>addOpt(n,"　"));
    flat(edData).filter(n=>n.dashed&&(n.children||[]).length>0).forEach(n=>addOpt(n,""));
    if(prev&&sel.querySelector(`option[value="${prev}"]`))sel.value=prev;
    else if(sel.options.length>0){sel.value=sel.options[0].value;}
    edViewId=sel.value;
  }

  // ── Sidebar ──────────────────────────────────────────────
  function renderSidebar(){
    const el=document.getElementById("ed-list");
    if(!el)return;
    el.innerHTML="";
    visibleNodes().forEach(n=>{
      const item=document.createElement("div");
      item.className="ed-ni"+(edSelectedIds.has(n.id)?" sel":"");
      item.dataset.id=n.id;
      item.innerHTML=`<div class="ed-dot" style="background:${getColor(n)}"></div><div class="ed-nm">${n.nombre||"—"}</div><div class="ed-tp">${getLabel(n)}</div>`;
      item.addEventListener("click",()=>selectSingle(n.id));
      el.appendChild(item);
    });
  }

  // ── Canvas ────────────────────────────────────────────────
  function renderCanvas(){
    if(!edData||!edViewId)return;
    const area=document.getElementById("ed-canvas");
    const svgEl=document.getElementById("ed-svg");
    if(!area||!svgEl)return;
    const W=area.clientWidth,H=area.clientHeight;
    const svg=d3.select(svgEl).attr("width",W).attr("height",H);
    svg.selectAll("*").remove();

    const nodes=visibleNodes();
    const links=visibleLinks(nodes);

    // Calcular layout D3 para posiciones iniciales
    function toH(node,depth){
      const kids=isJGView()&&depth>=1?[]:(node.children||[]);
      return{...node,_k:kids.map(c=>toH(c,depth+1)),children:undefined};
    }
    const viewRoot=findN(edData,edViewId)||edData;
    const d3root=d3.hierarchy(toH(viewRoot,0),d=>d._k.length?d._k:null);
    d3.tree().nodeSize([NW+HPAD,NH+VPAD])(d3root);
    const d3pos={};
    d3root.each(n=>{d3pos[n.data.id]={x:n.x,y:n.y};});
    const allD3=Object.values(d3pos);
    const mnX=Math.min(...allD3.map(p=>p.x))-NW/2;
    const mnY=Math.min(...allD3.map(p=>p.y));
    Object.keys(d3pos).forEach(id=>{d3pos[id].x-=mnX;d3pos[id].y-=mnY;});

    // Mezclar: usar posiciones guardadas donde existan, D3 para nodos nuevos
    const saved=loadPosForArea(edViewId)||{};
    edPositions={};
    nodes.forEach(n=>{
      edPositions[n.id]=saved[n.id]?{x:saved[n.id].x,y:saved[n.id].y}:{...(d3pos[n.id]||{x:0,y:0})};
    });
    edWaypoints=loadWPForArea(edViewId);

    const g=svg.append("g").attr("class","canvas-root");
    edZoom=d3.zoom().scaleExtent([0.04,3]).on("zoom",e=>{edTransform=e.transform;g.attr("transform",e.transform);});
    svg.call(edZoom).call(edZoom.transform,edTransform);
    g.attr("transform",edTransform);

    // Links
    const linkG=g.append("g");
    const wpG=g.append("g");

    function linkPath(sid,tid){
      const sp=edPositions[sid]||{x:0,y:0};
      const tp=edPositions[tid]||{x:0,y:0};
      const sx=sp.x,sy=sp.y+NH,tx=tp.x,ty=tp.y;
      const wps=edWaypoints[sid+"-"+tid]||[];
      if(wps.length>0){
        const pts=[{x:sx,y:sy},...wps,{x:tx,y:ty}];
        let d=`M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
        for(let i=1;i<pts.length;i++){
          d+=`L${pts[i].x.toFixed(1)},${pts[i-1].y.toFixed(1)}L${pts[i].x.toFixed(1)},${pts[i].y.toFixed(1)}`;
        }
        return d;
      }
      const my=sy+(ty-sy)/2;
      return`M${sx.toFixed(1)},${sy.toFixed(1)}L${sx.toFixed(1)},${my.toFixed(1)}L${tx.toFixed(1)},${my.toFixed(1)}L${tx.toFixed(1)},${ty.toFixed(1)}`;
    }

    function drawLinks(){
      linkG.selectAll("path.lpath").data(links).join("path")
        .attr("class",d=>"lpath c-link"+(d.dashed?" dashed-link":""))
        .attr("d",d=>linkPath(d.sid,d.tid));
      linkG.selectAll("path.lhit").data(links).join("path")
        .attr("class","lhit")
        .attr("d",d=>linkPath(d.sid,d.tid))
        .attr("fill","none").attr("stroke","transparent").attr("stroke-width",14)
        .style("cursor","crosshair")
        .on("dblclick",function(e,d){
          e.stopPropagation();
          const pt=svgEl.createSVGPoint();
          pt.x=e.clientX;pt.y=e.clientY;
          const gp=pt.matrixTransform(svgEl.getScreenCTM().inverse());
          // gp ya está en coordenadas del SVG; convertir a coordenadas del grupo (deshacer zoom/pan)
          const wp={x:(gp.x-edTransform.x)/edTransform.k,y:(gp.y-edTransform.y)/edTransform.k};
          const k=d.sid+"-"+d.tid;
          if(!edWaypoints[k])edWaypoints[k]=[];
          edWaypoints[k].push(wp);
          saveWPForArea();drawLinks();drawWPs();
        });
    }

    function drawWPs(){
      wpG.selectAll("*").remove();
      links.forEach(lk=>{
        const wps=edWaypoints[lk.sid+"-"+lk.tid]||[];
        wps.forEach((wp,i)=>{
          const c=wpG.append("circle")
            .attr("cx",wp.x).attr("cy",wp.y).attr("r",6)
            .attr("fill","#4f7ef8").attr("stroke","#fff").attr("stroke-width",1.5)
            .style("cursor","grab");
          c.call(d3.drag()
            .on("drag",function(e){
              wp.x+=e.dx/edTransform.k;wp.y+=e.dy/edTransform.k;
              d3.select(this).attr("cx",wp.x).attr("cy",wp.y);
              drawLinks();
            })
            .on("end",()=>{saveWPForArea();showSaved();})
          );
          c.on("contextmenu",function(e){
            e.preventDefault();e.stopPropagation();
            const k=lk.sid+"-"+lk.tid;
            edWaypoints[k].splice(i,1);
            if(!edWaypoints[k].length)delete edWaypoints[k];
            saveWPForArea();drawLinks();drawWPs();
          });
        });
      });
    }

    drawLinks();drawWPs();

    // Nodos
    const nodeG=g.append("g");
    const ng=nodeG.selectAll("g.c-node").data(nodes,d=>d.id).enter()
      .append("g").attr("class",d=>"c-node"+(edSelectedIds.has(d.id)?" sel":""))
      .attr("transform",d=>{const p=edPositions[d.id]||{x:0,y:0};return`translate(${p.x-NW/2},${p.y})`;})
      .style("cursor","pointer")
      .on("click",(e,d)=>{
        e.stopPropagation();
        if(e.shiftKey){
          const desc=flat(findN(edData,d.id)||{children:[]}).map(n=>n.id);
          const allIn=desc.every(id=>edSelectedIds.has(id));
          if(allIn)desc.forEach(id=>edSelectedIds.delete(id));
          else desc.forEach(id=>edSelectedIds.add(id));
          d3.selectAll(".c-node").classed("sel",n=>edSelectedIds.has(n.id));
          renderInspector(findN(edData,d.id));
          document.getElementById("ed-actions").style.display="flex";
        }else{selectSingle(d.id);}
      });

    ng.call(d3.drag()
      .on("start",function(e,d){if(!edSelectedIds.has(d.id)){edSelectedIds.clear();edSelectedIds.add(d.id);d3.selectAll(".c-node").classed("sel",n=>edSelectedIds.has(n.id));}}
      )
      .on("drag",function(e,d){
        const dx=e.dx/edTransform.k,dy=e.dy/edTransform.k;
        edSelectedIds.forEach(id=>{if(edPositions[id]){edPositions[id].x+=dx;edPositions[id].y+=dy;}});
        d3.selectAll(".c-node").filter(n=>edSelectedIds.has(n.id))
          .attr("transform",n=>{const p=edPositions[n.id]||{x:0,y:0};return`translate(${p.x-NW/2},${p.y})`;});
        drawLinks();drawWPs();
      })
      .on("end",()=>{savePosForArea();showSaved();})
    );

    ng.append("rect").attr("width",NW).attr("height",NH).attr("rx",7)
      .attr("fill",d=>getColor(d))
      .attr("stroke",d=>d.dashed?"rgba(255,255,255,0.4)":"none")
      .attr("stroke-width",1.5).attr("stroke-dasharray",d=>d.dashed?"5,3":"none");

    ng.each(function(d){
      const g2=d3.select(this);
      const words=(d.nombre||"").split(" ");
      let l1="",l2="";
      for(const w of words){if((l1+" "+w).trim().length<=20)l1=(l1+" "+w).trim();else l2=(l2+" "+w).trim();}
      const hasTit=d.titular&&d.titular.trim();
      const lines=l2?[l1,l2]:[l1];
      const lh=12,sy2=NH/2-(lines.length+(hasTit?1:0))*lh/2+lh*0.85;
      lines.forEach((l,i)=>g2.append("text").attr("x",NW/2).attr("y",sy2+i*lh)
        .attr("text-anchor","middle").attr("font-size",9.5).attr("font-weight",600)
        .attr("fill","#fff").attr("font-family","Inter,sans-serif").text(l));
      if(hasTit)g2.append("text").attr("x",NW/2).attr("y",sy2+lines.length*lh+1.5)
        .attr("text-anchor","middle").attr("font-size",8).attr("fill","rgba(255,255,255,0.7)")
        .attr("font-family","Inter,sans-serif").text(d.titular.length>24?d.titular.slice(0,24)+"…":d.titular);
    });

    svg.on("click",()=>{edSelectedIds.clear();d3.selectAll(".c-node").classed("sel",false);renderInspector(null);document.getElementById("ed-actions").style.display="none";});

    // Auto-fit si no hay posiciones guardadas para esta área
    if(!Object.keys(saved).length||!edFitted){
      edFitted=true;
      const allP=Object.values(edPositions);
      if(allP.length){
        const mxX=Math.max(...allP.map(p=>p.x))+NW/2+30;
        const myY=Math.max(...allP.map(p=>p.y))+NH+30;
        const mnX2=Math.min(...allP.map(p=>p.x))-NW/2-30;
        const mnY2=Math.min(...allP.map(p=>p.y))-30;
        const sc=Math.min(W/(mxX-mnX2),H/(myY-mnY2),1)*0.88;
        const tx=W/2-(mnX2+(mxX-mnX2)/2)*sc;
        const ty=H/2-(mnY2+(myY-mnY2)/2)*sc;
        edTransform=d3.zoomIdentity.translate(tx,ty).scale(sc);
        svg.call(edZoom.transform,edTransform);
      }
    }
  }

  // ── Selección & Inspector ─────────────────────────────────
  function selectSingle(id){
    edSelectedIds.clear();if(id)edSelectedIds.add(id);
    d3.selectAll(".c-node").classed("sel",d=>edSelectedIds.has(d.id));
    document.querySelectorAll(".ed-ni").forEach(el=>el.classList.toggle("sel",el.dataset.id===id));
    const node=id?findN(edData,id):null;
    renderInspector(node);
    if(id){const el=document.querySelector(`.ed-ni[data-id="${id}"]`);if(el)el.scrollIntoView({block:"nearest"});}
  }

  function renderInspector(node){
    const body=document.getElementById("ed-ins-body");
    const actions=document.getElementById("ed-actions");
    const idEl=document.getElementById("ed-ins-id");
    if(!node){
      body.innerHTML='<div class="ed-ins-empty"><div class="ico">⬡</div><p>Clic = seleccionar<br>Shift+clic = seleccionar<br>nodo + dependientes</p></div>';
      actions.style.display="none";idEl.textContent="";return;
    }
    idEl.textContent=node.id;
    actions.style.display="flex";
    const isC=node.tipo?.startsWith("CUSTOM:");
    const color=getColor(node);
    const label=getLabel(node);
    const tipos={JG:"Jefatura",VJG:"Vicejefatura",MIN:"Ministerio",SEC:"Secretaría",SS:"Subsecretaría",DG:"Dir. General",GG:"Gerencia General",GO:"Gerencia Operativa",ORG:"Organismo"};
    const tipoOpts=Object.entries(tipos).map(([k,v])=>`<option value="${k}"${node.tipo===k?" selected":""}>${v}</option>`).join("")+`<option value="__custom__"${isC?" selected":""}>✏️ Personalizado…</option>`;
    body.innerHTML=`
      <div class="ed-preview" style="background:${color}">
        <div class="ep-label">${label}</div>
        <div class="ep-nombre">${node.nombre||"—"}</div>
        ${node.titular?`<div class="ep-titular">${node.titular}</div>`:""}
      </div>
      <div class="ed-field"><label>Nombre</label><input id="ei-n" value="${(node.nombre||"").replace(/"/g,"&quot;")}"/></div>
      <div class="ed-field"><label>Titular</label><input id="ei-t" value="${(node.titular||"").replace(/"/g,"&quot;")}"/></div>
      <div class="ed-field"><label>Tipo</label>
        <select id="ei-tipo" onchange="document.getElementById('ei-cw').style.display=this.value==='__custom__'?'block':'none'">${tipoOpts}</select>
      </div>
      <div class="ed-field" id="ei-cw" style="display:${isC?"block":"none"}"><label>Nombre del tipo</label><input id="ei-tl" value="${isC?(node.tipoLabel||node.tipo.replace("CUSTOM:","")):""}" /></div>
      <div class="ed-field"><label style="display:flex;align-items:center;gap:7px;text-transform:none;font-size:12px;cursor:pointer;">
        <input type="checkbox" id="ei-d" ${node.dashed?"checked":""} style="width:13px;height:13px;accent-color:#4f7ef8;"/>
        Dependencia funcional
      </label></div>`;
  }

  function saveNodeChanges(){
    const id=[...edSelectedIds][0];
    if(!id)return;
    const nombre=document.getElementById("ei-n")?.value.trim()||"";
    const titular=document.getElementById("ei-t")?.value.trim()||"";
    const tipoRaw=document.getElementById("ei-tipo")?.value||"DG";
    const tipoLabel=document.getElementById("ei-tl")?.value.trim()||"";
    const dashed=document.getElementById("ei-d")?.checked||false;
    const tipo=tipoRaw==="__custom__"?"CUSTOM:"+tipoLabel:tipoRaw;
    const newData=updateN(edData,id,n=>({...n,nombre,titular,tipo,tipoLabel:tipoLabel||undefined,dashed}));
    edData=newData;
    window.dispatchEvent(new CustomEvent("editorDataChanged",{detail:JSON.parse(JSON.stringify(newData))}));
    renderSidebar();renderCanvas();selectSingle(id);showSaved();
  }

  function deleteNode(){
    const id=[...edSelectedIds][0];
    if(!id||id===edData?.id)return;
    const node=findN(edData,id);
    if(!confirm(`¿Eliminar "${node?.nombre}" y todas sus dependencias?`))return;
    const newData=removeN(edData,id);
    edData=newData;
    edSelectedIds.clear();
    window.dispatchEvent(new CustomEvent("editorDataChanged",{detail:JSON.parse(JSON.stringify(newData))}));
    renderSidebar();renderCanvas();renderInspector(null);
    document.getElementById("ed-actions").style.display="none";
    showSaved();
  }

  function showMoveModal(){
    const id=[...edSelectedIds][0];
    if(!id||id===edData?.id)return;
    const node=findN(edData,id);
    const allN=flat(edData).filter(n=>n.id!==id);
    const opts=allN.map(n=>`<option value="${n.id}">[${getLabel(n)}] ${n.nombre}</option>`).join("");
    const overlay=document.createElement("div");
    overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:3000;display:flex;align-items:center;justify-content:center;";
    overlay.innerHTML=`<div style="background:#1a1d27;border:1px solid #333650;border-radius:12px;width:360px;overflow:hidden;">
      <div style="background:#232636;padding:12px 16px;border-bottom:1px solid #333650;font-size:13px;font-weight:600;color:#e8eaf2;">Mover: ${node?.nombre}</div>
      <div style="padding:16px;"><label style="font-size:10px;font-weight:600;color:#6b7199;text-transform:uppercase;display:block;margin-bottom:4px;">Nuevo padre</label>
        <select id="mv-sel" style="width:100%;background:#232636;border:1px solid #333650;color:#e8eaf2;font-family:inherit;font-size:12px;padding:7px;border-radius:6px;outline:none;">${opts}</select></div>
      <div style="padding:10px 16px;border-top:1px solid #333650;display:flex;gap:8px;justify-content:flex-end;">
        <button id="mv-cancel" style="padding:6px 14px;border-radius:7px;background:#232636;border:1px solid #333650;color:#9da3c4;font-family:inherit;font-size:12px;cursor:pointer;">Cancelar</button>
        <button id="mv-ok" style="padding:6px 14px;border-radius:7px;background:#4f7ef8;border:none;color:#fff;font-family:inherit;font-size:12px;cursor:pointer;">Mover</button>
      </div></div>`;
    document.body.appendChild(overlay);
    document.getElementById("mv-cancel").onclick=()=>overlay.remove();
    document.getElementById("mv-ok").onclick=()=>{
      const np=document.getElementById("mv-sel").value;
      if(np){const nd=moveN(edData,id,np);edData=nd;window.dispatchEvent(new CustomEvent("editorDataChanged",{detail:JSON.parse(JSON.stringify(nd))}));renderSidebar();renderCanvas();}
      overlay.remove();showSaved();
    };
  }

  function exportAreaA3(){
    const viewRoot=findN(edData,edViewId)||edData;
    if(!window.__genSVGA3){alert("Esperá que cargue la app.");return;}
    const svg=window.__genSVGA3(viewRoot,1,1);
    window.__dlSVG(svg,`organigrama-${edViewId}-A3.svg`);
    showSaved();
  }

  function showSaved(){
    const el=document.getElementById("ed-saved-msg");
    if(!el)return;
    el.style.opacity="1";clearTimeout(el._t);
    el._t=setTimeout(()=>el.style.opacity="0",2000);
  }

  function resetLayout(){
    if(!edViewId)return;
    if(!confirm("¿Restablecer el layout automático para esta área?"))return;
    clearArea(edViewId);edFitted=false;edTransform=d3.zoomIdentity;
    renderCanvas();showSaved();
  }

  // ── Wire buttons ─────────────────────────────────────────
  function wire(id,fn){const el=document.getElementById(id);if(el)el.onclick=fn;}
  wire("ed-zi",()=>{if(edZoom)d3.select("#ed-svg").call(edZoom.scaleBy,1.3);});
  wire("ed-zo",()=>{if(edZoom)d3.select("#ed-svg").call(edZoom.scaleBy,0.77);});
  wire("ed-zr",()=>{edTransform=d3.zoomIdentity;edFitted=false;renderCanvas();});
  wire("ed-btn-save",()=>{savePosForArea();saveWPForArea();showSaved();});
  wire("ed-btn-export",()=>exportAreaA3());
  wire("ed-btn-reset",()=>resetLayout());
  wire("ed-btn-back",()=>{if(window.__goToOrganigrama)window.__goToOrganigrama();});
  wire("ed-btn-node-save",()=>saveNodeChanges());
  wire("ed-btn-move",()=>showMoveModal());
  wire("ed-btn-delete",()=>deleteNode());

  document.getElementById("ed-area-sel").onchange=function(){
    edViewId=this.value;edSelectedIds.clear();edFitted=false;edTransform=d3.zoomIdentity;
    renderSidebar();renderCanvas();renderInspector(null);
    document.getElementById("ed-actions").style.display="none";
  };

  window.addEventListener("resize",()=>{
    if(document.getElementById("ed-pane").classList.contains("visible"))renderCanvas();
  });

  // ── Activación desde React ───────────────────────────────
  window.addEventListener("editorActivated",e=>{
    edData=e.detail;
    populateAreaSel();
    // Si no hay área seleccionada, tomar la primera del selector
    if(!edViewId||!findN(edData,edViewId)){
      const sel=document.getElementById("ed-area-sel");
      edViewId=sel?.options[0]?.value||edData.id;
      if(sel)sel.value=edViewId;
    }
    edFitted=false;
    renderSidebar();
    renderCanvas();
  });

  window.addEventListener("orgDataChanged",e=>{
    edData=e.detail;
    if(document.getElementById("ed-pane").classList.contains("visible")){
      populateAreaSel();renderSidebar();renderCanvas();
    }
  });

})();
</script>
</body>
</html>
