<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#005EA6;--azul-oscuro:#003D6E;--azul-claro:#E8F2FB;
  --azul-medio:#B8D5EF;--amarillo:#F5C400;--gris-bg:#F2F5F9;
  --gris-card:#FFFFFF;--gris-borde:#D8E2EE;--gris-texto:#4A5568;
  --gris-suave:#718096;--texto:#1A2B42;
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--gris-bg);color:var(--texto);height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer;transition:all .15s}
input,select{font-family:inherit;outline:none;transition:border .15s}
input:focus,select:focus{border-color:var(--azul)!important;box-shadow:0 0 0 3px rgba(0,94,166,.12)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--azul-medio);border-radius:10px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .2s ease}

/* ── Editor D3 ── */
#editor-pane{position:fixed;inset:0;top:56px;display:none;flex-direction:row;z-index:10;background:#0f1117;}
#editor-pane.active{display:flex;}
.ed-sidebar{width:240px;flex-shrink:0;background:#1a1d27;border-right:1px solid #333650;display:flex;flex-direction:column;overflow:hidden;}
.ed-sidebar-hd{padding:10px 12px;border-bottom:1px solid #333650;font-size:10px;font-weight:600;color:#6b7199;text-transform:uppercase;letter-spacing:.06em;}
.ed-node-list{flex:1;overflow-y:auto;padding:4px;}
.ed-ni{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;}
.ed-ni:hover{background:#232636;}
.ed-ni.sel{background:rgba(79,126,248,.15);border-color:#4f7ef8;}
.ed-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}
.ed-nm{font-size:11px;color:#e8eaf2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.ed-tp{font-size:9.5px;color:#6b7199;flex-shrink:0;}
.ed-canvas{flex:1;position:relative;overflow:hidden;background:#0f1117;}
.ed-canvas::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,#333650 1px,transparent 1px);background-size:26px 26px;opacity:.3;pointer-events:none;}
.ed-canvas svg{width:100%;height:100%;}
.ed-zoom{position:absolute;bottom:14px;right:14px;display:flex;gap:3px;}
.ed-zb{width:28px;height:28px;border-radius:7px;background:#1a1d27;border:1px solid #333650;color:#9da3c4;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ed-zb:hover{border-color:#4f7ef8;color:#4f7ef8;}
.ed-inspector{width:268px;flex-shrink:0;background:#1a1d27;border-left:1px solid #333650;display:flex;flex-direction:column;overflow:hidden;}
.ed-ins-hd{padding:10px 12px;border-bottom:1px solid #333650;font-size:10px;font-weight:600;color:#6b7199;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;}
.ed-ins-id{font-size:9px;color:#444870;font-family:monospace;}
.ed-ins-body{flex:1;overflow-y:auto;padding:12px;}
.ed-ins-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:6px;color:#444870;}
.ed-ins-empty .ico{font-size:28px;opacity:.4;}
.ed-ins-empty p{font-size:11px;}
.ed-field{margin-bottom:12px;}
.ed-field label{font-size:10px;font-weight:600;color:#6b7199;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;}
.ed-field input,.ed-field select{width:100%;background:#232636;border:1px solid #333650;color:#e8eaf2;font-family:inherit;font-size:12px;padding:6px 9px;border-radius:6px;outline:none;}
.ed-field input:focus,.ed-field select:focus{border-color:#4f7ef8;}
.ed-field select option{background:#232636;}
.ed-preview{border-radius:8px;padding:10px 12px;margin-bottom:12px;}
.ed-preview .ed-plabel{font-size:9px;font-weight:600;opacity:.65;text-transform:uppercase;letter-spacing:.05em;}
.ed-preview .ed-pnombre{font-size:12px;font-weight:700;line-height:1.3;color:#fff;}
.ed-preview .ed-ptitular{font-size:10.5px;color:rgba(255,255,255,.75);}
.ed-actions{padding:10px 12px;border-top:1px solid #333650;display:flex;flex-direction:column;gap:5px;}
.ed-btn{padding:6px 12px;border-radius:7px;font-size:11.5px;font-weight:500;cursor:pointer;border:1px solid #333650;background:#232636;color:#e8eaf2;font-family:inherit;width:100%;text-align:left;}
.ed-btn:hover{border-color:#4f7ef8;color:#4f7ef8;}
.ed-btn.primary{background:#4f7ef8;border-color:#4f7ef8;color:#fff;}
.ed-btn.primary:hover{opacity:.85;}
.ed-btn.danger{border-color:#ef444455;color:#ef4444;}
.ed-btn.danger:hover{background:#ef444415;}
/* c-node/link */
.c-node rect{transition:filter .12s;}
.c-node:hover rect{filter:brightness(1.18);}
.c-node.sel rect{stroke:#fff;stroke-width:2;}
.c-link{fill:none;stroke:#444870;stroke-width:1.1;}
.c-link.dashed{stroke-dasharray:5,3;stroke:#333650;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#444870;border-radius:4px;}
</style>
</head>

<div id="root" style="height:100vh"></div>

<!-- Editor visual D3 — se muestra/oculta desde React -->
<div id="editor-pane">
  <!-- toolbar superior del editor -->
  <div id="ed-toolbar" style="position:absolute;top:0;left:0;right:0;height:42px;background:#1a1d27;border-bottom:1px solid #333650;display:flex;align-items:center;padding:0 12px;gap:8px;z-index:20;">
    <span style="font-size:10px;font-weight:600;color:#6b7199;text-transform:uppercase;letter-spacing:.06em;">Área:</span>
    <select id="ed-area-sel" style="background:#232636;border:1px solid #444870;color:#e8eaf2;font-family:inherit;font-size:11.5px;padding:4px 8px;border-radius:6px;outline:none;min-width:240px;flex:1;max-width:360px;"></select>
    <span style="font-size:10px;color:#6b7199;margin-left:8px;" title="Doble clic en una línea para agregar un punto de quiebre. Click derecho en el punto para eliminarlo.">💡 Doble clic en línea = agregar punto de quiebre · Click derecho = eliminar</span>
    <div style="margin-left:auto;display:flex;gap:6px;align-items:center;">
      <span id="ed-saved-msg" style="font-size:11px;color:#22c55e;opacity:0;transition:opacity .3s;">✓ Guardado</span>
      <button id="ed-save-layout" style="background:#4f7ef8;border:none;color:#fff;font-family:inherit;font-size:11.5px;font-weight:500;padding:5px 14px;border-radius:7px;cursor:pointer;">💾 Guardar layout</button>
      <button id="ed-reset-layout-btn" onclick="window.edResetLayout&&window.edResetLayout()" style="background:#232636;border:1px solid #444870;color:#9da3c4;font-family:inherit;font-size:11.5px;padding:5px 12px;border-radius:7px;cursor:pointer;" title="Volver al layout automático D3">↺ Resetear</button>
      <button onclick="window.__switchToOrganigrama&&window.__switchToOrganigrama()" style="background:#232636;border:1px solid #4f7ef8;color:#7c9fff;font-family:inherit;font-size:11.5px;font-weight:500;padding:5px 12px;border-radius:7px;cursor:pointer;" title="Volver al organigrama">← Organigrama</button>
    </div>
  </div>
  <div class="ed-sidebar" style="margin-top:42px;">
    <div class="ed-sidebar-hd">Nodos</div>
    <div class="ed-node-list" id="ed-node-list"></div>
  </div>
  <div class="ed-canvas" id="ed-canvas" style="margin-top:42px;">
    <svg id="ed-svg"></svg>
    <div class="ed-zoom">
      <button class="ed-zb" id="ed-zi" title="Acercar">+</button>
      <button class="ed-zb" id="ed-zr" title="Centrar vista">⌂</button>
      <button class="ed-zb" id="ed-zo" title="Alejar">−</button>
      <button class="ed-zb" id="ed-reset-layout" onclick="window.edResetLayout&&window.edResetLayout()" title="Restablecer layout automático" style="font-size:12px;">↺</button>
    </div>
  </div>
  <div class="ed-inspector" style="margin-top:42px;">
    <div class="ed-ins-hd">Inspector <span class="ed-ins-id" id="ed-ins-id"></span></div>
    <div class="ed-ins-body" id="ed-ins-body">
      <div class="ed-ins-empty"><div class="ico">⬡</div><p>Seleccioná un nodo</p></div>
    </div>
    <div class="ed-actions" id="ed-actions" style="display:none">
      <button class="ed-btn primary" id="ed-save">✓ Guardar cambios</button>
      <button class="ed-btn" id="ed-move">↕ Mover a otro padre</button>
      <button class="ed-btn danger" id="ed-del">✕ Eliminar nodo</button>
    </div>
  </div>
</div>

  ORG:{bg:"#374151",text:"#fff",light:"#F3F4F6",label:"Organismo desc."},
};

function getColorForNode(node){
  if(node.tipo && node.tipo.startsWith(CUSTOM_TIPO_PREFIX)){
    return {bg:"#5B21B6",text:"#fff",light:"#EDE9FE",label:node.tipoLabel||node.tipo.replace(CUSTOM_TIPO_PREFIX,"")};
  }
  return COLORS[node.tipo]||COLORS.ORG;
}

function getColorForTipo(tipo, tipoLabel){
  if(tipo && tipo.startsWith(CUSTOM_TIPO_PREFIX)){
    return {bg:"#5B21B6",text:"#fff",light:"#EDE9FE",label:tipoLabel||tipo.replace(CUSTOM_TIPO_PREFIX,"")};
  }
  return COLORS[tipo]||COLORS.ORG;
}

/* ── Helpers ─────────────────────────────────────── */
const STORAGE_KEY="gcba_org_v2";
function loadData(){try{const s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):INITIAL;}catch{return INITIAL;}}
function saveData(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch{}}
function flatList(t,a=[]){a.push(t);t.children.forEach(c=>flatList(c,a));return a;}
function findNode(t,id){if(t.id===id)return t;for(const c of t.children){const f=findNode(c,id);if(f)return f;}return null;}
function findParent(t,id,parent=null){if(t.id===id)return parent;for(const c of t.children){const f=findParent(c,id,t);if(f!==undefined)return f;}return undefined;}
function updateNode(t,id,fn){if(t.id===id)return fn(t);return{...t,children:t.children.map(c=>updateNode(c,id,fn))};}
function removeNode(t,id){return{...t,children:t.children.filter(c=>c.id!==id).map(c=>removeNode(c,id))};}
function addChild(t,pid,child){return updateNode(t,pid,n=>({...n,children:[...n.children,child]}));}

/* Move node: remove from current parent, add to new parent */
function moveNode(t, nodeId, newParentId) {
  const node = findNode(t, nodeId);
  if(!node) return t;
  const withoutNode = removeNode(t, nodeId);
  return addChild(withoutNode, newParentId, node);
}

/* ── SVG export con D3 ───────────────────────────── */
const CF={JG:"#9B1C1C",VJG:"#9B1C1C",MIN:"#92400E",SEC:"#78350F",SS:"#1E3A5F",DG:"#14532D",GG:"#065F46",GO:"#064E3B",ORG:"#374151"};
const fv=v=>Number(v).toFixed(1);

function getSVGColor(node){
  if(node.tipo&&node.tipo.startsWith(CUSTOM_TIPO_PREFIX))return"#5B21B6";
  return CF[node.tipo]||"#374151";
}

function wrapTxt(t,maxChars){
  if(!t)return[];
  const words=t.split(" ");const lines=[];let cur="";
  for(const w of words){
    const test=(cur?" "+w:w);
    if(cur.length+test.length>maxChars&&cur){lines.push(cur);cur=w;}
    else cur=(cur+test).trim();
  }
  if(cur)lines.push(cur);
  return lines;
}

function svgBoxSized(x,y,node,BW,BH,dashed,fsN,fsT){
  const fill=getSVGColor(node);
  // Caracteres por línea basado en el ancho real del nodo y el tamaño de fuente
  // ~0.55em por carácter es una buena estimación para Inter
  const charsN=Math.max(6,Math.floor(BW/(fsN*0.55)));
  const charsT=Math.max(6,Math.floor(BW/(fsT*0.54)));
  const nl=wrapTxt(node.nombre,charsN);
  const tl=wrapTxt(node.titular||"",charsT);
  const lhN=fsN*1.3;   // interlineado nombre
  const lhT=fsT*1.25;  // interlineado titular
  const gap=tl.length?fsN*0.35:0; // gap entre nombre y titular
  // Altura total del bloque de texto
  const blockH=nl.length*lhN+gap+(tl.length?tl.length*lhT:0);
  // Punto de inicio: centrado verticalmente en el nodo
  // SVG text y= baseline, así que sumamos lhN para la primera línea
  let yt=y+(BH-blockH)/2+lhN*0.85;
  const da=dashed?`stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="5,3"`:"";
  const rx=fv(Math.max(4,BH*0.12));
  let t=`<rect x="${fv(x)}" y="${fv(y)}" width="${fv(BW)}" height="${fv(BH)}" rx="${rx}" fill="${fill}" ${da}/>`;
  nl.forEach(l=>{
    t+=`<text x="${fv(x+BW/2)}" y="${fv(yt)}" text-anchor="middle" font-size="${fv(fsN)}" font-weight="600" fill="#fff" font-family="Inter,Arial,sans-serif">${l}</text>`;
    yt+=lhN;
  });
  yt+=gap;
  tl.forEach(l=>{
    t+=`<text x="${fv(x+BW/2)}" y="${fv(yt)}" text-anchor="middle" font-size="${fv(fsT)}" fill="rgba(255,255,255,0.82)" font-family="Inter,Arial,sans-serif">${l}</text>`;
    yt+=lhT;
  });
  return t;
}

function svgBox(x,y,node,BW,BH,dashed=false){
  return svgBoxSized(x,y,node,BW,BH,dashed,Math.max(7,Math.min(11,BW/15)),Math.max(6,Math.min(9,BW/18)));
}

// collectOrgs recursivo (todos los descendientes dashed)
function collectOrgs(node,acc=[]){
  node.children.forEach(ch=>{
    if(ch.dashed)acc.push(ch);
    else collectOrgs(ch,acc);
  });
  return acc;
}

// collectOrgs solo hijos directos dashed del nodo
function collectOrgsRoot(node){
  return node.children.filter(c=>c.dashed);
}

// Convierte árbol en jerarquía D3 (excluye dashed).
// Si un nodo tiene hijos mixtos (contenedores SS/GG + hojas DG),
// envuelve las hojas en un fantasma para que queden un nivel más profundo
// (mismo nivel visual que los hijos de los contenedores).
function toD3Tree(node){
  const hier=node.children.filter(c=>!c.dashed);
  if(!hier.length)return{...node,_children:[],children:undefined};
  const CONTAINERS=["SS","GG","SEC","MIN"];
  const hasContainer=hier.some(c=>CONTAINERS.includes(c.tipo));
  const hasDirect=hier.some(c=>!CONTAINERS.includes(c.tipo)&&c.tipo!=="VJG"&&c.tipo!=="JG"&&c.tipo!=="ORG");
  let kids;
  if(hasContainer&&hasDirect){
    const containers=hier.filter(c=>CONTAINERS.includes(c.tipo));
    const directs=hier.filter(c=>!CONTAINERS.includes(c.tipo)&&c.tipo!=="VJG"&&c.tipo!=="JG"&&c.tipo!=="ORG");
    const phantom={id:"__ph_"+node.id,nombre:"",titular:"",tipo:"__phantom__",
      _children:directs.map(toD3Tree),children:undefined};
    kids=[...containers.map(toD3Tree),phantom];
  } else {
    kids=hier.map(toD3Tree);
  }
  return{...node,_children:kids,children:undefined};
}

// Para JG: layout manual en 2 filas (no usa D3 tree)
// Fila 1: VJG + Ministerios  |  Fila 2: Secretarías
// Retorna {nodes, links} con coordenadas absolutas ya calculadas
function layoutJG(root,NW,NH,HPAD,VPAD){
  const hier=root.children.filter(c=>!c.dashed);
  const mins=hier.filter(c=>c.tipo==="MIN"||c.tipo==="VJG");
  const secs=hier.filter(c=>c.tipo==="SEC");

  const row1Y=NH+VPAD;                    // fila ministerios
  const row2Y=row1Y+NH+VPAD;             // fila secretarías

  const makeRow=(items,rowY)=>{
    const total=items.length*(NW+HPAD)-HPAD;
    let x=-(total/2)+NW/2;
    return items.map(c=>{
      const n={x,y:rowY,data:c,depth:1};
      x+=NW+HPAD;
      return n;
    });
  };

  const rootNode={x:0,y:0,data:root,depth:0};
  const minNodes=makeRow(mins,row1Y);
  const secNodes=makeRow(secs,row2Y);
  const allNodes=[rootNode,...minNodes,...secNodes];

  // Links: root→cada MIN directamente
  // root→cada SEC: usamos un nodo "puente" invisible en fila 1.5 para que
  // la línea baje por un carril lateral y no cruce los ministerios.
  // Implementación simple: marcamos los links SEC con secLink=true
  // y en el render los dibujamos con un mid_Y que pase entre fila1 y fila2.
  const links=[
    ...minNodes.map(t=>({source:rootNode,target:t,isSec:false})),
    ...secNodes.map(t=>({source:rootNode,target:t,isSec:true}))
  ];

  return{nodes:allNodes,links};
}

function genPageSVG(root,pn,tot){
  const today=new Date();
  const fecha=`${String(today.getDate()).padStart(2,"0")}/${String(today.getMonth()+1).padStart(2,"0")}/${today.getFullYear()}`;

  const PW=1587,PH=1123;
  const MAR=40,HH=68,FH=34;
  const AVAIL_W=PW-MAR*2;
  const AVAIL_H=PH-HH-FH-MAR;

  const isJG=root.tipo==="JG";
  const orgs=isJG?collectOrgsRoot(root):collectOrgs(root);
  const hasOrgs=orgs.length>0;
  const ORG_COLS=Math.min(Math.max(orgs.length,1),8);
  const ORG_ROWS=Math.ceil(orgs.length/ORG_COLS);
  const ORG_SECTION_H=hasOrgs?(30+ORG_ROWS*52):0;
  const HIER_H=AVAIL_H-ORG_SECTION_H;

  // ── Medir el árbol con layout unitario para calcular span ──
  let rawSpanX, rawSpanY;
  if(isJG){
    const hier=root.children.filter(c=>!c.dashed);
    const mins=hier.filter(c=>c.tipo==="MIN"||c.tipo==="VJG");
    const secs=hier.filter(c=>c.tipo==="SEC");
    rawSpanX=Math.max(mins.length,secs.length);
    rawSpanY=3;
  } else {
    const td=toD3Tree(root);
    const h0=d3.hierarchy(td,d=>d._children);
    d3.tree().nodeSize([1,1])(h0);
    const n0=h0.descendants().filter(n=>n.data.tipo!=="__phantom__");
    rawSpanX=(d3.max(n0,n=>n.x)-d3.min(n0,n=>n.x))+1;
    rawSpanY=(d3.max(n0,n=>n.depth)||1)+1;
  }

  // ── Calcular tamaño de nodo ──────────────────────────────
  // Gaps fijos mínimos
  const HGAP=8, VGAP=22;
  // Máximo ancho y alto que entra en el espacio disponible
  const NW_max=Math.floor((AVAIL_W - HGAP*(rawSpanX-1)) / rawSpanX);
  const NH_max=Math.floor((HIER_H  - VGAP*(rawSpanY-1)) / rawSpanY);

  // Fuente objetivo: queremos poder mostrar ~20 caracteres en una línea
  // a ~0.55em/char, eso da NW = 20*fs*0.55. Con fs mínimo de 7px: NW_min ≈ 77px
  // Preferimos NW estrecho y NH generoso para que entre el texto verticalmente
  // Relación objetivo: NW:NH = 2.2:1 (más alto que antes)
  const ASPECT=2.2;
  let NW=Math.min(NW_max, 220);
  let NH=Math.min(NH_max, Math.round(NW/ASPECT));
  // Si NH_max permite más altura, aprovecharlo
  if(NH_max > NH){ NH=Math.min(NH_max, Math.round(NW/1.6)); }
  NW=Math.max(NW,65); NH=Math.max(NH,30);
  NW=Math.round(NW);  NH=Math.round(NH);

  // Tamaños de fuente proporcionales al nodo
  const fsN=Math.max(6.5, Math.min(12, NW/15));
  const fsT=Math.max(5.5, Math.min(10, NW/18));

  // NH mínimo garantizado para que 2 líneas de nombre + 1 titular entren
  const lhN=fsN*1.3, lhT=fsT*1.25;
  const textH=2*lhN + lhT + fsN*0.6; // 2 líneas nombre + gap + 1 titular
  const minNH=Math.ceil(textH*1.25);  // 25% padding vertical
  NH=Math.max(NH, minNH);

  const HPAD=Math.max(HGAP, Math.round((AVAIL_W - NW*rawSpanX)/(rawSpanX+1)));
  const VPAD=Math.max(VGAP, Math.round((HIER_H  - NH*rawSpanY)/(rawSpanY+1)));
  const sw=Math.max(0.8, NW/220);

  // ── Layout: posiciones del editor visual o automático D3 ──
  // Posiciones guardadas por área (clave = root.id del área que se editó)
  const savedPos=(window.__edPositions||{})[root.id]||null;
  // Estilo de línea guardado
  const lineStyleA3=(()=>{try{return localStorage.getItem('gcba_org_linestyle_v1')||'orthogonal';}catch{return'orthogonal';}})();
  const useSaved=savedPos&&Object.keys(savedPos).length>0;

  let nodes,links,SNW,SNH,sfsN,sfsT,sVPAD,ox,oy;

  if(useSaved){
    // Usar posiciones guardadas por el drag del editor visual
    function collectHier(node,acc=[]){acc.push(node);(node.children||[]).filter(c=>!c.dashed).forEach(c=>collectHier(c,acc));return acc;}
    const allTreeNodes=collectHier(root);
    nodes=allTreeNodes.map(n=>({x:savedPos[n.id]?.x??0,y:savedPos[n.id]?.y??0,data:n,depth:n.id===root.id?0:1}));
    links=[];
    function buildSavedLinks(node){
      const src=nodes.find(n=>n.data.id===node.id);
      if(!src)return;
      (node.children||[]).filter(c=>!c.dashed).forEach(ch=>{
        const tgt=nodes.find(n=>n.data.id===ch.id);
        if(tgt)links.push({source:src,target:tgt,isSec:false});
        buildSavedLinks(ch);
      });
    }
    buildSavedLinks(root);
    // Normalizar y escalar
    const mnX=d3.min(nodes,n=>n.x)-NW/2,mnY=d3.min(nodes,n=>n.y);
    nodes.forEach(n=>{n.x-=mnX;n.y-=mnY;});
    const tW=d3.max(nodes,n=>n.x+NW/2),tH=d3.max(nodes,n=>n.y+NH);
    const sc=Math.min(AVAIL_W/tW,HIER_H/tH);
    const scale2=sc;
    nodes.forEach(n=>{n.x*=sc;n.y*=sc;});
    SNW=NW*sc;SNH=NH*sc;
    sfsN=Math.max(6,Math.min(13,fsN*sc));sfsT=Math.max(5,Math.min(10,fsT*sc));sVPAD=VPAD*sc;
    const fW=d3.max(nodes,n=>n.x+SNW/2),fH=d3.max(nodes,n=>n.y+SNH);
    ox=MAR+(AVAIL_W-fW)/2;oy=HH+(HIER_H-fH)/2;
  } else {
    // Layout automático D3
    if(isJG){
      ({nodes,links}=layoutJG(root,NW,NH,HPAD,VPAD));
    } else {
      const td=toD3Tree(root);
      const hier=d3.hierarchy(td,d=>d._children);
      d3.tree().nodeSize([NW+HPAD,NH+VPAD])(hier);
      const allN=hier.descendants(),allL=hier.links();
      nodes=allN.filter(n=>n.data.tipo!=="__phantom__");
      const realLinks=allL.filter(l=>l.source.data.tipo!=="__phantom__"&&l.target.data.tipo!=="__phantom__");
      const skipped=[];
      allL.filter(l=>l.source.data.tipo==="__phantom__").forEach(l=>{if(l.source.parent)skipped.push({source:l.source.parent,target:l.target});});
      links=[...realLinks,...skipped];
    }
    const minX=d3.min(nodes,n=>n.x)-NW/2,minY=d3.min(nodes,n=>n.y);
    nodes.forEach(n=>{n.x-=minX;n.y-=minY;});
    const treeW=d3.max(nodes,n=>n.x+NW/2),treeH=d3.max(nodes,n=>n.y+NH);
    const scale=Math.min(AVAIL_W/treeW,HIER_H/treeH);
    nodes.forEach(n=>{n.x*=scale;n.y*=scale;});
    SNW=NW*scale;SNH=NH*scale;
    sfsN=Math.max(6,Math.min(13,fsN*scale));sfsT=Math.max(5,Math.min(10,fsT*scale));sVPAD=VPAD*scale;
    const finalW=d3.max(nodes,n=>n.x+SNW/2),finalH=d3.max(nodes,n=>n.y+SNH);
    ox=MAR+(AVAIL_W-finalW)/2;oy=HH+(HIER_H-finalH)/2;
  }
  const hc=getSVGColor(root);

  // ── Líneas jerárquicas ──────────────────────────────────
  // Leer waypoints guardados para esta área
  const a3Waypoints=(()=>{try{return(JSON.parse(localStorage.getItem('gcba_org_waypoints_v1')||"{}")[root.id])||{};}catch{return{};}})();

  function wpKeyA3(sid,tid){return sid+"-"+tid;}

  // Función de path según estilo guardado y waypoints
  function a3LinkPath(sx,sy,tx,ty,isSec,sid,tid){
    const wps=(a3Waypoints[wpKeyA3(sid,tid)]||[]);
    if(wps.length>0){
      // Con waypoints: ortogonal pasando por cada punto
      const allPts=[{x:sx,y:sy+SNH},...wps.map(wp=>({x:wp.x*scale2||wp.x*(SNW/NW),y:wp.y*scale2||wp.y*(SNH/NH)})),{x:tx,y:ty}];
      // Usar scale aplicada a las posiciones
      // Los waypoints están en coordenadas del editor (NW/NH base), escalarlos igual que los nodos
      const scFactor=useSaved?(SNW/NW):1;
      const scaledPts=[{x:sx,y:sy+SNH},...wps.map(wp=>({x:wp.x*scFactor,y:wp.y*scFactor})),{x:tx,y:ty}];
      let d=`M${fv(scaledPts[0].x)},${fv(scaledPts[0].y)}`;
      for(let i=1;i<scaledPts.length;i++){
        d+=`L${fv(scaledPts[i-1].x)},${fv(scaledPts[i].y)}L${fv(scaledPts[i].x)},${fv(scaledPts[i].y)}`;
      }
      return`<path d="${d}" fill="none" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`;
    }
    if(lineStyleA3==='diagonal'){
      return`<line x1="${fv(sx)}" y1="${fv(sy+SNH)}" x2="${fv(tx)}" y2="${fv(ty)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`;
    } else if(lineStyleA3==='curved'){
      const cy1=sy+SNH+(ty-(sy+SNH))*0.4;
      const cy2=sy+SNH+(ty-(sy+SNH))*0.6;
      return`<path d="M${fv(sx)},${fv(sy+SNH)}C${fv(sx)},${fv(cy1)} ${fv(tx)},${fv(cy2)} ${fv(tx)},${fv(ty)}" fill="none" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`;
    } else {
      // orthogonal — con rail especial para SEC en JG
      if(isSec){
        const minNodesX2=nodes.filter(n=>n.depth===1&&(n.data.tipo==="MIN"||n.data.tipo==="VJG")).map(n=>n.x);
        const railX=minNodesX2.length>0?Math.min(...minNodesX2)-SNW/2-8:0;
        const b1=sy+SNH+sVPAD/2,mr=ty-sVPAD/2;
        return`<line x1="${fv(sx)}" y1="${fv(sy+SNH)}" x2="${fv(sx)}" y2="${fv(b1)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`+
               `<line x1="${fv(sx)}" y1="${fv(b1)}" x2="${fv(railX)}" y2="${fv(b1)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`+
               `<line x1="${fv(railX)}" y1="${fv(b1)}" x2="${fv(railX)}" y2="${fv(mr)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`+
               `<line x1="${fv(railX)}" y1="${fv(mr)}" x2="${fv(tx)}" y2="${fv(mr)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`+
               `<line x1="${fv(tx)}" y1="${fv(mr)}" x2="${fv(tx)}" y2="${fv(ty)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`;
      }
      const mid=sy+SNH+sVPAD/2;
      return`<line x1="${fv(sx)}" y1="${fv(sy+SNH)}" x2="${fv(sx)}" y2="${fv(mid)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`+
             `<line x1="${fv(sx)}" y1="${fv(mid)}" x2="${fv(tx)}" y2="${fv(mid)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`+
             `<line x1="${fv(tx)}" y1="${fv(mid)}" x2="${fv(tx)}" y2="${fv(ty)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`;
    }
  }

  let linesSVG="";
  links.forEach(lk=>{
    const sid=lk.source.data?.id||"";
    const tid=lk.target.data?.id||"";
    linesSVG+=a3LinkPath(lk.source.x,lk.source.y,lk.target.x,lk.target.y,lk.isSec||false,sid,tid);
  });

  // ── Nodos ───────────────────────────────────────────────
  let nodesSVG="";
  nodes.forEach(n=>{
    nodesSVG+=svgBoxSized(n.x-SNW/2,n.y,n.data,SNW,SNH,false,sfsN,sfsT);
  });

  let hierSVG=`<g transform="translate(${fv(ox)},${fv(oy)})">`;
  hierSVG+=linesSVG+nodesSVG;
  hierSVG+=`</g>`;

  // ── Organismos fuera de nivel ────────────────────────────
  let orgsSVG="";
  if(hasOrgs){
    const sepY=HH+HIER_H+8;
    const OBW=Math.min(150,Math.floor((AVAIL_W-(ORG_COLS-1)*8)/ORG_COLS));
    const OBH=Math.round(OBW/3.0);
    const OGAP=8;
    const orgRowW=ORG_COLS*OBW+(ORG_COLS-1)*OGAP;
    const orgStartX=MAR+(AVAIL_W-orgRowW)/2;
    const fsO=Math.max(6.5,Math.min(10,OBW/15));

    orgsSVG+=`<line x1="${MAR}" y1="${fv(sepY)}" x2="${fv(PW-MAR)}" y2="${fv(sepY)}" stroke="#CBD5E0" stroke-width="0.8" stroke-dasharray="5,4"/>`;
    orgsSVG+=`<text x="${fv(PW/2)}" y="${fv(sepY+12)}" text-anchor="middle" font-size="7.5" fill="#A0AEC0" font-family="Inter,Arial,sans-serif" letter-spacing="1.5">ORGANISMOS DESCENTRALIZADOS Y FUERA DE NIVEL</text>`;

    // Ancla: borde inferior del nodo raíz (coordenadas de página)
    const rootN=nodes.find(n=>n.depth===0)||nodes[0];
    const anchorX=ox+rootN.x;
    const anchorY=oy+rootN.y+SNH;

    // Rail vertical en el MARGEN DERECHO — dentro del viewBox
    const railX=MAR+AVAIL_W+18; // justo fuera del área de contenido pero dentro del SVG
    const lastOrgTopY=sepY+18+(ORG_ROWS-1)*(OBH+OGAP);

    // 1. Línea horizontal: ancla → rail
    orgsSVG+=`<line x1="${fv(anchorX)}" y1="${fv(anchorY)}" x2="${fv(railX)}" y2="${fv(anchorY)}" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="5,3"/>`;
    // 2. Rail vertical: desde ancla hasta la altura del último org
    orgsSVG+=`<line x1="${fv(railX)}" y1="${fv(anchorY)}" x2="${fv(railX)}" y2="${fv(lastOrgTopY+OBH/2)}" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="5,3"/>`;

    // 3. Por cada org: línea horizontal del rail → borde derecho del org,
    //    luego bajada vertical hasta el tope del org
    orgs.forEach((org,i)=>{
      const col=i%ORG_COLS, row=Math.floor(i/ORG_COLS);
      const ox2=orgStartX+col*(OBW+OGAP);
      const oy2=sepY+18+row*(OBH+OGAP);
      const orgTopY=oy2;
      const orgMidY=oy2+OBH/2;
      const orgCX=ox2+OBW/2; // centro horizontal del org
      // Del rail al centro del org, a la altura media
      orgsSVG+=`<line x1="${fv(railX)}" y1="${fv(orgMidY)}" x2="${fv(orgCX)}" y2="${fv(orgMidY)}" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="5,3"/>`;
      // Del centro hacia arriba hasta el tope del nodo
      orgsSVG+=`<line x1="${fv(orgCX)}" y1="${fv(orgMidY)}" x2="${fv(orgCX)}" y2="${fv(orgTopY)}" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="5,3"/>`;
    });

    // 4. Nodos encima
    orgs.forEach((org,i)=>{
      const col=i%ORG_COLS, row=Math.floor(i/ORG_COLS);
      const ox2=orgStartX+col*(OBW+OGAP);
      const oy2=sepY+18+row*(OBH+OGAP);
      orgsSVG+=svgBoxSized(ox2,oy2,org,OBW,OBH,true,fsO,fsO*0.85);
    });
  }

  // ── Leyenda ─────────────────────────────────────────────
  const leg=[["#9B1C1C","Jefatura"],["#92400E","Ministerio"],["#78350F","Secretaría"],["#1E3A5F","Subsecretaría"],["#14532D","Dir. General"],["#374151","Org. desc."],["#5B21B6","Personalizado"]];
  const lw=125,lx=(PW-(leg.length*lw))/2,ly=PH-FH+12;
  let legSVG=leg.map((it,i)=>`<rect x="${fv(lx+i*lw)}" y="${fv(ly)}" width="9" height="9" rx="2" fill="${it[0]}"/><text x="${fv(lx+i*lw+13)}" y="${fv(ly+8)}" font-size="8" fill="#718096" font-family="Inter,Arial,sans-serif">${it[1]}</text>`).join("");
  if(tot>1)legSVG+=`<text x="${fv(PW-MAR)}" y="${fv(ly+8)}" text-anchor="end" font-size="8" fill="#A0AEC0" font-family="Inter,Arial,sans-serif">${pn}/${tot}</text>`;

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${PH}" viewBox="0 0 ${PW} ${PH}">
<defs><linearGradient id="hg${pn}" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="${hc}"/><stop offset="100%" stop-color="${hc}CC"/></linearGradient></defs>
<rect width="${PW}" height="${PH}" fill="#F8FAFC"/>
<rect x="0" y="0" width="${PW}" height="${HH}" fill="url(#hg${pn})"/>
<line x1="0" y1="${HH}" x2="${PW}" y2="${HH}" stroke="#E2E8F0" stroke-width="1"/>
<text x="${fv(PW/2)}" y="${fv(HH*0.47)}" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="Inter,Arial,sans-serif">${root.nombre}</text>
<text x="${fv(PW/2)}" y="${fv(HH*0.78)}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.72)" font-family="Inter,Arial,sans-serif">Ciudad Autónoma de Buenos Aires · Última actualización: ${fecha}</text>
${hierSVG}${orgsSVG}
<rect x="0" y="${PH-FH}" width="${PW}" height="${FH}" fill="#F8FAFC"/>
<line x1="0" y1="${PH-FH}" x2="${PW}" y2="${PH-FH}" stroke="#E2E8F0" stroke-width="0.8"/>
${legSVG}
</svg>`;
}



function dlSVG(svgStr,fname){
  const blob=new Blob([svgStr],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),100);
}

/* ── Panel item ──────────────────────────────────── */
function PanelItem({node,onSelect,selectedId,depth=0}){

  const col=getColorForNode(node);
  const isSel=selectedId===node.id;
  return(
    <div style={{marginBottom:2}}>
      <div onClick={()=>{onSelect(node);if(node.children.length)setOpen(o=>!o);}}
        style={{display:"flex",alignItems:"center",gap:8,padding:`${depth===0?"7px":"5px"} 10px`,
          marginLeft:depth*12,borderRadius:8,cursor:"pointer",

          border:`1.5px ${node.dashed?"dashed":"solid"} ${isSel?col.bg:depth===0?"rgba(0,94,166,0.2)":"transparent"}`,
          transition:"all 0.15s"}}
        onMouseEnter={e=>{if(!isSel)e.currentTarget.style.background="rgba(0,94,166,0.08)";}}
        onMouseLeave={e=>{if(!isSel)e.currentTarget.style.background=depth===0?"rgba(0,94,166,0.06)":"transparent";}}>

          <div style={{fontSize:depth===0?12:11,fontWeight:depth===0?600:400,

/* Selector de tipo que incluye opción "Otro" con campo libre */
function TipoSelector({tipo, tipoLabel, onTipoChange, onTipoLabelChange}){

/* ── Modal Vista A3 ──────────────────────────────── */
function ModalA3({data,allNodes,onClose}){
  // Nodos que tiene sentido ver en A3: Ministerios, VJG, SECs directas de JG, ORGs con hijos
  const a3Nodes=React.useMemo(()=>{
    const direct=(data.children||[]);
    const result=[];
    // Ministerios y VJG
    direct.filter(n=>n.tipo==="MIN"||n.tipo==="VJG").forEach(n=>result.push(n));
    // Secretarías directas de JG
    direct.filter(n=>n.tipo==="SEC").forEach(n=>result.push(n));
    // Organismos fuera de nivel con hijos propios
    direct.filter(n=>n.dashed&&(n.children||[]).length>0).forEach(n=>result.push(n));
    // También organismos dentro de ministerios que tengan hijos (ej: PG, CDNNYA)
    allNodes.filter(n=>n.dashed&&(n.children||[]).length>0&&!direct.find(d=>d.id===n.id)).forEach(n=>result.push(n));
    return result;
  },[data,allNodes]);

  const[selId,setSelId]=React.useState(a3Nodes[0]?.id||data.id);
  const[svgStr,setSvgStr]=React.useState("");
  const selNode=React.useMemo(()=>findNode(data,selId)||data,[data,selId]);

  React.useEffect(()=>{
    // Leer posiciones frescas de localStorage cada vez que cambia el nodo
    try{
      window.__edPositions=JSON.parse(localStorage.getItem('gcba_org_positions_v1')||"{}");
      setSvgStr(genPageSVG(selNode,1,1));
    }catch(e){console.error(e);}
  },[selNode]);

  const download=()=>{
    window.__edPositions=JSON.parse(localStorage.getItem('gcba_org_positions_v1')||"{}");
    dlSVG(genPageSVG(selNode,1,1),`organigrama-${selId.toLowerCase()}-A3.svg`);
  };

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(10,15,30,0.85)",zIndex:2000,display:"flex",flexDirection:"column",backdropFilter:"blur(4px)"}}>
      <div onClick={e=>e.stopPropagation()} style={{display:"flex",flexDirection:"column",height:"100%"}}>
        {/* toolbar */}
        <div style={{background:"#1a1d27",borderBottom:"1px solid #333650",padding:"10px 16px",display:"flex",gap:10,alignItems:"center",flexShrink:0}}>
          <span style={{color:"#9da3c4",fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:".06em"}}>Vista A3 imprimible</span>
          <select value={selId} onChange={e=>setSelId(e.target.value)}
            style={{background:"#232636",border:"1px solid #444870",color:"#e8eaf2",fontFamily:"inherit",fontSize:12,padding:"6px 10px",borderRadius:7,outline:"none",minWidth:300}}>
            {a3Nodes.map(n=><option key={n.id} value={n.id}>[{(COLORS[n.tipo]||COLORS.ORG).label}] {n.nombre}</option>)}
          </select>
          <button onClick={download}
            style={{background:"#4f7ef8",border:"none",color:"#fff",fontFamily:"inherit",fontSize:12,fontWeight:500,padding:"6px 14px",borderRadius:7,cursor:"pointer",marginLeft:"auto"}}>
            ⬇ Descargar SVG A3
          </button>
          <button onClick={onClose}
            style={{background:"#232636",border:"1px solid #444870",color:"#9da3c4",fontFamily:"inherit",fontSize:12,padding:"6px 12px",borderRadius:7,cursor:"pointer"}}>
            ✕ Cerrar
          </button>
        </div>
        {/* preview */}
        <div style={{flex:1,overflow:"auto",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:20,background:"#0f1117"}}
          dangerouslySetInnerHTML={{__html:svgStr?`<div style="border-radius:8px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.7);max-width:100%">${svgStr}</div>`:""}}
        />
      </div>
    </div>
  );
}

function App(){
  const[data,setData]=useState(()=>loadData());
  const[selected,setSelected]=useState(null);
  const[search,setSearch]=useState("");
  const[modal,setModal]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[addForm,setAddForm]=useState({nombre:"",titular:"",tipo:"DG",tipoLabel:"",dashed:false,parentId:""});
  const[saved,setSaved]=useState(false);
  const[showA3,setShowA3]=useState(false);
  const[activeTab,setActiveTab]=useState("organigrama"); // "organigrama"|"editor"|"a3"

  // Exponer función para que el botón del editor pueda volver al organigrama
  useEffect(()=>{
    window.__switchToOrganigrama=()=>setActiveTab("organigrama");
  },[]);

  // Sync data to D3 editor when tab switches or data changes
  useEffect(()=>{
    window.__orgData=data;
    window.dispatchEvent(new CustomEvent("orgDataChanged",{detail:data}));
  },[data]);

  // Show/hide editor pane
  useEffect(()=>{
    const pane=document.getElementById("editor-pane");
    const root=document.getElementById("root");
    if(activeTab==="editor"){
      pane.classList.add("active");
      root.style.display="none";
      window.dispatchEvent(new CustomEvent("editorActivated",{detail:data}));
    } else {
      pane.classList.remove("active");
      root.style.display="";
    }
  },[activeTab]);

  // Listen for data changes from D3 editor
  useEffect(()=>{
    const handler=(e)=>{
      setData(e.detail);
      saveData(e.detail);
    };
    window.addEventListener("editorDataChanged",handler);
    return()=>window.removeEventListener("editorDataChanged",handler);
  },[]);

  useEffect(()=>{saveData(data);setSaved(true);const t=setTimeout(()=>setSaved(false),1800);return()=>clearTimeout(t);},[data]);

  const allNodes=useMemo(()=>flatList(data),[data]);
  const results=useMemo(()=>{
    if(!search.trim())return[];
    const q=search.toLowerCase();
    return allNodes.filter(n=>n.nombre.toLowerCase().includes(q)||(n.titular||"").toLowerCase().includes(q));
  },[search,allNodes]);

  const select=useCallback(node=>setSelected(s=>s?.id===node.id?null:node),[]);

  const saveEdit=()=>{
    const nd=updateNode(data,selected.id,n=>({...n,...editForm}));
    setData(nd);
    setSelected(findNode(nd,selected.id));
    setModal(null);
  };

  const saveAdd=()=>{
    if(!addForm.nombre.trim())return;
    const targetParentId = addForm.parentId || selected.id;
    const child={
      nombre:addForm.nombre,
      titular:addForm.titular,
      tipo:addForm.tipo,
      tipoLabel:addForm.tipoLabel||undefined,
      dashed:addForm.dashed,
      id:"n_"+Date.now(),
      children:[]
    };
    const nd=addChild(data,targetParentId,child);
    setData(nd);
    setSelected(findNode(nd,selected.id));
    setModal(null);
  };

  const del=()=>{
    if(!selected||selected.id==="JG")return;
    if(!confirm(`¿Eliminar "${selected.nombre}" y todas sus dependencias?`))return;
    setData(removeNode(data,selected.id));
    setSelected(null);
  };

  const reset=()=>{
    if(!confirm("¿Restablecer el organigrama al estado original? Se perderán todos los cambios."))return;
    setData(INITIAL);setSelected(null);localStorage.removeItem(STORAGE_KEY);
  };

  const dlAll=()=>{
    const subs=[data,...data.children];
    const PW=1587,PH=1123;
    const pages=subs.map((s,i)=>genPageSVG(s,i+1,subs.length));
    const combined=`<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${PH*pages.length}" viewBox="0 0 ${PW} ${PH*pages.length}">${pages.map((p,i)=>`<g transform="translate(0,${i*PH})">${p.replace(/<\/?svg[^>]*>/g,"")}</g>`).join("")}</svg>`;
    dlSVG(combined,"organigrama-gcba-A3.svg");
  };
  const dlSection=()=>{if(!selected)return;dlSVG(genPageSVG(selected,1,1),`organigrama-${selected.id.toLowerCase()}-A3.svg`);};

  const ef=k=>e=>setEditForm(f=>({...f,[k]:e.target.type==="checkbox"?e.target.checked:e.target.value}));
  const af=k=>e=>setAddForm(f=>({...f,[k]:e.target.type==="checkbox"?e.target.checked:e.target.value}));
  const selCol=selected?(getColorForNode(selected)):null;

  const today=new Date();
  const fechaApp=`${String(today.getDate()).padStart(2,"0")}/${String(today.getMonth()+1).padStart(2,"0")}/${today.getFullYear()}`;

  const openAdd=()=>{
    setAddForm({nombre:"",titular:"",tipo:"DG",tipoLabel:"",dashed:false,parentId:selected.id});
    setModal("add");
  };

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden",background:"#F2F5F9"}}>
      {showA3&&<ModalA3 data={data} allNodes={allNodes} onClose={()=>setShowA3(false)}/>}
      {modal==="edit"&&selected&&(
        <Modal title="Editar nodo" accentColor={selCol?.bg||"#005EA6"} onClose={()=>setModal(null)}>
          <NodePreview form={editForm}/>
          <Field label="Nombre" value={editForm.nombre} onChange={ef("nombre")}/>
          <Field label="Titular" value={editForm.titular} onChange={ef("titular")}/>
          <TipoSelector
            tipo={editForm.tipo}
            tipoLabel={editForm.tipoLabel||""}
            onTipoChange={v=>setEditForm(f=>({...f,tipo:v}))}
            onTipoLabelChange={v=>setEditForm(f=>({...f,tipoLabel:v}))}
          />
          <label style={{display:"flex",alignItems:"center",gap:8,marginBottom:20,cursor:"pointer"}}>
            <input type="checkbox" checked={!!editForm.dashed} onChange={ef("dashed")} style={{accentColor:"#005EA6",width:15,height:15}}/>
            <span style={{fontSize:12,color:"#4A5568"}}>Dependencia funcional (línea punteada)</span>
          </label>
          <div style={{display:"flex",gap:8}}>
            <Btn variant="primary" onClick={saveEdit} style={{flex:1,justifyContent:"center"}}>Guardar cambios</Btn>
            <Btn variant="ghost" onClick={()=>setModal(null)} style={{flex:1,justifyContent:"center"}}>Cancelar</Btn>
          </div>
        </Modal>
      )}
      {modal==="add"&&selected&&(
        <Modal title="Agregar nueva unidad" accentColor="#166534" onClose={()=>setModal(null)} wide>
          <NodePreview form={addForm}/>
          <Field label="Nombre" value={addForm.nombre} onChange={af("nombre")}/>
          <Field label="Titular" value={addForm.titular} onChange={af("titular")}/>
          <TipoSelector
            tipo={addForm.tipo}

      <header style={{background:"#003D6E",padding:"0 20px",display:"flex",alignItems:"center",gap:16,height:56,flexShrink:0,boxShadow:"0 2px 8px rgba(0,0,0,0.15)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>

            style={{width:"100%",fontSize:12,padding:"7px 10px 7px 32px",borderRadius:8,border:"1.5px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.1)",color:"#fff"}}

          <Btn variant="ghost" onClick={()=>setShowA3(true)} style={{color:"#fff",borderColor:"rgba(255,255,255,0.25)",background:"rgba(255,255,255,0.08)",fontSize:11}}>🖨 Vista A3</Btn>

                      <div style={{marginTop:10,display:"flex",gap:8,flexWrap:"wrap"}}>
                        <span style={{fontSize:11,color:"#4A5568",background:"#EDF2F7",padding:"3px 10px",borderRadius:20,fontWeight:500}}>{selected.children.length} dependencia{selected.children.length!==1?"s directas":"directa"}</span>

              </div>
              {selected.children.length>0&&(
                <>
                  <div style={{fontSize:11,fontWeight:700,color:"#718096",marginBottom:12,textTransform:"uppercase",letterSpacing:"0.07em",display:"flex",alignItems:"center",gap:8}}>
                    Dependencias directas
                    <span style={{background:"#E2E8F0",color:"#4A5568",fontSize:10,fontWeight:600,padding:"1px 8px",borderRadius:20}}>{selected.children.length}</span>

                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10}}>
                    {selected.children.map(ch=><ChildCard key={ch.id} node={ch} onClick={select}/>)}

          ):(
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",color:"#A0AEC0",textAlign:"center",gap:12}}>
              <div style={{width:64,height:64,borderRadius:16,background:"#EDF2F7",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}}>🏛️</div>
              <div>
                <div style={{fontSize:15,fontWeight:600,color:"#4A5568",marginBottom:4}}>Seleccioná un organismo</div>
                <div style={{fontSize:13,color:"#A0AEC0"}}>Hacé clic en cualquier nodo del panel izquierdo<br/>para ver sus detalles y dependencias.</div>

  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

<!-- ═══ EDITOR D3 ENGINE ═══════════════════════════════════════════ -->
<script>
(function(){
  // ═══ POSICIONES PERSISTENTES ═══════════════════════════════
  const POS_KEY='gcba_org_positions_v1';
  const STYLE_KEY='gcba_org_linestyle_v1';
  let edPositions={};
  let edCurrentRootId=null;
  let edLineStyle='orthogonal'; // orthogonal | diagonal | curved
  let edViewRootId=null; // el subárbol que se está mostrando actualmente

  function loadAllPositions(){try{return JSON.parse(localStorage.getItem(POS_KEY)||"{}");}catch{return{};}}
  function savePositionsForRoot(rootId,positions){
    const all=loadAllPositions();all[rootId]=positions;
    localStorage.setItem(POS_KEY,JSON.stringify(all));
    window.__edPositions=all;
  }
  function loadPositionsForRoot(rootId){return loadAllPositions()[rootId]||null;}
  function clearPositionsForRoot(rootId){
    const all=loadAllPositions();delete all[rootId];
    localStorage.setItem(POS_KEY,JSON.stringify(all));
    window.__edPositions=all;
  }
  function saveLineStyle(style){localStorage.setItem(STYLE_KEY,style);}
  function loadLineStyle(){return localStorage.getItem(STYLE_KEY)||'orthogonal';}
  window.__edPositions=loadAllPositions();

  const COLORS_ED={JG:"#9B1C1C",VJG:"#9B1C1C",MIN:"#92400E",SEC:"#78350F",SS:"#1E3A5F",DG:"#14532D",GG:"#065F46",GO:"#064E3B",ORG:"#374151"};
  const LABELS_ED={JG:"Jefatura",VJG:"Vicejefatura",MIN:"Ministerio",SEC:"Secretaría",SS:"Subsecretaría",DG:"Dir. General",GG:"Gerencia General",GO:"Gerencia Operativa",ORG:"Organismo desc."};
  function getColorED(n){if(n.tipo&&n.tipo.startsWith("CUSTOM:"))return"#5B21B6";return COLORS_ED[n.tipo]||"#374151";}
  function getLabelED(n){if(n.tipo&&n.tipo.startsWith("CUSTOM:"))return n.tipoLabel||n.tipo.replace("CUSTOM:","");return LABELS_ED[n.tipo]||n.tipo;}
  function flatED(n,a=[]){a.push(n);(n.children||[]).forEach(c=>flatED(c,a));return a;}
  function findED(tree,id){if(tree.id===id)return tree;for(const c of(tree.children||[])){const f=findED(c,id);if(f)return f;}return null;}
  function removeED(tree,id){return{...tree,children:(tree.children||[]).filter(c=>c.id!==id).map(c=>removeED(c,id))};}
  function updateED(tree,id,fn){if(tree.id===id)return fn(tree);return{...tree,children:(tree.children||[]).map(c=>updateED(c,id,fn))};}
  function addChildED(tree,pid,child){return updateED(tree,pid,n=>({...n,children:[...(n.children||[]),child]}));}
  function moveED(tree,nodeId,newPid){const node=findED(tree,nodeId);if(!node)return tree;return addChildED(removeED(tree,nodeId),newPid,node);}

  const NW=158,NH=50,HPAD=18,VPAD=58;
  let edData=null,edSelectedId=null,edZoom=null,edTransform=d3.zoomIdentity,edInitialized=false;

  function edDispatch(newData){
    edData=newData;
    window.dispatchEvent(new CustomEvent("editorDataChanged",{detail:JSON.parse(JSON.stringify(newData))}));
  }

  function showSavedMsg(){
    const el=document.getElementById("ed-saved-msg");
    if(!el)return;
    el.style.opacity="1";
    clearTimeout(el._t);
    el._t=setTimeout(()=>{el.style.opacity="0";},2000);
  }

  // ── Área selector ─────────────────────────────────────────
  function populateAreaSelector(){
    const sel=document.getElementById("ed-area-sel");
    if(!sel||!edData)return;
    const prev=sel.value;
    sel.innerHTML='';
    const direct=(edData.children||[]);
    const addOpt=(node,prefix)=>{
      const opt=document.createElement("option");
      opt.value=node.id;
      opt.textContent=prefix+'['+getLabelED(node)+'] '+node.nombre;
      sel.appendChild(opt);
    };
    // Ministerios y VJG primero
    direct.filter(n=>n.tipo==="MIN"||n.tipo==="VJG").forEach(n=>addOpt(n,""));
    // Secretarías directas de JG
    direct.filter(n=>n.tipo==="SEC").forEach(n=>addOpt(n,""));
    // Organismos fuera de nivel con hijos propios
    flatED(edData).filter(n=>n.dashed&&(n.children||[]).length>0).forEach(n=>addOpt(n,""));
    // Restaurar selección previa
    if(prev&&sel.querySelector(`option[value="${prev}"]`)) sel.value=prev;
    else if(sel.options.length>0) sel.value=sel.options[0].value;
  }

  // ── Sidebar ──────────────────────────────────────────────
  function buildEdSidebar(node,el,depth=0){
    const item=document.createElement("div");
    item.className="ed-ni"+(node.id===edSelectedId?" sel":"");
    item.dataset.id=node.id;
    item.style.paddingLeft=(8+depth*9)+"px";
    const color=getColorED(node);
    item.innerHTML=`<div class="ed-dot" style="background:${color}"></div><div class="ed-nm">${node.nombre||"—"}</div><div class="ed-tp">${getLabelED(node)}</div>`;
    item.addEventListener("click",()=>edSelect(node.id));
    el.appendChild(item);
    (node.children||[]).forEach(c=>buildEdSidebar(c,el,depth+1));
  }
  function refreshEdSidebar(){
    const el=document.getElementById("ed-node-list");
    if(!el||!edData)return;
    el.innerHTML="";
    // Mostrar solo el subárbol del área seleccionada
    const viewRoot=edViewRootId?findED(edData,edViewRootId):edData;
    if(viewRoot) buildEdSidebar(viewRoot,el);
  }

  // ── Link path según estilo ─────────────────────────────────
  function makeLinkPath(sx,sy,tx,ty,style){
    const midY=sy+NH+VPAD/2;
    if(style==='diagonal'){
      return`M${sx},${sy+NH}L${tx},${ty}`;
    } else if(style==='curved'){
      const cy1=sy+NH+(ty-(sy+NH))*0.4;
      const cy2=sy+NH+(ty-(sy+NH))*0.6;
      return`M${sx},${sy+NH}C${sx},${cy1} ${tx},${cy2} ${tx},${ty}`;
    } else {
      // orthogonal
      return`M${sx},${sy+NH}L${sx},${midY}L${tx},${midY}L${tx},${ty}`;
    }
  }

  // ── Waypoints (puntos intermedios editables de cada línea) ──
  const WP_KEY='gcba_org_waypoints_v1';
  let edWaypoints={}; // {`${sid}-${tid}`: [{x,y},...]}

  function loadAllWaypoints(){try{return JSON.parse(localStorage.getItem(WP_KEY)||"{}");}catch{return{};}}
  function saveWaypointsForRoot(rootId,wps){
    const all=loadAllWaypoints();all[rootId]=wps;
    localStorage.setItem(WP_KEY,JSON.stringify(all));
  }
  function loadWaypointsForRoot(rootId){return loadAllWaypoints()[rootId]||{};}
  function clearWaypointsForRoot(rootId){
    const all=loadAllWaypoints();delete all[rootId];
    localStorage.setItem(WP_KEY,JSON.stringify(all));
  }

  function wpKey(sid,tid){return sid+"-"+tid;}

  function orthogonalPath(pts){
    // pts: [{x,y}...] incluyendo origen y destino
    // conecta con líneas ortogonales (solo horizontal/vertical)
    if(pts.length<2)return"";
    let d=`M${pts[0].x},${pts[0].y}`;
    for(let i=1;i<pts.length;i++){
      const prev=pts[i-1],cur=pts[i];
      // línea ortogonal: va horizontal primero, luego vertical
      // (o vertical primero, según cuál sea el movimiento dominante)
      // Para waypoints intermedios simplemente conectamos en L
      d+=`L${cur.x},${prev.y}L${cur.x},${cur.y}`;
    }
    return d;
  }

  function buildLinkSVGPath(sid,tid){
    const sp=edPositions[sid]||{x:0,y:0};
    const tp=edPositions[tid]||{x:0,y:0};
    const sx=sp.x, sy=sp.y+NH;
    const tx=tp.x, ty=tp.y;
    const wps=edWaypoints[wpKey(sid,tid)]||[];
    if(wps.length===0){
      // Sin waypoints: ortogonal simple
      const my=sy+VPAD/2;
      return`M${sx},${sy}L${sx},${my}L${tx},${my}L${tx},${ty}`;
    }
    // Con waypoints: pasa por cada punto intermedio con codos ortogonales
    const allPts=[{x:sx,y:sy},...wps,{x:tx,y:ty}];
    let d=`M${allPts[0].x},${allPts[0].y}`;
    for(let i=1;i<allPts.length;i++){
      const p=allPts[i];
      d+=`L${allPts[i-1].x},${p.y}L${p.x},${p.y}`;
    }
    return d;
  }

  // ── Canvas ────────────────────────────────────────────────
  function renderEdCanvas(){
    if(!edData)return;
    const area=document.getElementById("ed-canvas");
    const svgEl=document.getElementById("ed-svg");
    if(!area||!svgEl)return;
    const W=area.clientWidth,H=area.clientHeight;
    const svg=d3.select(svgEl).attr("width",W).attr("height",H);
    svg.selectAll("*").remove();

    // El subárbol a mostrar
    const viewRoot=edViewRootId?findED(edData,edViewRootId):edData;
    if(!viewRoot)return;

    // Layout D3 base para el subárbol actual
    function toH(node){const kids=(node.children||[]);return{...node,_k:kids.map(toH),children:undefined};}
    const root=d3.hierarchy(toH(viewRoot),d=>d._k.length?d._k:null);
    d3.tree().nodeSize([NW+HPAD,NH+VPAD])(root);
    const d3pos={};
    root.each(n=>{d3pos[n.data.id]={x:n.x,y:n.y};});
    const allD3=Object.values(d3pos);
    const minX=Math.min(...allD3.map(p=>p.x))-NW/2;
    const minY=Math.min(...allD3.map(p=>p.y));
    Object.keys(d3pos).forEach(id=>{d3pos[id].x-=minX;d3pos[id].y-=minY;});

    // Usar posiciones guardadas (clave = viewRoot.id para que cada área tenga las suyas)
    const posKey=edViewRootId||edCurrentRootId;
    const saved=loadPositionsForRoot(posKey)||{};
    edPositions={};
    const allNodes=flatED(viewRoot);
    allNodes.forEach(n=>{
      if(saved[n.id]) edPositions[n.id]={x:saved[n.id].x,y:saved[n.id].y};
      else edPositions[n.id]={...(d3pos[n.id]||{x:0,y:0})};
    });

    // Links
    const links=[];
    function buildL(node){
      const pos=edPositions[node.id];
      if(!pos)return;
      (node.children||[]).forEach(ch=>{
        const cp=edPositions[ch.id];
        if(cp)links.push({sid:node.id,tid:ch.id,dashed:!!ch.dashed});
        buildL(ch);
      });
    }
    buildL(viewRoot);

    const g=svg.append("g").attr("class","canvas-root");
    edZoom=d3.zoom().scaleExtent([0.04,3]).on("zoom",e=>{edTransform=e.transform;g.attr("transform",e.transform);});
    svg.call(edZoom).call(edZoom.transform,edTransform);
    g.attr("transform",edTransform);

    // Load waypoints for this view
    const posKey2=edViewRootId||edCurrentRootId;
    edWaypoints=loadWaypointsForRoot(posKey2)||{};

    const linkG=g.append("g");
    const wpG=g.append("g"); // waypoint handles layer (above links, below nodes)

    function drawLinks(){
      // Draw link paths
      linkG.selectAll("path.c-link-path").data(links).join("path")
        .attr("class",d=>"c-link-path c-link"+(d.dashed?" dashed":""))
        .attr("d",d=>buildLinkSVGPath(d.sid,d.tid));

      // Draw invisible thick hit area for adding waypoints (dbl-click on link)
      linkG.selectAll("path.c-link-hit").data(links).join("path")
        .attr("class","c-link-hit")
        .attr("d",d=>buildLinkSVGPath(d.sid,d.tid))
        .attr("fill","none").attr("stroke","transparent").attr("stroke-width",12)
        .style("cursor","crosshair")
        .on("dblclick",function(e,d){
          e.stopPropagation();
          // Agregar waypoint en la posición del click
          const svgPt=svgEl.createSVGPoint();
          svgPt.x=e.clientX; svgPt.y=e.clientY;
          const p=svgPt.matrixTransform(svgEl.getScreenCTM().inverse());
          // Convertir a coordenadas del grupo (dividir por transform)
          const gp={x:(p.x-edTransform.x)/edTransform.k, y:(p.y-edTransform.y)/edTransform.k};
          const k=wpKey(d.sid,d.tid);
          if(!edWaypoints[k])edWaypoints[k]=[];
          edWaypoints[k].push({x:gp.x,y:gp.y});
          saveWaypointsForRoot(posKey2,edWaypoints);
          drawLinks(); drawWaypoints();
        });

      // Waypoint handles
      drawWaypoints();
    }

    function drawWaypoints(){
      wpG.selectAll("*").remove();
      links.forEach(lk=>{
        const wps=edWaypoints[wpKey(lk.sid,lk.tid)]||[];
        wps.forEach((wp,i)=>{
          // Handle circle
          const circle=wpG.append("circle")
            .attr("cx",wp.x).attr("cy",wp.y).attr("r",6)
            .attr("fill","#4f7ef8").attr("stroke","#fff").attr("stroke-width",1.5)
            .style("cursor","grab");

          // Drag to move waypoint
          circle.call(d3.drag()
            .on("drag",function(e){
              wp.x+=e.dx/edTransform.k;
              wp.y+=e.dy/edTransform.k;
              d3.select(this).attr("cx",wp.x).attr("cy",wp.y);
              drawLinks();
            })
            .on("end",()=>{
              saveWaypointsForRoot(posKey2,edWaypoints);
              showSavedMsg();
            })
          );

          // Right-click to delete waypoint
          circle.on("contextmenu",function(e){
            e.preventDefault();
            e.stopPropagation();
            const k=wpKey(lk.sid,lk.tid);
            edWaypoints[k].splice(i,1);
            if(edWaypoints[k].length===0)delete edWaypoints[k];
            saveWaypointsForRoot(posKey2,edWaypoints);
            drawLinks(); drawWaypoints();
          });
        });
      });
    }
    drawLinks();

    const nodeG=g.append("g");
    const ng=nodeG.selectAll("g.c-node").data(allNodes,d=>d.id).enter()
      .append("g").attr("class",d=>"c-node"+(d.id===edSelectedId?" sel":""))
      .attr("transform",d=>{const p=edPositions[d.id]||{x:0,y:0};return`translate(${p.x-NW/2},${p.y})`;})
      .style("cursor","pointer")
      .on("click",(e,d)=>{e.stopPropagation();edSelect(d.id);});

    ng.call(d3.drag()
      .on("drag",function(e,d){
        if(!edPositions[d.id])return;
        edPositions[d.id].x+=e.dx/edTransform.k;
        edPositions[d.id].y+=e.dy/edTransform.k;
        d3.select(this).attr("transform",`translate(${edPositions[d.id].x-NW/2},${edPositions[d.id].y})`);
        drawLinks();
      })
      .on("end",()=>{
        // Auto-save on drag end
        savePositionsForRoot(posKey,edPositions);
        showSavedMsg();
      })
    );

    ng.append("rect").attr("width",NW).attr("height",NH).attr("rx",7)
      .attr("fill",d=>getColorED(d))
      .attr("stroke",d=>d.dashed?"rgba(255,255,255,0.4)":"none")
      .attr("stroke-width",1.5).attr("stroke-dasharray",d=>d.dashed?"5,3":"none");

    ng.each(function(d){
      const g2=d3.select(this);
      const words=(d.nombre||"").split(" ");
      let l1="",l2="";
      for(const w of words){if((l1+" "+w).trim().length<=20)l1=(l1+" "+w).trim();else l2=(l2+" "+w).trim();}
      const hasTit=d.titular&&d.titular.trim();
      const lines=l2?[l1,l2]:[l1];
      const total=lines.length+(hasTit?1:0);
      const lh=12,sy=NH/2-(total*lh)/2+lh*0.85;
      lines.forEach((l,i)=>{
        g2.append("text").attr("x",NW/2).attr("y",sy+i*lh)
          .attr("text-anchor","middle").attr("font-size",9.5).attr("font-weight",600)
          .attr("fill","#fff").attr("font-family","Inter,sans-serif").text(l);
      });
      if(hasTit){
        const sh=d.titular.length>24?d.titular.slice(0,24)+"…":d.titular;
        g2.append("text").attr("x",NW/2).attr("y",sy+lines.length*lh+2)
          .attr("text-anchor","middle").attr("font-size",8).attr("fill","rgba(255,255,255,0.68)")
          .attr("font-family","Inter,sans-serif").text(sh);
      }
    });

    svg.on("click",()=>edSelect(null));

    // Auto-fit si no hay posiciones guardadas
    const hasSaved=Object.keys(saved).length>0;
    if(!hasSaved||!edInitialized){
      edInitialized=true;
      const allP=Object.values(edPositions);
      const mxX=Math.max(...allP.map(p=>p.x))+NW/2+30;
      const myX=Math.max(...allP.map(p=>p.y))+NH+30;
      const mnX2=Math.min(...allP.map(p=>p.x))-NW/2-30;
      const mnY2=Math.min(...allP.map(p=>p.y))-30;
      const sc=Math.min(W/(mxX-mnX2),H/(myX-mnY2),1)*0.88;
      const tx=W/2-(mnX2+(mxX-mnX2)/2)*sc;
      const ty=H/2-(mnY2+(myX-mnY2)/2)*sc;
      edTransform=d3.zoomIdentity.translate(tx,ty).scale(sc);
      svg.call(edZoom.transform,edTransform);
    }
  }

  // ── Selection & Inspector ─────────────────────────────────
  function edSelect(id){
    edSelectedId=id;
    d3.selectAll(".c-node").classed("sel",d=>d.id===id);
    document.querySelectorAll(".ed-ni").forEach(el=>el.classList.toggle("sel",el.dataset.id===id));
    const node=id?findED(edData,id):null;
    renderEdInspector(node);
    if(id){const el=document.querySelector(`.ed-ni[data-id="${id}"]`);if(el)el.scrollIntoView({block:"nearest"});}
  }

  function renderEdInspector(node){
    const body=document.getElementById("ed-ins-body");
    const actions=document.getElementById("ed-actions");
    const idEl=document.getElementById("ed-ins-id");
    if(!node){
      body.innerHTML='<div class="ed-ins-empty"><div class="ico">⬡</div><p>Seleccioná un nodo</p></div>';
      actions.style.display="none";idEl.textContent="";return;
    }
    idEl.textContent=node.id;
    actions.style.display="flex";
    const isCustom=node.tipo&&node.tipo.startsWith("CUSTOM:");
    const tipoVal=isCustom?"__custom__":node.tipo;
    const tipoLabel=isCustom?(node.tipoLabel||node.tipo.replace("CUSTOM:","")):"";
    const color=getColorED(node);
    const label=getLabelED(node);
    const tipos=Object.entries(LABELS_ED).map(([k,v])=>`<option value="${k}"${tipoVal===k?" selected":""}>${v}</option>`).join("");
    body.innerHTML=`
      <div class="ed-preview" style="background:${color}">
        <div class="ed-plabel">${label}</div>
        <div class="ed-pnombre">${node.nombre||"—"}</div>
        ${node.titular?`<div class="ed-ptitular">${node.titular}</div>`:""}
      </div>
      <div class="ed-field"><label>Nombre</label><input id="ei-nombre" value="${(node.nombre||"").replace(/"/g,"&quot;")}"/></div>
      <div class="ed-field"><label>Titular</label><input id="ei-titular" value="${(node.titular||"").replace(/"/g,"&quot;")}"/></div>
      <div class="ed-field"><label>Tipo</label>
        <select id="ei-tipo" onchange="document.getElementById('ei-cw').style.display=this.value==='__custom__'?'block':'none'">
          ${tipos}<option value="__custom__"${isCustom?" selected":""}>✏️ Personalizado…</option>
        </select>
      </div>
      <div class="ed-field" id="ei-cw" style="display:${isCustom?"block":"none"}"><label>Nombre del tipo</label><input id="ei-tlabel" value="${tipoLabel}"/></div>
      <div class="ed-field"><label style="display:flex;align-items:center;gap:7px;text-transform:none;font-size:11.5px;cursor:pointer;">
        <input type="checkbox" id="ei-dashed" ${node.dashed?"checked":""} style="width:13px;height:13px;accent-color:#4f7ef8;"/>
        Dependencia funcional (línea punteada)
      </label></div>`;
  }

  function edSave(){
    if(!edSelectedId)return;
    const nombre=document.getElementById("ei-nombre").value.trim();
    const titular=document.getElementById("ei-titular").value.trim();
    const tipoRaw=document.getElementById("ei-tipo").value;
    const tipoLabel=(document.getElementById("ei-tlabel")||{value:""}).value.trim();
    const dashed=document.getElementById("ei-dashed").checked;
    let tipo=tipoRaw==="__custom__"?"CUSTOM:"+tipoLabel:tipoRaw;
    const newData=updateED(edData,edSelectedId,n=>({...n,nombre,titular,tipo,tipoLabel:tipoLabel||undefined,dashed}));
    edData=newData;
    edDispatch(newData);
    refreshEdSidebar();
    renderEdCanvas();
    edSelect(edSelectedId);
    showSavedMsg();
  }

  function edSaveLayout(){
    const posKey=edViewRootId||edCurrentRootId;
    if(posKey&&Object.keys(edPositions).length>0){
      savePositionsForRoot(posKey,edPositions);
      showSavedMsg();
    }
  }

  function edDelete(){
    if(!edSelectedId||edSelectedId==="JG")return;
    const node=findED(edData,edSelectedId);
    if(!confirm(`¿Eliminar "${node?.nombre}" y todas sus dependencias?`))return;
    const newData=removeED(edData,edSelectedId);
    edSelectedId=null;
    edData=newData;
    edDispatch(newData);
    refreshEdSidebar();
    renderEdCanvas();
    renderEdInspector(null);
    document.getElementById("ed-actions").style.display="none";
    showSavedMsg();
  }

  function edMoveModal(){
    if(!edSelectedId||edSelectedId==="JG")return;
    const allN=flatED(edData).filter(n=>n.id!==edSelectedId);
    const opts=allN.map(n=>`<option value="${n.id}">[${getLabelED(n)}] ${n.nombre}</option>`).join("");
    const overlay=document.createElement("div");
    overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:3000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)";
    overlay.innerHTML=`<div style="background:#1a1d27;border:1px solid #333650;border-radius:12px;width:360px;overflow:hidden;">
      <div style="background:#232636;padding:12px 16px;border-bottom:1px solid #333650;font-size:13px;font-weight:600;color:#e8eaf2;">Mover a otro padre</div>
      <div style="padding:16px;">
        <div class="ed-field"><label>Nuevo padre</label><select id="mv-sel" style="width:100%;background:#232636;border:1px solid #333650;color:#e8eaf2;font-family:inherit;font-size:12px;padding:7px 9px;border-radius:6px;outline:none;">${opts}</select></div>
      </div>
      <div style="padding:10px 16px;border-top:1px solid #333650;display:flex;gap:8px;justify-content:flex-end;">
        <button id="mv-cancel" style="padding:6px 14px;border-radius:7px;background:#232636;border:1px solid #333650;color:#9da3c4;font-family:inherit;font-size:12px;cursor:pointer;">Cancelar</button>
        <button id="mv-ok" style="padding:6px 14px;border-radius:7px;background:#4f7ef8;border:none;color:#fff;font-family:inherit;font-size:12px;cursor:pointer;">Mover</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    document.getElementById("mv-cancel").onclick=()=>overlay.remove();
    document.getElementById("mv-ok").onclick=()=>{
      const newPid=document.getElementById("mv-sel").value;
      if(newPid&&newPid!==edSelectedId){
        const newData=moveED(edData,edSelectedId,newPid);
        edData=newData;edDispatch(newData);refreshEdSidebar();renderEdCanvas();
        showSavedMsg();
      }
      overlay.remove();
    };
  }

  function edResetLayout(){
    const posKey=edViewRootId||edCurrentRootId;
    if(!posKey)return;
    if(!confirm("¿Restablecer el layout automático? Se perderán las posiciones y waypoints que editaste para esta área."))return;
    clearPositionsForRoot(posKey);
    clearWaypointsForRoot(posKey);
    edInitialized=false;
    edTransform=d3.zoomIdentity;
    renderEdCanvas();
  }

  // ── Wire up controls ──────────────────────────────────────
  document.getElementById("ed-zi").onclick=()=>{if(edZoom)d3.select("#ed-svg").call(edZoom.scaleBy,1.3);};
  document.getElementById("ed-zo").onclick=()=>{if(edZoom)d3.select("#ed-svg").call(edZoom.scaleBy,0.77);};
  document.getElementById("ed-zr").onclick=()=>{edTransform=d3.zoomIdentity;edInitialized=false;renderEdCanvas();};
  document.getElementById("ed-save").onclick=()=>edSave();
  document.getElementById("ed-move").onclick=()=>edMoveModal();
  document.getElementById("ed-del").onclick=()=>edDelete();
  document.getElementById("ed-save-layout").onclick=()=>edSaveLayout();

  // Área selector: cambiar subárbol
  document.getElementById("ed-area-sel").onchange=function(){
    edViewRootId=this.value;
    edSelectedId=null;
    edInitialized=false;
    edTransform=d3.zoomIdentity;
    refreshEdSidebar();
    renderEdCanvas();
    renderEdInspector(null);
    document.getElementById("ed-actions").style.display="none";
  };

  // estilo de líneas: siempre ortogonal, se edita con waypoints

  // ── Init & sync ───────────────────────────────────────────
  window.addEventListener("editorActivated",e=>{
    edData=e.detail;
    edCurrentRootId=e.detail.id;
    edViewRootId=edViewRootId||e.detail.id;
    edLineStyle='orthogonal';
    // Restaurar área selector
    populateAreaSelector();
    const asel=document.getElementById("ed-area-sel");
    if(asel&&edViewRootId)asel.value=edViewRootId;
    // No resetear si ya hay posiciones guardadas
    const posKey=edViewRootId||edCurrentRootId;
    const saved=loadPositionsForRoot(posKey);
    if(!saved||Object.keys(saved).length===0){
      edInitialized=false;
      edTransform=d3.zoomIdentity;
    }
    refreshEdSidebar();
    renderEdCanvas();
  });

  window.addEventListener("orgDataChanged",e=>{
    edData=e.detail;
    if(!edCurrentRootId)edCurrentRootId=e.detail.id;
    if(!edViewRootId)edViewRootId=e.detail.id;
    if(document.getElementById("editor-pane").classList.contains("active")){
      populateAreaSelector();
      refreshEdSidebar();
      renderEdCanvas();
    }
  });

  window.addEventListener("resize",()=>{
    if(document.getElementById("editor-pane").classList.contains("active"))renderEdCanvas();
  });

  window.edResetLayout=edResetLayout;
})();
</script>
</body>
</html>
