/* ── Helpers ────────────────────────────────────── */
function flatList(tree,acc=[]){acc.push(tree);tree.children.forEach(c=>flatList(c,acc));return acc;}
function findNode(tree,id){if(tree.id===id)return tree;for(const c of tree.children){const f=findNode(c,id);if(f)return f;}return null;}
function updateNode(tree,id,fn){if(tree.id===id)return fn(tree);return{...tree,children:tree.children.map(c=>updateNode(c,id,fn))};}
function removeNode(tree,id){return{...tree,children:tree.children.filter(c=>c.id!==id).map(c=>removeNode(c,id))};}
function addChild(tree,pid,child){return updateNode(tree,pid,n=>({...n,children:[...n.children,child]}));}

/* ── SVG export (top-down, A3 portrait) ────────── */
const BW=180,BH=60,HGAP=16,VGAP=70;
const CF={JG:"#C0392B",VJG:"#C0392B",MIN:"#E67E22",SEC:"#F1C40F",SS:"#2C3E50",DG:"#27AE60",ORG:"#7F8C8D"};
const CT={JG:"#fff",VJG:"#fff",MIN:"#fff",SEC:"#333",SS:"#fff",DG:"#fff",ORG:"#fff"};
const fv=v=>Number(v).toFixed(1);

function mW(n){if(!n.children.length)return BW;return Math.max(BW,n.children.reduce((s,c)=>s+mW(c),0)+HGAP*(n.children.length-1));}

function buildLayout(node,mx,my,rects=[],lines=[]){
  rects.push({node,x:mx-BW/2,y:my,dashed:!!node.dashed});
  if(!node.children.length)return;
  const ws=node.children.map(c=>mW(c));
  const tot=ws.reduce((s,k)=>s+k,0)+HGAP*(node.children.length-1);
  let cx=mx-tot/2;
  const midY=my+BH+VGAP/2;
  lines.push(`<line x1="${fv(mx)}" y1="${fv(my+BH)}" x2="${fv(mx)}" y2="${fv(midY)}" stroke="#ccc" stroke-width="1.1"/>`);
  if(node.children.length>1){
    const bL=cx+ws[0]/2,bR=cx+tot-ws[ws.length-1]/2;
    lines.push(`<line x1="${fv(bL)}" y1="${fv(midY)}" x2="${fv(bR)}" y2="${fv(midY)}" stroke="#ccc" stroke-width="1.1"/>`);
  }
  node.children.forEach((ch,i)=>{
    const cmx=cx+ws[i]/2;
    const da=ch.dashed?`stroke-dasharray="6,4"`:"";
    lines.push(`<line x1="${fv(cmx)}" y1="${fv(midY)}" x2="${fv(cmx)}" y2="${fv(my+BH+VGAP)}" stroke="#ccc" stroke-width="1.1" ${da}/>`);
    buildLayout(ch,cmx,my+BH+VGAP,rects,lines);
    cx+=ws[i]+HGAP;
  });
}

function wrapTxt(t,mx){if(!t)return[];const ws=t.split(" ");const ls=[];let c="";for(const w of ws){if((c+" "+w).trim().length>mx){if(c)ls.push(c.trim());c=w;}else c=(c+" "+w).trim();}if(c)ls.push(c.trim());return ls;}

function svgBox({node,x,y,dashed}){
  const fill=CF[node.tipo]||"#7F8C8D",tc=CT[node.tipo]||"#fff";
  const nl=wrapTxt(node.nombre,21),tl=wrapTxt(node.titular||"",23);
  const lh=11,tot=nl.length+(tl.length?tl.length+0.4:0);
  let yt=y+BH/2-(tot*lh)/2+lh*0.85;
  const da=dashed?`stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-dasharray="6,4"`:"";
  let t=`<rect x="${fv(x)}" y="${fv(y)}" width="${BW}" height="${BH}" rx="7" fill="${fill}" ${da}/>`;
  nl.forEach(l=>{t+=`<text x="${fv(x+BW/2)}" y="${fv(yt)}" text-anchor="middle" font-size="9" font-weight="bold" fill="${tc}" font-family="Arial,sans-serif">${l}</text>`;yt+=lh;});
  yt+=2;tl.forEach(l=>{t+=`<text x="${fv(x+BW/2)}" y="${fv(yt)}" text-anchor="middle" font-size="8" fill="${tc}" opacity="0.85" font-family="Arial,sans-serif">${l}</text>`;yt+=lh;});
  return t;
}

function genPageSVG(root,pn,tot){
  const PW=1123,PH=1587,MAR=50,HH=80,FH=42;
  const AW=PW-MAR*2,AH=PH-HH-FH-MAR;
  const rects=[],lines=[];
  buildLayout(root,mW(root)/2,0,rects,lines);
  const minX=Math.min(...rects.map(r=>r.x));rects.forEach(r=>r.x-=minX);
  const rawW=Math.max(...rects.map(r=>r.x+BW)),rawH=Math.max(...rects.map(r=>r.y+BH));
  const scale=Math.min(AW/rawW,AH/rawH,1);
  const ox=MAR+(AW-rawW*scale)/2,oy=HH+(AH-rawH*scale)/2;
  const hc=CF[root.tipo]||"#7F8C8D",htc=CT[root.tipo]||"#fff";
  const leg=[["#C0392B","Jefatura"],["#E67E22","Ministerio"],["#F1C40F","Sec."],["#2C3E50","Subsec."],["#27AE60","Dir. Gral."],["#7F8C8D","Organismo"]];
  const lw=100,lx=(PW-(leg.length*lw+150))/2,ly=PH-30;
  let ls=leg.map((it,i)=>`<rect x="${fv(lx+i*lw)}" y="${fv(ly)}" width="10" height="10" rx="2" fill="${it[0]}"/><text x="${fv(lx+i*lw+13)}" y="${fv(ly+9)}" font-size="8" fill="#666" font-family="Arial,sans-serif">${it[1]}</text>`).join("");
  const dx=lx+leg.length*lw+6;
  ls+=`<line x1="${fv(dx)}" y1="${fv(ly+5)}" x2="${fv(dx+20)}" y2="${fv(ly+5)}" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3"/><text x="${fv(dx+23)}" y="${fv(ly+9)}" font-size="8" fill="#666" font-family="Arial,sans-serif">Dep. funcional</text>`;
  ls+=`<text x="${fv(PW-MAR)}" y="${fv(ly+9)}" text-anchor="end" font-size="8" fill="#bbb" font-family="Arial,sans-serif">${pn}/${tot}</text>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${PH}" viewBox="0 0 ${PW} ${PH}">
<rect width="${PW}" height="${PH}" fill="white"/>
<rect x="0" y="0" width="${PW}" height="${HH-6}" fill="${hc}"/>
<text x="${fv(PW/2)}" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="${htc}" font-family="Arial,sans-serif">${root.nombre}</text>
<text x="${fv(PW/2)}" y="58" text-anchor="middle" font-size="10" fill="${htc}" opacity="0.85" font-family="Arial,sans-serif">Ciudad Autónoma de Buenos Aires · Última actualización: 20/5/2026</text>
<g transform="translate(${fv(ox)},${fv(oy)}) scale(${scale.toFixed(5)})">${lines.join("")}${rects.map(r=>svgBox(r)).join("")}</g>
${ls}</svg>`;
}

function dlSVG(svgStr,fname){
  const blob=new Blob([svgStr],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

/* ── Panel izquierdo (árbol) ────────────────────── */
function PanelItem({node,onSelect,selectedId,depth=0}){
  const [open,setOpen]=useState(depth<1);
  const col=COLORS[node.tipo]||COLORS.ORG;
  const isSel=selectedId===node.id;
  return(
    <div style={{marginBottom:1}}>
      <div onClick={()=>{onSelect(node);if(node.children.length)setOpen(o=>!o);}}
        style={{display:"flex",alignItems:"center",gap:7,padding:"5px 8px",
          marginLeft:depth*14,borderRadius:7,cursor:"pointer",
          background:isSel?col.bg:"transparent",
          border:`1.5px ${node.dashed?"dashed":"solid"} ${isSel?col.bg:col.bg+"44"}`,
          marginBottom:1}}>
        <div style={{width:9,height:9,borderRadius:2,background:isSel?"#fff":col.bg,flexShrink:0}}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:depth===0?12:11,fontWeight:depth===0?700:500,
            color:isSel?"#fff":depth===0?col.bg:"#1a1a1a",
            lineHeight:1.3,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
            {node.nombre}
          </div>
          {node.titular&&<div style={{fontSize:10,color:isSel?"rgba(255,255,255,0.8)":"#666",
            whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{node.titular}</div>}
        </div>
        {node.children.length>0&&<span style={{fontSize:10,color:isSel?"#fff":col.bg,flexShrink:0}}>{open?"▾":"▸"}</span>}
      </div>
      {open&&node.children.map(ch=><PanelItem key={ch.id} node={ch} onSelect={onSelect} selectedId={selectedId} depth={depth+1}/>)}
    </div>
  );
}

/* ── Modal base ─────────────────────────────────── */
function Modal({title,children,onClose}){
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:12,padding:22,width:370,boxShadow:"0 8px 32px rgba(0,0,0,0.2)"}}>
        <div style={{fontSize:14,fontWeight:700,marginBottom:14,color:"#1a1a1a"}}>{title}</div>
        {children}
      </div>
    </div>
  );
}

function Field({label,value,onChange,type="text"}){
  return(
    <div style={{marginBottom:10}}>
      <label style={{fontSize:11,color:"#555",display:"block",marginBottom:3}}>{label}</label>
      {type==="select"
        ?<select value={value} onChange={onChange} style={{width:"100%",fontSize:12,padding:"6px 9px",borderRadius:6,border:"1px solid #ddd"}}>
          {Object.entries(COLORS).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
        </select>
        :<input value={value} onChange={onChange} style={{width:"100%",fontSize:12,padding:"6px 9px",borderRadius:6,border:"1px solid #ddd"}}/>
      }
    </div>
  );
}

function NodePreview({form}){
  const col=COLORS[form.tipo]||COLORS.ORG;
  return(
    <div style={{background:col.bg,color:col.text,borderRadius:8,padding:"8px 12px",marginBottom:14,
      border:form.dashed?"2px dashed rgba(255,255,255,0.5)":"none"}}>
      <div style={{fontSize:12,fontWeight:700}}>{form.nombre||"—"}</div>
      {form.titular&&<div style={{fontSize:11,opacity:0.85}}>{form.titular}</div>}
    </div>
  );
}

/* ── App ────────────────────────────────────────── */
function App(){
  const [data,setData]=useState(INITIAL);
  const [selected,setSelected]=useState(null);
  const [search,setSearch]=useState("");
  const [modal,setModal]=useState(null);
  const [editForm,setEditForm]=useState({});
  const [addForm,setAddForm]=useState({nombre:"",titular:"",tipo:"DG",dashed:false});

  const allNodes=useMemo(()=>flatList(data),[data]);
  const results=useMemo(()=>{
    if(!search.trim())return[];
    const q=search.toLowerCase();
    return allNodes.filter(n=>n.nombre.toLowerCase().includes(q)||(n.titular||"").toLowerCase().includes(q));
  },[search,allNodes]);

  const select=useCallback(node=>setSelected(s=>s?.id===node.id?null:node),[]);

  const openEdit=()=>{
    setEditForm({nombre:selected.nombre,titular:selected.titular||"",tipo:selected.tipo,dashed:!!selected.dashed});
    setModal("edit");
  };
  const openAdd=()=>{
    setAddForm({nombre:"",titular:"",tipo:"DG",dashed:false});
    setModal("add");
  };

  const saveEdit=()=>{
    const nd=updateNode(data,selected.id,n=>({...n,...editForm}));
    setData(nd);setSelected(findNode(nd,selected.id));setModal(null);
  };
  const saveAdd=()=>{
    if(!addForm.nombre.trim())return;
    const child={...addForm,id:"n_"+Date.now(),children:[]};
    const nd=addChild(data,selected.id,child);
    setData(nd);setSelected(findNode(nd,selected.id));setModal(null);
  };
  const del=()=>{
    if(!selected||selected.id==="JG")return;
    if(!confirm(`¿Eliminar "${selected.nombre}" y todas sus dependencias?`))return;
    setData(removeNode(data,selected.id));setSelected(null);
  };

  const dlAll=()=>{
    const subjects=[data,...data.children];
    const PH=1587,PW=1123;
    const pages=subjects.map((s,i)=>genPageSVG(s,i+1,subjects.length));
    const combined=`<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${PH*pages.length}" viewBox="0 0 ${PW} ${PH*pages.length}">
${pages.map((p,i)=>`<g transform="translate(0,${i*PH})">${p.replace(/<\/?svg[^>]*>/g,"")}</g>`).join("\n")}
</svg>`;
    dlSVG(combined,"organigrama-gcba-completo.svg");
  };

  const dlSection=()=>{
    if(!selected)return;
    dlSVG(genPageSVG(selected,1,1),`organigrama-${selected.id.toLowerCase()}.svg`);
  };

  const ef=k=>e=>setEditForm(f=>({...f,[k]:e.target.type==="checkbox"?e.target.checked:e.target.value}));
  const af=k=>e=>setAddForm(f=>({...f,[k]:e.target.type==="checkbox"?e.target.checked:e.target.value}));

  const btnStyle={fontSize:11,padding:"5px 10px",borderRadius:5,cursor:"pointer",border:"1px solid #ddd",background:"#f5f5f5"};

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden",background:"#f5f5f5"}}>

      {/* Modales */}
      {modal==="edit"&&selected&&(
        <Modal title="Editar nodo" onClose={()=>setModal(null)}>
          <NodePreview form={editForm}/>
          <Field label="Nombre" value={editForm.nombre} onChange={ef("nombre")}/>
          <Field label="Titular" value={editForm.titular} onChange={ef("titular")}/>
          <Field label="Tipo" value={editForm.tipo} onChange={ef("tipo")} type="select"/>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
            <input type="checkbox" id="ed" checked={!!editForm.dashed} onChange={ef("dashed")}/>
            <label htmlFor="ed" style={{fontSize:11,color:"#555"}}>Línea punteada (dependencia funcional)</label>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={saveEdit} style={{flex:1,fontSize:12,padding:"7px 0",background:"#2C3E50",color:"#fff",border:"none",borderRadius:6}}>Guardar</button>
            <button onClick={()=>setModal(null)} style={{flex:1,fontSize:12,padding:"7px 0",borderRadius:6}}>Cancelar</button>
          </div>
        </Modal>
      )}
      {modal==="add"&&selected&&(
        <Modal title="Agregar dependencia" onClose={()=>setModal(null)}>
          <NodePreview form={addForm}/>
          <Field label="Nombre" value={addForm.nombre} onChange={af("nombre")}/>
          <Field label="Titular" value={addForm.titular} onChange={af("titular")}/>
          <Field label="Tipo" value={addForm.tipo} onChange={af("tipo")} type="select"/>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
            <input type="checkbox" id="ad" checked={!!addForm.dashed} onChange={af("dashed")}/>
            <label htmlFor="ad" style={{fontSize:11,color:"#555"}}>Línea punteada (dependencia funcional)</label>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={saveAdd} style={{flex:1,fontSize:12,padding:"7px 0",background:"#27AE60",color:"#fff",border:"none",borderRadius:6}}>Agregar</button>
            <button onClick={()=>setModal(null)} style={{flex:1,fontSize:12,padding:"7px 0",borderRadius:6}}>Cancelar</button>
          </div>
        </Modal>
      )}

      {/* Header */}
      <div style={{padding:"8px 16px",background:"#fff",borderBottom:"1px solid #ddd",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",flexShrink:0}}>
        <div>
          <div style={{fontSize:15,fontWeight:700,color:"#1a1a1a"}}>Organigrama GCBA</div>
          <div style={{fontSize:10,color:"#888"}}>Última actualización: 20/5/2026</div>
        </div>
        <div style={{flex:1}}/>
        <input placeholder="Buscar..." value={search} onChange={e=>setSearch(e.target.value)}
          style={{fontSize:12,padding:"5px 10px",borderRadius:6,border:"1px solid #ddd",width:170}}/>
        <button onClick={dlAll} style={{...btnStyle,background:"#2C3E50",color:"#fff",border:"none"}}>🖨 Descargar completo</button>
      </div>

      {/* Body */}
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>

        {/* Árbol */}
        <div style={{width:300,flexShrink:0,overflowY:"auto",padding:"8px 6px",background:"#fff",borderRight:"1px solid #ddd"}}>
          <div style={{display:"flex",flexWrap:"wrap",gap:3,marginBottom:8}}>
            {Object.entries(COLORS).map(([k,v])=>(
              <span key={k} style={{background:v.bg,color:v.text,fontSize:9,padding:"2px 5px",borderRadius:3}}>{v.label}</span>
            ))}
          </div>
          {search.trim()
            ?<div>
              <div style={{fontSize:10,color:"#888",marginBottom:5}}>{results.length} resultados</div>
              {results.slice(0,30).map(n=>(
                <div key={n.id} onClick={()=>select(n)}
                  style={{padding:"4px 7px",borderRadius:5,cursor:"pointer",marginBottom:2,fontSize:11,
                    background:selected?.id===n.id?(COLORS[n.tipo]||COLORS.ORG).bg:"#f0f0f0",
                    color:selected?.id===n.id?(COLORS[n.tipo]||COLORS.ORG).text:"#1a1a1a"}}>
                  <div style={{fontWeight:600}}>{n.nombre}</div>
                  {n.titular&&<div style={{opacity:0.7,fontSize:10}}>{n.titular}</div>}
                </div>
              ))}
            </div>
            :<PanelItem node={data} onSelect={select} selectedId={selected?.id}/>
          }
        </div>

        {/* Detalle */}
        <div style={{flex:1,overflowY:"auto",padding:"16px 18px",background:"#f5f5f5"}}>
          {selected?(
            <>
              {/* Cabecera del nodo */}
              <div style={{background:"#fff",borderRadius:10,padding:"14px 16px",marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,0.08)"}}>
                <div style={{display:"flex",gap:10,alignItems:"flex-start",flexWrap:"wrap"}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:17,fontWeight:700,color:"#1a1a1a",lineHeight:1.2}}>{selected.nombre}</div>
                    {selected.titular&&<div style={{fontSize:13,color:"#555",marginTop:3}}>{selected.titular}</div>}
                    <div style={{display:"flex",gap:5,marginTop:8,flexWrap:"wrap"}}>
                      <span style={{background:(COLORS[selected.tipo]||COLORS.ORG).bg,color:(COLORS[selected.tipo]||COLORS.ORG).text,
                        fontSize:10,padding:"2px 8px",borderRadius:4}}>
                        {(COLORS[selected.tipo]||COLORS.ORG).label}
                      </span>
                      {selected.dashed&&<span style={{fontSize:10,color:"#888",padding:"2px 8px",border:"1px dashed #aaa",borderRadius:4}}>Dep. funcional</span>}
                      <span style={{fontSize:10,color:"#555",padding:"2px 8px",background:"#f0f0f0",borderRadius:4}}>
                        {selected.children.length} dependencia{selected.children.length!==1?"s":""}
                      </span>
                    </div>
                  </div>
                  {/* Acciones */}
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    <button onClick={openEdit} style={btnStyle}>✏️ Editar</button>
                    <button onClick={openAdd} style={btnStyle}>➕ Agregar</button>
                    {selected.id!=="JG"&&<button onClick={del} style={{...btnStyle,color:"#c0392b",borderColor:"#e99"}}>🗑 Eliminar</button>}
                    <button onClick={dlSection} style={{...btnStyle,background:"#2C3E50",color:"#fff",border:"none"}}>🖨 Descargar sección</button>
                  </div>
                </div>
              </div>

              {/* Hijos */}
              {selected.children.length>0&&(
                <>
                  <div style={{fontSize:11,fontWeight:600,color:"#888",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.05em"}}>
                    Dependencias directas
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
                    {selected.children.map(ch=>{
                      const col=COLORS[ch.tipo]||COLORS.ORG;
                      return(
                        <div key={ch.id} onClick={()=>select(ch)}
                          style={{background:col.bg,color:col.text,borderRadius:8,padding:"10px 12px",cursor:"pointer",
                            border:ch.dashed?"2px dashed rgba(255,255,255,0.45)":"2px solid transparent",
                            boxShadow:"0 1px 4px rgba(0,0,0,0.1)"}}>
                          <div style={{fontSize:11,fontWeight:700,lineHeight:1.3}}>{ch.nombre}</div>
                          {ch.titular&&<div style={{fontSize:10,opacity:0.85,marginTop:3}}>{ch.titular}</div>}
                          {ch.children.length>0&&<div style={{fontSize:9,marginTop:5,opacity:0.7}}>▾ {ch.children.length} dep.</div>}
                        </div>
                      );
                    })}
                  </div>
                </>
              )}
            </>
          ):(
            <div style={{color:"#888",fontSize:13,marginTop:30,textAlign:"center",lineHeight:1.8}}>
              ← Seleccioná un organismo del panel izquierdo<br/>para ver sus detalles y editarlo.
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
