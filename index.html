<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>Organigrama GCBA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#38485C;--azul2:#007BC7;--azul3:#0095DA;
  --gris-bg:#F3F6F9;--gris-borde:#DDE3EA;--gris-texto:#505E70;
  --texto:#38485C;--texto2:#505E70;
  /* editor */
  --ed-bg:#0f1117;--ed-surface:#1a1d27;--ed-surface2:#232636;
  --ed-border:#333650;--ed-border2:#444870;
  --ed-accent:#007BC7;--ed-text:#e8eaf2;--ed-text2:#9da3c4;--ed-text3:#6b7199;
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--gris-bg);color:var(--texto);height:100vh;overflow:hidden}

/* ── EDITOR PANE ── */
#ed-pane{position:fixed;inset:0;display:none;flex-direction:column;background:var(--ed-bg);z-index:50;}
#ed-pane.visible{display:flex;}
#ed-toolbar{height:44px;background:var(--ed-surface);border-bottom:1px solid var(--ed-border);
  display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;}
#ed-toolbar select{background:var(--ed-surface2);border:1px solid var(--ed-border2);color:var(--ed-text);
  font-family:inherit;font-size:11.5px;padding:4px 8px;border-radius:6px;outline:none;}
#ed-body{flex:1;display:flex;overflow:hidden;}
.ed-sidebar{width:230px;flex-shrink:0;background:var(--ed-surface);border-right:1px solid var(--ed-border);
  display:flex;flex-direction:column;overflow:hidden;}
.ed-sidebar-hd{padding:9px 12px;border-bottom:1px solid var(--ed-border);
  font-size:10px;font-weight:600;color:var(--ed-text3);text-transform:uppercase;letter-spacing:.06em;}
.ed-list{flex:1;overflow-y:auto;padding:4px;}
.ed-ni{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;
  cursor:pointer;border:1px solid transparent;transition:background .1s;}
.ed-ni:hover{background:var(--ed-surface2);}
.ed-ni.sel{background:rgba(79,126,248,.15);border-color:var(--ed-accent);}
.ed-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}
.ed-nm{font-size:11px;color:var(--ed-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.ed-tp{font-size:9px;color:var(--ed-text3);flex-shrink:0;}
#ed-canvas{flex:1;position:relative;overflow:hidden;}
#ed-canvas::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,var(--ed-border) 1px,transparent 1px);
  background-size:26px 26px;opacity:.3;pointer-events:none;}
#ed-canvas svg{width:100%;height:100%;}
.ed-zoom{position:absolute;bottom:14px;right:14px;display:flex;gap:3px;}
.ed-zb{width:28px;height:28px;border-radius:7px;background:var(--ed-surface);
  border:1px solid var(--ed-border);color:var(--ed-text2);font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ed-zb:hover{border-color:var(--ed-accent);color:var(--ed-accent);}
.ed-inspector{width:262px;flex-shrink:0;background:var(--ed-surface);
  border-left:1px solid var(--ed-border);display:flex;flex-direction:column;overflow:hidden;}
.ed-ins-hd{padding:9px 12px;border-bottom:1px solid var(--ed-border);
  font-size:10px;font-weight:600;color:var(--ed-text3);text-transform:uppercase;letter-spacing:.06em;
  display:flex;justify-content:space-between;align-items:center;}
.ed-ins-body{flex:1;overflow-y:auto;padding:12px;}
.ed-ins-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:6px;color:var(--ed-text3);}
.ed-ins-empty .ico{font-size:28px;opacity:.4;}
.ed-ins-empty p{font-size:11px;text-align:center;line-height:1.5;}
.ed-field{margin-bottom:11px;}
.ed-field label{font-size:10px;font-weight:600;color:var(--ed-text3);text-transform:uppercase;
  letter-spacing:.05em;display:block;margin-bottom:4px;}
.ed-field input,.ed-field select{width:100%;background:var(--ed-surface2);border:1px solid var(--ed-border);
  color:var(--ed-text);font-family:inherit;font-size:12px;padding:6px 9px;border-radius:6px;outline:none;}
.ed-field input:focus,.ed-field select:focus{border-color:var(--ed-accent);}
.ed-field select option{background:var(--ed-surface2);}
.ed-preview{border-radius:8px;padding:10px 12px;margin-bottom:12px;}
.ed-preview .ep-label{font-size:9px;font-weight:600;opacity:.65;text-transform:uppercase;letter-spacing:.05em;}
.ed-preview .ep-nombre{font-size:12px;font-weight:700;line-height:1.3;color:#fff;}
.ed-preview .ep-titular{font-size:10.5px;color:rgba(255,255,255,.75);}
.ed-actions{padding:9px 12px;border-top:1px solid var(--ed-border);display:flex;flex-direction:column;gap:5px;}
.ed-btn{padding:5px 12px;border-radius:7px;font-size:11.5px;font-weight:500;cursor:pointer;
  border:1px solid var(--ed-border);background:var(--ed-surface2);color:var(--ed-text);
  font-family:inherit;width:100%;text-align:left;}
.ed-btn:hover{border-color:var(--ed-accent);color:var(--ed-accent);}
.ed-btn.primary{background:var(--ed-accent);border-color:var(--ed-accent);color:#fff;}
.ed-btn.primary:hover{opacity:.85;}
.ed-btn.danger{border-color:#ef444455;color:#ef4444;}
.c-node rect{transition:filter .12s;}
.c-node:hover rect{filter:brightness(1.18);}
.c-node.sel rect{stroke:#fff;stroke-width:2;}
.c-link{fill:none;stroke:var(--ed-border2);stroke-width:1.1;}
.c-link.dashed-link{stroke-dasharray:5,3;stroke:var(--ed-text3);}
.ed-saved{font-size:11px;color:#22c55e;opacity:0;transition:opacity .3s;margin-right:4px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--ed-border2);border-radius:4px;}

/* ── REACT APP ── */
.app-wrap{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.app-header{background:linear-gradient(135deg,#38485C,#007BC7);padding:0 20px;height:56px;
  display:flex;align-items:center;gap:16px;flex-shrink:0;}
.app-tabs{display:flex;gap:2px;margin-left:12px;}
.app-tab{padding:5px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;
  font-family:inherit;border:1px solid transparent;transition:all .15s;
  color:rgba(255,255,255,.65);background:transparent;}
.app-tab.active{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4);}
.app-tab:hover:not(.active){color:#fff;background:rgba(255,255,255,.08);}
.app-body{flex:1;display:flex;overflow:hidden;}
.sidebar{width:300px;flex-shrink:0;background:#fff;border-right:1px solid var(--gris-borde);
  display:flex;flex-direction:column;overflow:hidden;}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
</style>
</head>
<body>

<!-- EDITOR VISUAL D3 (oculto hasta que se active) -->
<div id="ed-pane">
  <div id="ed-toolbar">
    <span style="font-size:10px;font-weight:600;color:var(--ed-text3);text-transform:uppercase;letter-spacing:.06em;">Área:</span>
    <select id="ed-area-sel" style="min-width:240px;flex:1;max-width:380px;"></select>
    <span style="font-size:10px;color:var(--ed-text3);margin-left:8px;">· clic en línea = seleccionar · clic derecho en línea = punto de quiebre · clic derecho en punto = eliminar</span>
    <span style="font-size:10px;color:var(--ed-text3);margin-left:12px;">Nodo:</span>
    <span style="font-size:10px;color:var(--ed-text3);">Texto</span>
    <input id="ed-fs" type="number" min="6" max="20" step="0.5" value="9.5"
      style="width:46px;background:var(--ed-surface2);border:1px solid var(--ed-border2);color:var(--ed-text);font-family:inherit;font-size:11px;padding:3px 6px;border-radius:5px;outline:none;"/>
    <button id="ed-btn-apply-size" style="background:var(--ed-accent);border:none;color:#fff;font-family:inherit;font-size:11px;font-weight:500;padding:4px 10px;border-radius:5px;cursor:pointer;">↺ Aplicar</button>
    <div style="margin-left:auto;display:flex;gap:6px;align-items:center;">
      <span class="ed-saved" id="ed-saved-msg">✓ Guardado</span>
      <button class="ed-zb" id="ed-btn-undo" title="Deshacer último paso (Ctrl+Z)" style="width:auto;padding:0 12px;font-size:11.5px;">↩ Deshacer</button>
      <button class="ed-zb" id="ed-btn-save" title="Guardar posiciones" style="width:auto;padding:0 12px;font-size:11.5px;">💾 Guardar</button>
      <button class="ed-zb" id="ed-btn-export" title="Exportar esta área como SVG A3" style="width:auto;padding:0 12px;font-size:11.5px;background:#166534;border-color:#166534;color:#fff;">🖨 Exportar A3</button>
      <button class="ed-zb" id="ed-btn-reset" title="Resetear layout automático" style="font-size:11px;">↺</button>
      <button class="ed-zb" id="ed-btn-back" style="width:auto;padding:0 12px;font-size:11.5px;border-color:var(--ed-accent);color:var(--ed-accent);">← Organigrama</button>
    </div>
  </div>
  <div id="ed-body">
    <div class="ed-sidebar">
      <div class="ed-sidebar-hd">Nodos del área</div>
      <div class="ed-list" id="ed-list"></div>
    </div>
    <div id="ed-canvas">
      <svg id="ed-svg"></svg>
      <div class="ed-zoom">
        <button class="ed-zb" id="ed-zi">+</button>
        <button class="ed-zb" id="ed-zr">⌂</button>
        <button class="ed-zb" id="ed-zo">−</button>
      </div>
    </div>
    <div class="ed-inspector">
      <div class="ed-ins-hd">Inspector <span id="ed-ins-id" style="font-family:monospace;font-size:9px;color:var(--ed-text3);"></span></div>
      <div class="ed-ins-body" id="ed-ins-body">
        <div class="ed-ins-empty">
          <div class="ico">⬡</div>
          <p>Clic = seleccionar<br>Shift+clic = seleccionar<br>nodo + dependientes</p>
        </div>
      </div>
      <div class="ed-actions" id="ed-actions" style="display:none;">
        <button class="ed-btn primary" id="ed-btn-node-save">✓ Guardar cambios</button>
        <button class="ed-btn" id="ed-btn-move">↕ Mover a otro padre</button>
        <button class="ed-btn danger" id="ed-btn-delete">✕ Eliminar nodo</button>
      </div>
    </div>
  </div>
</div>

<!-- REACT APP -->
<div id="root" style="height:100vh;"></div>

<!-- SPLASH SCREEN -->
<div id="splash" style="
  position:fixed;inset:0;z-index:9999;
  background:#38485C;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  transition:opacity .6s ease, visibility .6s ease;
">
  <!-- Logo GCBA -->
  <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="64" height="64" rx="14" fill="#007BC7"/>
    <path d="M18 20h28M18 32h20M18 44h24" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="48" cy="44" r="5" fill="#fff"/>
  </svg>
  <!-- Título -->
  <div style="text-align:center;">
    <div style="font-family:'Inter',-apple-system,sans-serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:.02em;">
      Organigrama GCBA
    </div>
    <div style="font-family:'Inter',-apple-system,sans-serif;font-size:13px;color:rgba(255,255,255,.6);margin-top:6px;letter-spacing:.04em;">
      Ciudad Autónoma de Buenos Aires
    </div>
  </div>
  <!-- Loader bar -->
  <div style="width:160px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;">
    <div id="splash-bar" style="height:100%;width:0%;background:#007BC7;border-radius:2px;transition:width 2.8s cubic-bezier(.4,0,.2,1);"></div>
  </div>
</div>

<script>
(function(){
  // Limpiar auth del editor al cargar
  sessionStorage.removeItem("gcba_editor_auth");
  // Arrancar la barra al cargar
  requestAnimationFrame(function(){
    var bar = document.getElementById('splash-bar');
    if(bar) bar.style.width = '100%';
  });
  // Ocultar el splash después de 3s
  setTimeout(function(){
    var splash = document.getElementById('splash');
    if(splash){
      splash.style.opacity = '0';
      splash.style.visibility = 'hidden';
    }
  }, 3000);
})();
</script>

<script>
// ── SVG A3 helpers — plain JS (no Babel) ──
// Disponibles sincrónicamente para el editor D3

// ── Colores (duplicado para uso en genSVGA3 fuera de Babel) ──
const COLORS_SVG={
  JG:{bg:"#9B1C1C"},VJG:{bg:"#9B1C1C"},MIN:{bg:"#FEA82D"},SEC:{bg:"#FCD307"},
  SS:{bg:"#004F86"},DG:{bg:"#268948"},GG:{bg:"#268948"},GO:{bg:"#268948"},ORG:{bg:"#E4E9ED"}
};
function getColorSVG(n){if(n?.tipo?.startsWith("CUSTOM:"))return"#5B21B6";return(COLORS_SVG[n?.tipo]||COLORS_SVG.ORG).bg;}


// ── SVG A3 ───────────────────────────────────────────────
const fv=v=>Number(v).toFixed(1);

function wrapTxt(t,max){
  if(!t)return[];
  const ws=t.split(" ");const ls=[];let c="";
  for(const w of ws){
    const test=c?" "+w:w;
    if(c.length+test.length>max&&c){ls.push(c);c=w;}
    else c=(c+test).trim();
  }
  if(c)ls.push(c);
  // máximo 3 líneas
  if(ls.length>3){const last=ls.splice(2).join(" ");ls[2]=last.length>max?last.slice(0,max-1)+"…":last;}
  return ls;
}

function svgBox(x,y,node,W,H,dashed,fsN,fsT){
  const fill=getColorSVG(node);
  // Calcular cuántos chars caben por línea según ancho real del nodo
  const charsPerLineN=Math.max(8,Math.floor(W/(fsN*0.52)));
  const charsPerLineT=Math.max(8,Math.floor(W/(fsT*0.52)));
  const nl=wrapTxt(node.nombre,charsPerLineN);
  const tl=wrapTxt(node.titular||"",charsPerLineT);
  const lhN=fsN*1.35,lhT=fsT*1.28,gap=tl.length?fsN*0.4:0;
  const blockH=nl.length*lhN+gap+tl.length*lhT;
  // Si el texto no entra, reducir fuente dinámicamente
  let actualFsN=fsN,actualFsT=fsT,actualLhN=lhN,actualLhT=lhT,actualGap=gap,actualBlock=blockH;
  if(blockH>H*0.88){
    const shrink=(H*0.88)/blockH;
    actualFsN=fsN*shrink;actualFsT=fsT*shrink;
    actualLhN=actualFsN*1.35;actualLhT=actualFsT*1.28;
    actualGap=tl.length?actualFsN*0.4:0;
    actualBlock=nl.length*actualLhN+actualGap+tl.length*actualLhT;
  }
  let yt=y+(H-actualBlock)/2+actualLhN*0.85;
  const da=dashed?`stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="5,3"`:"";
  // Color de texto según luminosidad del fondo
  const lightBg=["#FCD307","#E4E9ED","#FEA82D"];
  const isLight=lightBg.some(c=>fill.toUpperCase()===c.toUpperCase());
  const txtMain=isLight?"#1A202C":"#fff";
  const txtSub=isLight?"rgba(30,32,40,0.75)":"rgba(255,255,255,0.85)";
  let s=`<rect x="${fv(x)}" y="${fv(y)}" width="${fv(W)}" height="${fv(H)}" rx="${fv(Math.max(4,H*0.1))}" fill="${fill}" ${da}/>`;
  nl.forEach(l=>{s+=`<text x="${fv(x+W/2)}" y="${fv(yt)}" text-anchor="middle" font-size="${fv(actualFsN)}" font-weight="600" fill="${txtMain}" font-family="Inter,Arial,sans-serif">${l}</text>`;yt+=actualLhN;});
  yt+=actualGap;
  tl.forEach(l=>{s+=`<text x="${fv(x+W/2)}" y="${fv(yt)}" text-anchor="middle" font-size="${fv(actualFsT)}" fill="${txtSub}" font-family="Inter,Arial,sans-serif">${l}</text>`;yt+=actualLhT;});
  return s;
}

// Genera SVG A3 — el árbol siempre llena el A3 completo.
// Si hay posiciones del editor guardadas: las usa y escala al A3.
// Si no: calcula layout D3 y ajusta tamaño de nodo para llenar el A3.
function genSVGA3(root,pn=1,tot=1){
  const PW=1587,PH=1123,MAR=40,HH=68,FH=34;
  const AW=PW-MAR*2,AH=PH-HH-FH-MAR;

  const today=new Date();
  const fecha=`${String(today.getDate()).padStart(2,"0")}/${String(today.getMonth()+1).padStart(2,"0")}/${today.getFullYear()}`;

  const isJG=root.tipo==="JG";
  const savedPos=JSON.parse(localStorage.getItem("gcba_org_positions_v1")||"{}")[root.id]||null;
  const waypoints=JSON.parse(localStorage.getItem("gcba_org_waypoints_v1")||"{}")[root.id]||{};
  const _sz=JSON.parse(localStorage.getItem("gcba_org_nodesize_v1")||"{}")[root.id]||null;
  const ED_NW=_sz?.nw||158,ED_NH=_sz?.nh||50,ED_FS=_sz?.fs||0;

  
  let nodes=[],links=[],NW,NH;

  if(savedPos&&Object.keys(savedPos).length>0){
    // ── Posiciones del editor ──────────────────────────────
    // Recopilar nodos visibles (JG: 1 nivel)
    const visible=[];
    (function collect(node,depth){
      visible.push(node);
      if(isJG&&depth>=1)return;
      (node.children||[]).forEach(c=>collect(c,depth+1));
    })(root,0);
    const visIds=new Set(visible.map(n=>n.id));

    nodes=visible.map(n=>({x:savedPos[n.id]?.x??0,y:savedPos[n.id]?.y??0,w:savedPos[n.id]?.w||ED_NW,h:savedPos[n.id]?.h||ED_NH,data:n}));

    // Links
    (function walk(node,depth){
      (node.children||[]).forEach(ch=>{
        if(!visIds.has(ch.id))return;
        const s=nodes.find(n=>n.data.id===node.id),t=nodes.find(n=>n.data.id===ch.id);
        if(s&&t)links.push({s,t});
        if(!(isJG&&depth>=1))walk(ch,depth+1);
      });
    })(root,0);

    // Las posiciones ya están en coordenadas A3 (el editor usa el mismo sistema)
    NW=ED_NW; NH=ED_NH;

  }else{
    // ── Layout D3 automático ───────────────────────────────
    const HGAP=10,VGAP=24;

    // Detectar si este nodo es de "primer nivel" (JG, o cualquier nodo cuyos
    // hijos directos son MIN/VJG/SEC — ej: Jefatura de Gabinete NO es isJG
    // pero tampoco queremos desplegar toda su estructura).
    // La regla: si el nodo tiene hijos de tipo MIN/VJG/SEC, usar layout de 2 filas.
    const directHier=(root.children||[]).filter(c=>!c.dashed);
    const isShallowLayout=isJG||directHier.some(c=>c.tipo==="MIN"||c.tipo==="VJG"||c.tipo==="SEC");

    if(isShallowLayout){
      // Layout manual: fila 1 = MIN+VJG (o todos los no-SEC), fila 2 = SEC
      const row1=directHier.filter(c=>c.tipo==="MIN"||c.tipo==="VJG");
      const row2=directHier.filter(c=>c.tipo==="SEC");
      // Si no hay row1 (ej: Jefatura de Gabinete que solo tiene SECs), poner todo en row1
      const useRow1=row1.length>0?row1:directHier.filter(c=>c.tipo!=="SEC");
      const useRow2=row1.length>0?row2:row2;
      const spanX=Math.max(useRow1.length,useRow2.length,1);
      const numRows=(useRow2.length>0?3:2); // JG + fila1 + fila2
      // NW: dividir ancho disponible entre columnas
      NW=Math.max(80,Math.floor((AW-(spanX-1)*HGAP)/spanX));
      NW=Math.min(NW,280);
      // NH: usar el espacio vertical completo dividido en filas
      NH=Math.min(Math.floor((AH-(numRows-1)*VGAP)/numRows), Math.round(NW/2.6));
      NH=Math.max(NH,36);
      const HPAD=Math.max(HGAP,Math.round((AW-NW*spanX)/(spanX+1)));
      const VPAD=Math.max(VGAP,Math.round((AH-NH*numRows)/(numRows+1)));
      const makeRow=(items,rowY)=>{
        const total=items.length*(NW+HPAD)-HPAD;
        let x=(AW-total)/2+NW/2;
        return items.map(c=>{const n={x,y:rowY,data:c,depth:1};x+=NW+HPAD;return n;});
      };
      const rn={x:AW/2,y:0,data:root,depth:0};
      const mn=makeRow(useRow1,NH+VPAD);
      const sn=makeRow(useRow2,NH+VPAD+NH+VPAD);
      nodes=[rn,...mn,...sn];
      links=[...mn.map(t=>({s:rn,t})),...sn.map(t=>({s:rn,t}))];

    } else {
      // D3 tree para áreas con jerarquía profunda (SS, DG, etc.)
      function toHier(node){
        const kids=(node.children||[]).filter(c=>!c.dashed);
        return{...node,_k:kids.map(c=>toHier(c)),children:undefined};
      }
      const hier=d3.hierarchy(toHier(root),d=>d._k.length?d._k:null);

      // Contar hojas reales (no spanX de coordenadas D3)
      const leafCount=hier.leaves().length||1;
      const depthCount=(hier.height||1)+1;

      // NW basado en cantidad de hojas, NH basado en profundidad
      NW=Math.max(80,Math.floor((AW-(leafCount-1)*HGAP)/leafCount));
      NW=Math.min(NW,280);
      // NH: usar el espacio vertical completo
      NH=Math.min(Math.floor((AH-(depthCount-1)*VGAP)/depthCount), Math.round(NW/2.6));
      NH=Math.max(NH,36);

      const HPAD=Math.max(HGAP,Math.round((AW-NW*leafCount)/(leafCount+1)));
      const VPAD=Math.max(VGAP,Math.round((AH-NH*depthCount)/(depthCount+1)));

      d3.tree().nodeSize([NW+HPAD,NH+VPAD])(hier);
      nodes=hier.descendants().map(n=>({x:n.x,y:n.y,data:n.data,depth:n.depth}));
      links=hier.links().map(l=>({
        s:nodes.find(n=>n.data.id===l.source.data.id),
        t:nodes.find(n=>n.data.id===l.target.data.id)
      })).filter(l=>l.s&&l.t);

      // Normalizar a (0,0)
      const mnX=d3.min(nodes,n=>n.x)-NW/2,mnY=d3.min(nodes,n=>n.y);
      nodes.forEach(n=>{n.x-=mnX;n.y-=mnY;});

      // Escalar para llenar el A3 ajustando NW y NH proporcionalmente
      const tW=d3.max(nodes,n=>n.x+NW/2),tH=d3.max(nodes,n=>n.y+NH);
      const scX=AW/tW,scY=AH/tH;
      const sc=Math.min(scX,scY)*0.96;
      nodes.forEach(n=>{n.x*=sc;n.y*=sc;});
      NW*=sc;NH*=sc;
    }
  }

  // Posiciones ya en coordenadas A3 — offset es 0
  const ox=0,oy=0;

  // Tamaños de fuente proporcionales al nodo
  const fsN=ED_FS>0?ED_FS:Math.max(7,Math.min(13,NW/11));
  const fsT=ED_FS>0?ED_FS*0.82:Math.max(6,Math.min(10.5,NW/15));
  const sw=Math.max(0.6,NW/220);

  // Líneas
  function lPath(s,t,wps){
    const sh=s.h||NH,th=t.h||NH;
    const sx=s.x,sy=s.y+sh,tx=t.x,ty=t.y;
    if(wps?.length){
      const scWP=NW/158;
      const pts=[{x:sx,y:sy},...wps.map(p=>({x:p.x*scWP,y:p.y*scWP})),{x:tx,y:ty}];
      let d=`M${fv(pts[0].x)},${fv(pts[0].y)}`;
      for(let i=1;i<pts.length;i++){d+=`L${fv(pts[i].x)},${fv(pts[i-1].y)}L${fv(pts[i].x)},${fv(pts[i].y)}`;}
      return`<path d="${d}" fill="none" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`;
    }
    const my=sy+(ty-sy)/2;
    return`<line x1="${fv(sx)}" y1="${fv(sy)}" x2="${fv(sx)}" y2="${fv(my)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>` +
           `<line x1="${fv(sx)}" y1="${fv(my)}" x2="${fv(tx)}" y2="${fv(my)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>` +
           `<line x1="${fv(tx)}" y1="${fv(my)}" x2="${fv(tx)}" y2="${fv(ty)}" stroke="#CBD5E0" stroke-width="${fv(sw)}"/>`;
  }

  let linesSVG="",nodesSVG="";
  links.forEach(lk=>{
    if(!lk.s||!lk.t)return;
    const wps=waypoints[`${lk.s.data?.id}-${lk.t.data?.id}`]||[];
    linesSVG+=lPath(lk.s,lk.t,wps);
  });
  nodes.forEach(n=>{
    const nw=n.w||NW,nh=n.h||NH;
    const fsNn=ED_FS>0?ED_FS:Math.max(7,Math.min(13,nw/11));
    const fsTn=ED_FS>0?ED_FS*0.82:Math.max(6,Math.min(10.5,nw/15));
    nodesSVG+=svgBox(n.x-nw/2,n.y,n.data,nw,nh,!!n.data?.dashed,fsNn,fsTn);
  });

  // (organismos fuera de nivel no se muestran en el A3 — tienen su propia página)

  const leg=[["#9B1C1C","Jefatura"],["#FEA82D","Ministerio"],["#FCD307","Secretaría"],
             ["#004F86","Subsecretaría"],["#268948","Dir. General"],["#E4E9ED","Org. desc."]];
  const lw=118,lx=(PW-leg.length*lw)/2,ly=PH-FH+11;
  const legSVG=leg.map((it,i)=>
    `<rect x="${fv(lx+i*lw)}" y="${fv(ly)}" width="9" height="9" rx="2" fill="${it[0]}"/>` +
    `<text x="${fv(lx+i*lw+13)}" y="${fv(ly+8)}" font-size="8" fill="#718096" font-family="Inter,Arial,sans-serif">${it[1]}</text>`
  ).join("");
  const pgSVG=tot>1?`<text x="${fv(PW-MAR)}" y="${fv(ly+8)}" text-anchor="end" font-size="8" fill="#A0AEC0">${pn}/${tot}</text>`:"";
  const hc=getColorSVG(root);

  return`<svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${PH}" viewBox="0 0 ${PW} ${PH}">
<defs><linearGradient id="hg${pn}" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="${hc}"/><stop offset="100%" stop-color="${hc}CC"/>
</linearGradient></defs>
<rect width="${PW}" height="${PH}" fill="#F8FAFC"/>
<rect x="0" y="0" width="${PW}" height="${HH}" fill="url(#hg${pn})"/>
<line x1="0" y1="${HH}" x2="${PW}" y2="${HH}" stroke="#E2E8F0" stroke-width="1"/>
<text x="${fv(PW/2)}" y="${fv(HH*0.45)}" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="Inter,Arial,sans-serif">${root.nombre}</text>
<text x="${fv(PW/2)}" y="${fv(HH*0.78)}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)" font-family="Inter,Arial,sans-serif">Ciudad Autónoma de Buenos Aires · ${fecha}</text>
<g transform="translate(${fv(ox)},${fv(oy)})">${linesSVG}${nodesSVG}</g>
<rect x="0" y="${PH-FH}" width="${PW}" height="${FH}" fill="#F8FAFC"/>
<line x1="0" y1="${PH-FH}" x2="${PW}" y2="${PH-FH}" stroke="#E2E8F0" stroke-width="0.8"/>
${legSVG}${pgSVG}
</svg>`;
}

function dlSVG(svgStr,fname){
  const blob=new Blob([svgStr],{type:"image/svg+xml"});
  const url=URL.createObjectURL(blob);
  Object.assign(document.createElement("a"),{href:url,download:fname}).click();
  URL.revokeObjectURL(url);
}

const STORAGE_KEY="gcba_org_v2";
const APP_VERSION="20260523"; // Cambia con cada nueva versión del archivo
const VERSION_KEY="gcba_org_version";
function loadData(){
  try{
    const savedVersion=localStorage.getItem(VERSION_KEY);
    if(savedVersion!==APP_VERSION){
      // Versión nueva del archivo — limpiar caché y arrancar fresco
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem("gcba_org_positions_v1");
      localStorage.removeItem("gcba_org_waypoints_v1");
      localStorage.setItem(VERSION_KEY,APP_VERSION);
      return INITIAL;
    }
    const s=localStorage.getItem(STORAGE_KEY);
    return s?JSON.parse(s):INITIAL;
  }catch{return INITIAL;}
}

// ── Utilidades de árbol ──────────────────────────────────
function flatList(t,a=[]){a.push(t);(t.children||[]).forEach(c=>flatList(c,a));return a;}
function findNode(t,id){if(!t)return null;if(t.id===id)return t;for(const c of(t.children||[])){const f=findNode(c,id);if(f)return f;}return null;}
function updateNode(t,id,fn){if(t.id===id)return fn(t);return{...t,children:(t.children||[]).map(c=>updateNode(c,id,fn))};}
function removeNode(t,id){return{...t,children:(t.children||[]).filter(c=>c.id!==id).map(c=>removeNode(c,id))};}
function addChild(t,pid,child){return updateNode(t,pid,n=>({...n,children:[...(n.children||[]),child]}));}
function moveNode(t,nodeId,newPid){const n=findNode(t,nodeId);if(!n)return t;return addChild(removeNode(t,nodeId),newPid,n);}

  GG:{bg:"#268948",label:"Gerencia General"},GO:{bg:"#268948",label:"Gerencia Operativa"},

};

function DragCanvas({children}){
  const canvasRef=React.useRef(null);
  const drag=React.useRef({active:false,startX:0,startY:0,scrollX:0,scrollY:0});
  const onDown=e=>{
    if(e.button!==0)return;
    const el=canvasRef.current;
    drag.current={active:true,startX:e.clientX,startY:e.clientY,scrollX:el.scrollLeft,scrollY:el.scrollTop};
    el.style.cursor="grabbing";el.style.userSelect="none";
  };
  const onMove=e=>{
    const d=drag.current;if(!d.active)return;
    const el=canvasRef.current;
    el.scrollLeft=d.scrollX-(e.clientX-d.startX);
    el.scrollTop=d.scrollY-(e.clientY-d.startY);
  };
  const onUp=()=>{
    drag.current.active=false;
    const el=canvasRef.current;
    if(el){el.style.cursor="grab";el.style.userSelect="";}
  };
  return(
    <div ref={canvasRef}
      onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
      style={{flex:1,overflow:"auto",padding:"24px 32px",background:"#F3F6F9",minWidth:0,cursor:"grab"}}>
      <div style={{display:"inline-block",minWidth:"100%"}}>{children}</div>
    </div>
  );
}

// ── Vista completa — árbol visual con nodos conectados ─────────
function OrgChart({data,search,selectedId}){
  const[expanded,setExpanded]=React.useState(()=>{
    const s=new Set();
    // Expand JG and all direct children
    s.add(data.id);
    (data.children||[]).forEach(c=>{
      s.add(c.id);
      // Also expand grandchildren that are MIN/SEC types (ministerios/secretarías)
      (c.children||[]).forEach(gc=>{ if(gc.tipo==="MIN"||gc.tipo==="SEC"||gc.tipo==="ORG")s.add(gc.id); });
    });
    return s;
  });

  // Expandir camino al nodo seleccionado cuando cambia selectedId
  React.useEffect(()=>{
    if(!selectedId)return;
    // Find path from root to selectedId
    function findPath(node,targetId,path){
      if(node.id===targetId)return [...path,node.id];
      for(const c of node.children||[]){
        const r=findPath(c,targetId,[...path,node.id]);
        if(r)return r;
      }
      return null;
    }
    const path=findPath(data,selectedId,[]);
    if(path)setExpanded(prev=>{const s=new Set(prev);path.forEach(id=>s.add(id));return s;});
  },[selectedId,data]);

  // IDs que coinciden con búsqueda (y sus ancestros)
  const matchIds=React.useMemo(()=>{
    if(!search.trim())return null;
    const q=search.toLowerCase();
    const hits=new Set();
    function mark(node,path){
      const p=[...path,node.id];
      const ok=(node.nombre||"").toLowerCase().includes(q)||(node.titular||"").toLowerCase().includes(q);
      const childOk=(node.children||[]).some(c=>mark(c,p));
      if(ok||childOk)p.forEach(id=>hits.add(id));
      return ok||childOk;
    }
    mark(data,[]);return hits;
  },[data,search]);

  const toggle=id=>setExpanded(prev=>{const s=new Set(prev);s.has(id)?s.delete(id):s.add(id);return s;});
  const expandAll=()=>{const s=new Set();(function a(n){s.add(n.id);(n.children||[]).forEach(a);})(data);setExpanded(s);};
  const collapseAll=()=>setExpanded(new Set([data.id]));

  // Render a single node box
  function NodeBox({node}){
    const color=getColor(node);
    const label=getLabel(node);
    const kids=(node.children||[]).filter(c=>matchIds?matchIds.has(c.id):true);
    const hasKids=kids.length>0;
    const isExp=expanded.has(node.id);
    const dim=matchIds&&!matchIds.has(node.id);
    const LIGHT_BG=["#FCD307","#E4E9ED","#FEA82D"];
    const isLightBg=LIGHT_BG.some(c=>color.toUpperCase()===c.toUpperCase());
    const txtMain=isLightBg?"#1A202C":"#fff";
    const txtAbbr=isLightBg?"rgba(30,32,40,0.5)":"rgba(255,255,255,0.65)";
    const txtSub2=isLightBg?"rgba(30,32,40,0.7)":"rgba(255,255,255,0.8)";
    const dashedBorder=node.dashed?(isLightBg?"2px dashed rgba(0,0,0,0.3)":"2px dashed rgba(255,255,255,0.5)"):"2px solid transparent";
    return(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",flexShrink:0,opacity:dim?.25:1,transition:"opacity .2s"}}>
        {/* Node card */}
        <div style={{background:color,borderRadius:10,padding:"10px 12px",minWidth:130,maxWidth:160,
          textAlign:"center",boxShadow:"0 2px 8px rgba(0,0,0,.18)",position:"relative",
          border:dashedBorder}}>
          <div style={{fontSize:11.5,fontWeight:700,color:txtMain,lineHeight:1.3,marginBottom:node.titular?4:0}}>
            {node.nombre.length>45?node.nombre.slice(0,43)+"…":node.nombre}
          </div>
          {node.titular&&<div style={{fontSize:10,color:txtSub2,lineHeight:1.2}}>
            {node.titular.length>35?node.titular.slice(0,33)+"…":node.titular}
          </div>}
        </div>
        {/* Toggle button */}
        {hasKids&&(
          <button onClick={()=>toggle(node.id)} style={{
            width:22,height:22,borderRadius:"50%",border:"2px solid #fff",
            background:isExp?"#718096":"#fff",color:isExp?"#fff":"#718096",
            fontSize:14,lineHeight:"18px",cursor:"pointer",marginTop:2,
            boxShadow:"0 1px 4px rgba(0,0,0,.2)",fontWeight:700,display:"flex",
            alignItems:"center",justifyContent:"center",flexShrink:0,zIndex:1}}>
            {isExp?"−":"+"}
          </button>
        )}
        {/* Connector line down */}
        {hasKids&&isExp&&<div style={{width:2,height:20,background:"#CBD5E0",flexShrink:0}}/>}
        {/* Children */}
        {hasKids&&isExp&&<ChildRow nodes={kids}/>}
      </div>
    );
  }

  function ChildRow({nodes}){
    if(!nodes.length)return null;
    const regular=nodes.filter(n=>!n.dashed);
    const dashed=nodes.filter(n=>n.dashed);
    return(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:0}}>
        {/* Hijos regulares en fila horizontal */}
        {regular.length>0&&(
          <div style={{position:"relative",display:"flex",gap:16,alignItems:"flex-start"}}>
            {regular.length>1&&(
              <div style={{position:"absolute",top:0,left:80,right:80,height:2,background:"#CBD5E0"}}/>
            )}
            {regular.map(n=>(
              <div key={n.id} style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                <div style={{width:2,height:20,background:"#CBD5E0"}}/>
                <NodeBox node={n}/>
              </div>
            ))}
          </div>
        )}
        {/* Nodos fuera de nivel (dashed) en fila separada debajo */}
        {dashed.length>0&&(
          <div style={{marginTop:regular.length>0?24:0,display:"flex",flexDirection:"column",alignItems:"center",width:"100%"}}>
            <div style={{fontSize:9,fontWeight:600,color:"#9AABB8",textTransform:"uppercase",letterSpacing:".08em",marginBottom:8,marginTop:regular.length>0?0:4}}>
              Organismos fuera de nivel
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:12,justifyContent:"center"}}>
              {dashed.map(n=>(
                <div key={n.id} style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                  <NodeBox node={n}/>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
      {/* Toolbar */}
      <div style={{padding:"8px 14px",borderBottom:"1px solid #E2E8F0",background:"#F3F6F9",
        display:"flex",gap:8,alignItems:"center",flexShrink:0,flexWrap:"wrap"}}>
        {Object.entries(COLORS).map(([k,v])=>(
          <span key={k} style={{background:v.bg,color:"#fff",fontSize:10,fontWeight:600,
            padding:"3px 8px",borderRadius:5,letterSpacing:".03em"}}>{v.label}</span>
        ))}
        <button onClick={expandAll} style={{marginLeft:"auto",fontSize:11,padding:"4px 12px",
          borderRadius:6,border:"1px solid #CBD5E0",background:"#fff",cursor:"pointer",color:"#4A5568"}}>
          Expandir todo
        </button>
        <button onClick={collapseAll} style={{fontSize:11,padding:"4px 12px",
          borderRadius:6,border:"1px solid #CBD5E0",background:"#fff",cursor:"pointer",color:"#4A5568"}}>
          Colapsar
        </button>
      </div>
      {/* Canvas — drag to scroll */}
      <DragCanvas><NodeBox node={data}/></DragCanvas>
    </div>
  );
}

  // Ministerio de Hacienda y Finanzas
  {id:"BCOCIUDAD", nombre:"Banco Ciudad de Buenos Aires",                      titular:"Guillermo Laje",              area:"Min. Hacienda y Finanzas"},
  {id:"LOTBA",     nombre:"Lotería de la Ciudad de Buenos Aires S.E.",          titular:"Jesús Mariano Acevedo",       area:"Min. Hacienda y Finanzas"},
  {id:"OSBA",      nombre:"Obra Social de la Ciudad de Buenos Aires",           titular:"Alejandro Amor",              area:"Min. Hacienda y Finanzas"},
  // Ministerio de Movilidad e Infraestructura
  {id:"AUSA",      nombre:"AUSA - Autopistas Urbanas S.A.",                     titular:"Juan Pablo Fasanella",        area:"Min. Movilidad e Infraestructura"},
  {id:"SBASE",     nombre:"Subterráneos de Buenos Aires S.E.",                  titular:"Javier Ignacio Ibañez",       area:"Min. Movilidad e Infraestructura"},
  // Sin dependencia ministerial definida
  {id:"emp_mc",    nombre:"Corporación Mercado Central de Buenos Aires",        titular:"",                            area:""},
  {id:"emp_pm",    nombre:"Corporación Antiguo Puerto Madero S.A.",             titular:"",                            area:""},
  {id:"emp_ceam",  nombre:"CEAMSE",                                             titular:"",                            area:""},
  {id:"emp_fac",   nombre:"FACOEP S.E.",                                        titular:"",                            area:""},
  {id:"emp_cbs",   nombre:"Corporación Buenos Aires Sur S.E.",                  titular:"Karina Andrea Burijson",      area:""},
];

function App(){
  const[data,setData]=useState(()=>loadData());
  const[selected,setSelected]=useState(null);
  const[search,setSearch]=useState("");
  const[modal,setModal]=useState(null); // null | "edit" | "add" | "move"
  const[editForm,setEditForm]=useState({});
  const[addForm,setAddForm]=useState({nombre:"",titular:"",tipo:"DG",tipoLabel:"",dashed:false,parentId:""});
  const[activeTab,setActiveTab]=useState("organigrama");

  const allNodes=useMemo(()=>flatList(data),[data]);

  // Sincronizar datos con el editor D3
  useEffect(()=>{
    window.__orgData=data;
    window.dispatchEvent(new CustomEvent("orgDataChanged",{detail:data}));
  },[data]);

  // Escuchar cambios del editor D3
  useEffect(()=>{
    const h=e=>{setData(e.detail);saveData(e.detail);};
    window.addEventListener("editorDataChanged",h);
    return()=>window.removeEventListener("editorDataChanged",h);
  },[]);

  // Exponer función para volver desde el editor
  useEffect(()=>{window.__goToOrganigrama=()=>setActiveTab("organigrama");},[]);

  // Mostrar/ocultar editor
  useEffect(()=>{
    const pane=document.getElementById("ed-pane");
    const rootEl=document.getElementById("root");
    if(activeTab==="editor"){
      pane.classList.add("visible");
      rootEl.style.display="none";
      // Pequeño delay para que el canvas tenga dimensiones reales
      setTimeout(()=>{
        window.dispatchEvent(new CustomEvent("editorActivated",{detail:data}));
      },50);
    }else{
      pane.classList.remove("visible");
      rootEl.style.display="";
    }
  },[activeTab]); // solo reaccionar a cambio de pestaña, no a cambio de datos

  const filtered=useMemo(()=>{
    if(!search.trim())return null;
    const q=search.toLowerCase();
    return allNodes.filter(n=>(n.nombre||"").toLowerCase().includes(q)||(n.titular||"").toLowerCase().includes(q));
  },[allNodes,search]);

  const fechaApp=useMemo(()=>{
    const d=new Date();
    return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
  },[]);

  function openEdit(node){
    setEditForm({nombre:node.nombre,titular:node.titular||"",tipo:node.tipo,tipoLabel:node.tipoLabel||"",dashed:!!node.dashed,parentId:findNode(data,node.id)?.id});
    setModal("edit");
  }
  function saveEdit(){
    const{nombre,titular,tipo,tipoLabel,dashed}=editForm;
    if(tipo.startsWith("CUSTOM:")&&tipoLabel)saveCustomTipo(tipoLabel);
    setData(d=>{const nd=updateNode(d,selected.id,n=>({...n,nombre,titular,tipo,tipoLabel:tipoLabel||undefined,dashed}));saveData(nd);return nd;});
    setSelected(s=>({...s,nombre,titular,tipo,tipoLabel,dashed}));
    setModal(null);
  }
  function saveAdd(){
    const{nombre,titular,tipo,tipoLabel,dashed,parentId}=addForm;
    if(!nombre.trim()||!parentId)return;
    if(tipo.startsWith("CUSTOM:")&&tipoLabel)saveCustomTipo(tipoLabel);
    const child={id:"n_"+Date.now(),nombre,titular,tipo,tipoLabel:tipoLabel||undefined,dashed,children:[]};
    setData(d=>{const nd=addChild(d,parentId,child);saveData(nd);return nd;});
    setModal(null);
  }
  function del(){
    if(!selected||selected.id==="JG")return;
    if(!confirm(`¿Eliminar "${selected.nombre}" y todas sus dependencias?`))return;
    setData(d=>{const nd=removeNode(d,selected.id);saveData(nd);return nd;});
    setSelected(null);setModal(null);
  }
  function openMove(){
    setEditForm(f=>({...f,newParentId:""}));
    setModal("move");
  }
  function saveMove(){
    const np=editForm.newParentId;
    if(!np||!selected)return;
    setData(d=>{const nd=moveNode(d,selected.id,np);saveData(nd);return nd;});
    setModal(null);
  }
  function reset(){
    if(!confirm("¿Restablecer todos los datos al original?"))return;
    localStorage.removeItem("gcba_org_v2");
    localStorage.removeItem("gcba_org_positions_v1");
    localStorage.removeItem("gcba_org_waypoints_v1");
    window._gcbaEditorAuth=false;setData(INITIAL);setSelected(null);
  }

  // Exportar todo A3
  function dlAll(){
    // Orden fijo según el PDF original (ORGANIGRAMA_GCBA_2026)
    const PDF_IDS=["JG","VJG","MJGGC","MHFGC","MJGC","MSEGC","MSGC","MEDGC","MDECGC","MCGC","MDHYHGC","MEPHUGC","MMIGC","SECGE","SECLYT","SECCO","SECAE","SECGVC","SECME"];
    const allNodes=flatList(data);
    const areas=PDF_IDS.map(id=>allNodes.find(n=>n.id===id)).filter(Boolean);
    const PH=1123;
    const pages=areas.map((a,i)=>genSVGA3(a,i+1,areas.length));
    const combined=`<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1587" height="${PH*pages.length}" viewBox="0 0 1587 ${PH*pages.length}">${pages.map((p,i)=>`<g transform="translate(0,${i*PH})">${p.replace(/<\/?svg[^>]*>/g,"")}</g>`).join("")}</svg>`;
    dlSVG(combined,"organigrama-gcba-completo-A3.svg");
  }

  const color=selected?getColor(selected):"#003D6E";

  return(
    <div className="app-wrap">
      {/* Header */}
      <div className="app-header">
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,borderRadius:8,background:"#007BC7",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" fill="#003D6E"/>
              <polyline points="9 22 9 12 15 12 15 22" fill="#F5C400" stroke="#003D6E" strokeWidth="0.5"/>
            </svg>
          </div>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:"#fff",lineHeight:1.2}}>Organigrama GCBA</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,.6)"}}>Ciudad Autónoma de Buenos Aires</div>
          </div>
        </div>
        <div className="app-tabs">
          {[["organigrama","📋 Organigrama"],["arbol","🌐 Árbol"],["editor","✏️ Editor visual"]].map(([id,label])=>(
            <button key={id} className={`app-tab${activeTab===id?" active":""}`}
              onClick={()=>{
                if(id==="editor"){
                  // Verificar autenticación
                  if(window._gcbaEditorAuth===true){setActiveTab(id);return;}
                  const pwd=prompt("🔒 Acceso al Editor Visual\nIngresá la contraseña de administrador:");
                  if(!pwd){return;}
                  // SHA-256 async
                  crypto.subtle.digest("SHA-256",new TextEncoder().encode(pwd))
                    .then(buf=>{
                      const hash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
                      if(hash==="03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4"){
                        window._gcbaEditorAuth=true;
                        setActiveTab(id);
                      } else {
                        alert("Contraseña incorrecta.");
                      }
                    });
                } else {
                  setActiveTab(id);
                }
              }}>{label}</button>
          ))}
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
          <Btn variant="ghost" onClick={dlAll} small>⬇ Descargar todo A3</Btn>
          <Btn variant="ghost" onClick={reset} small>↺ Restablecer</Btn>
        </div>
      </div>

      {/* Body */}
      <div className="app-body">
        {/* Vista completa */}
        {activeTab==="arbol"&&(
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <OrgChart data={data} search={search} selectedId={selected?.id}/>
          </div>
        )}
        {/* Sidebar — solo en pestaña organigrama */}
        {activeTab!=="arbol"&&<>
        <div className="sidebar">
          <div style={{padding:"12px 14px",borderBottom:"1px solid #E2E8F0",background:"#F3F6F9"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#9AABB8",textTransform:"uppercase",letterSpacing:".07em",marginBottom:8}}>Organismos</div>
            <div style={{position:"relative"}}>
              <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",fontSize:12,pointerEvents:"none",opacity:.5}}>🔍</span>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar organismo o titular…"
                style={{width:"100%",border:"1px solid #CBD5E0",borderRadius:8,padding:"7px 10px 7px 28px",fontSize:11.5,fontFamily:"inherit",outline:"none",background:"#fff"}}/>
              {search&&<button onClick={()=>setSearch("")} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:14,color:"#A0AEC0",lineHeight:1}}>×</button>}
            </div>
          </div>
          <div style={{flex:1,overflow:"auto"}}>
            {filtered
              ?filtered.map(n=><PanelItem key={n.id} node={n} onSelect={setSelected} selectedId={selected?.id} depth={0}/>)
              :<PanelItem node={data} onSelect={setSelected} selectedId={selected?.id}/>
            }
          </div>
          <div style={{padding:"10px 12px",borderTop:"1px solid #E2E8F0",background:"#F3F6F9"}}>
            <Btn variant="primary" onClick={()=>{setAddForm({nombre:"",titular:"",tipo:"DG",tipoLabel:"",dashed:false,parentId:selected?.id||"JG"});setModal("add");}} style={{width:"100%",justifyContent:"center"}}>
              + Nueva unidad
            </Btn>
          </div>
        </div>

        {/* Main */}
        <div className="main-area">
          {selected?(
            <div style={{flex:1,overflow:"auto",padding:24}}>
              {/* Header del nodo */}
              <div style={{borderRadius:12,marginBottom:20,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,.1)"}}>
                {/* Color bar top */}
                <div style={{background:color,padding:"16px 20px 14px"}}>
                  <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
                    {/* Iniciales / avatar */}
                    <div style={{width:42,height:42,borderRadius:10,background:"rgba(255,255,255,.2)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:15,fontWeight:700,color:"#fff"}}>
                      {selected.nombre.split(" ").filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join("")}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                        <span style={{fontSize:9,fontWeight:700,background:"rgba(255,255,255,.2)",padding:"2px 7px",borderRadius:20,color:"rgba(255,255,255,.9)",letterSpacing:".05em",textTransform:"uppercase"}}>
                          {getLabel(selected)}{selected.dashed?" · Func.":""}
                        </span>
                      </div>
                      <div style={{fontSize:17,fontWeight:700,color:"#fff",lineHeight:1.25,wordBreak:"break-word"}}>{selected.nombre}</div>
                    </div>
                  </div>
                </div>
                {/* Titular + acciones — fondo blanco */}
                <div style={{background:"#fff",padding:"12px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap",borderTop:"1px solid rgba(0,0,0,.06)"}}>
                  <div>
                    {selected.titular
                      ? <div style={{display:"flex",alignItems:"center",gap:6}}>
                          <div style={{width:6,height:6,borderRadius:"50%",background:color,flexShrink:0}}/>
                          <span style={{fontSize:12,color:"#38485C",fontWeight:500}}>{selected.titular}</span>
                        </div>
                      : <span style={{fontSize:11,color:"#A0AEC0",fontStyle:"italic"}}>Sin titular asignado</span>
                    }
                  </div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    <Btn variant="secondary" small onClick={()=>openEdit(selected)}>✏️ Editar</Btn>
                    {selected.id!=="JG"&&<>
                      <Btn variant="secondary" small onClick={openMove}>↕ Mover</Btn>
                      <Btn variant="danger" small onClick={del}>✕ Eliminar</Btn>
                    </>}
                    <Btn variant="secondary" small onClick={()=>{dlSVG(genSVGA3(selected,1,1),`organigrama-${selected.id}-A3.svg`);}}>🖨 A3</Btn>
                  </div>
                </div>
              </div>
              {/* Dependencias */}
              {(selected.children||[]).length>0&&(
                <div>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{width:3,height:16,borderRadius:2,background:color}}/>
                      <span style={{fontSize:11,fontWeight:700,color:"#38485C",textTransform:"uppercase",letterSpacing:".06em"}}>
                        Dependencias
                      </span>
                      <span style={{fontSize:10,background:"#EBF4FF",color:"#007BC7",fontWeight:700,padding:"1px 7px",borderRadius:20}}>
                        {(selected.children||[]).length}
                      </span>
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
                    {(selected.children||[]).map(ch=>(
                      <div key={ch.id} onClick={()=>setSelected(ch)}
                        style={{borderRadius:9,background:"#fff",border:"1px solid #E8EDF2",
                          cursor:"pointer",overflow:"hidden",transition:"all .15s",
                          boxShadow:"0 1px 3px rgba(0,0,0,.04)"}}
                        onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 4px 14px rgba(0,0,0,.1)";e.currentTarget.style.transform="translateY(-1px)";}}
                        onMouseLeave={e=>{e.currentTarget.style.boxShadow="0 1px 3px rgba(0,0,0,.04)";e.currentTarget.style.transform="";}}>
                        {/* Color strip */}
                        <div style={{height:4,background:getColor(ch),opacity:ch.dashed?.6:1}}/>
                        <div style={{padding:"10px 12px"}}>
                          <div style={{fontSize:9,fontWeight:700,color:getColor(ch),textTransform:"uppercase",letterSpacing:".05em",marginBottom:4,opacity:ch.dashed?.7:1}}>
                            {getLabel(ch)}{ch.dashed?" · Func.":""}
                          </div>
                          <div style={{fontSize:12,fontWeight:600,color:"#2D3748",lineHeight:1.35,marginBottom:ch.titular?4:0}}>
                            {ch.nombre}
                          </div>
                          {ch.titular&&<div style={{fontSize:10.5,color:"#718096",lineHeight:1.3}}>{ch.titular}</div>}
                          {(ch.children||[]).length>0&&(
                            <div style={{marginTop:6,display:"flex",alignItems:"center",gap:4}}>
                              <div style={{width:14,height:2,background:"#E2E8F0",borderRadius:2}}/>
                              <span style={{fontSize:9.5,color:"#A0AEC0",fontWeight:500}}>{ch.children.length} dependencia{ch.children.length!==1?"s":""}</span>
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          ):(
            <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:0,padding:"0 32px",overflow:"auto"}}>
              {/* Landing card */}
              <div style={{maxWidth:480,width:"100%",textAlign:"center"}}>
                <div style={{width:64,height:64,borderRadius:16,background:"linear-gradient(135deg,#38485C,#007BC7)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px",boxShadow:"0 8px 24px rgba(0,123,199,.25)"}}>
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" fill="#fff" opacity=".9"/>
                    <polyline points="9 22 9 12 15 12 15 22" fill="#F5C400" stroke="#38485C" strokeWidth="0.5"/>
                  </svg>
                </div>
                <div style={{fontSize:20,fontWeight:700,color:"#38485C",marginBottom:8,lineHeight:1.2}}>Organigrama de Gobierno</div>
                <div style={{fontSize:13,color:"#718096",lineHeight:1.6,marginBottom:28}}>Ciudad Autónoma de Buenos Aires · {new Date().getFullYear()}</div>
                {/* Stats */}
                <div style={{display:"flex",gap:12,justifyContent:"center",marginBottom:32}}>
                  {[["📋","Organismos",allNodes.length],["🏛️","Ministerios",allNodes.filter(n=>n.tipo==="MIN").length],["📂","Secretarías",allNodes.filter(n=>n.tipo==="SEC").length]].map(([icon,label,count])=>(
                    <div key={label} style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:10,padding:"10px 16px",flex:1,textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,.05)"}}>
                      <div style={{fontSize:18,marginBottom:2}}>{icon}</div>
                      <div style={{fontSize:20,fontWeight:700,color:"#38485C",lineHeight:1}}>{count}</div>
                      <div style={{fontSize:10,color:"#9AABB8",marginTop:2,fontWeight:500}}>{label}</div>
                    </div>
                  ))}
                </div>
                {/* Accesos rápidos: JG + ministerios */}
                <div style={{fontSize:10,fontWeight:700,color:"#9AABB8",textTransform:"uppercase",letterSpacing:".07em",marginBottom:10,textAlign:"left"}}>Acceso rápido</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"flex-start"}}>
                  {[data,...(data.children||[]).filter(n=>n.tipo==="MIN"||n.tipo==="VJG")].slice(0,9).map(n=>(
                    <button key={n.id} onClick={()=>setSelected(n)}
                      style={{padding:"5px 10px",borderRadius:7,fontSize:11,fontWeight:500,cursor:"pointer",
                        fontFamily:"inherit",border:`1px solid ${getColor(n)}22`,
                        background:`${getColor(n)}12`,color:getColor(n),
                        transition:"all .15s"}}
                      onMouseEnter={e=>{e.currentTarget.style.background=getColor(n);e.currentTarget.style.color="#fff";}}
                      onMouseLeave={e=>{e.currentTarget.style.background=`${getColor(n)}12`;e.currentTarget.style.color=getColor(n);}}
                    >{n.nombre.replace("Ministerio de ","Min. ").replace("Secretaría ","Sec. ").replace("Jefatura de Gabinete de Ministros","Jef. de Gabinete")}</button>
                  ))}
                </div>
              </div>
            </div>
          )}
          {/* Panel Empresas del Estado */}
          {activeTab!=="arbol"&&activeTab!=="editor"&&(
            <EmpresasPanel/>
          )}
          <div style={{background:"#F3F6F9",borderTop:"1px solid #E2E8F0",padding:"5px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:10,color:"#A0AEC0"}}>GCBA · Ciudad Autónoma de Buenos Aires · {fechaApp}</span>
            <div style={{display:"flex",gap:12,alignItems:"center"}}>
              <span style={{fontSize:10,color:"#A0AEC0"}}>{allNodes.length} organismos</span>
            </div>
          </div>
        </div>
      </>
      }
      </div>

      {/* Modales */}
      {modal==="edit"&&selected&&(
        <Modal title={`Editar: ${selected.nombre}`} onClose={()=>setModal(null)}>
          <Field label="Nombre" value={editForm.nombre} onChange={v=>setEditForm(f=>({...f,nombre:v}))}/>
          <Field label="Titular" value={editForm.titular} onChange={v=>setEditForm(f=>({...f,titular:v}))}/>
          <TipoSelector tipo={editForm.tipo} tipoLabel={editForm.tipoLabel}
            onChange={(t,tl)=>setEditForm(f=>({...f,tipo:t,tipoLabel:tl}))}/>
          <Field label="">
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13}}>
              <input type="checkbox" checked={editForm.dashed} onChange={e=>setEditForm(f=>({...f,dashed:e.target.checked}))}
                style={{width:14,height:14,accentColor:"#007BC7"}}/>
              Dependencia funcional (línea punteada)
            </label>
          </Field>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:4}}>
            <Btn onClick={()=>setModal(null)}>Cancelar</Btn>
            <Btn variant="primary" onClick={saveEdit}>Guardar</Btn>
          </div>
        </Modal>
      )}
      {modal==="add"&&(
        <Modal title="Nueva unidad" onClose={()=>setModal(null)}>
          <Field label="Nombre" value={addForm.nombre} onChange={v=>setAddForm(f=>({...f,nombre:v}))}/>
          <Field label="Titular" value={addForm.titular} onChange={v=>setAddForm(f=>({...f,titular:v}))}/>
          <TipoSelector tipo={addForm.tipo} tipoLabel={addForm.tipoLabel}
            onChange={(t,tl)=>setAddForm(f=>({...f,tipo:t,tipoLabel:tl}))}/>
          <PadreSelector allNodes={allNodes} currentId={null} value={addForm.parentId} onChange={v=>setAddForm(f=>({...f,parentId:v}))} contextId={selected?.id}/>
          <Field label="">
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13}}>
              <input type="checkbox" checked={addForm.dashed} onChange={e=>setAddForm(f=>({...f,dashed:e.target.checked}))}
                style={{width:14,height:14,accentColor:"#007BC7"}}/>
              Dependencia funcional
            </label>
          </Field>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:4}}>
            <Btn onClick={()=>setModal(null)}>Cancelar</Btn>
            <Btn variant="primary" onClick={saveAdd}>Agregar</Btn>
          </div>
        </Modal>
      )}
      {modal==="move"&&selected&&(
        <Modal title={`Mover: ${selected.nombre}`} onClose={()=>setModal(null)}>
          <PadreSelector allNodes={allNodes} currentId={selected.id} value={editForm.newParentId||""} onChange={v=>setEditForm(f=>({...f,newParentId:v}))} contextId={selected.id}/>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:4}}>
            <Btn onClick={()=>setModal(null)}>Cancelar</Btn>
            <Btn variant="primary" onClick={saveMove}>Mover</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>


<!-- ═══════════════════════════════════════════════════════════
